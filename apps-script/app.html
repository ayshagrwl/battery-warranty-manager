<script>
/**
 * Battery Warranty & Claim Management System — Client Script
 * Ultra-Responsive Single-Page Architecture with In-Memory Bulk State Cache,
 * Real-time Instant Filtering, Multi-Tab Views, and Background Sync.
 */

// ─── GLOBAL IN-MEMORY STORE ──────────────────────────────────────────────────
window.BWMS = {
  config: {},
  models: [],
  dealers: [],
  currentUser: { email: 'staff@distributor.in', name: 'Staff Operator', role: 'OPERATOR' },
  tickets: [],
  claims: [],
  tests: [],
  challans: [],
  dispatches: [],
  dispatchItems: [],
  stockUpdates: [],
  auditLog: [],
  dashboard: {},
  reports: {},
  selectedDispatchClaims: new Set(),
  activeView: 'dashboard',
  labTab: 'queue',
  dispatchTab: 'queue',
  repTab: 'pending',
  stockTab: 'pending',
  challansTab: 'all',
  settingsTab: 'profile',
  isSyncing: false,
  lastSyncedAt: null
};

var CACHE_KEY = 'BWMS_STATE_CACHE_V2';

// ─── INITIALIZATION ──────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

function initApp() {
  // Set default dates across all form inputs
  var today = new Date().toISOString().split('T')[0];
  var dateInputs = ['intake-date', 'test-date', 'claim-dos', 'ret-date', 'dsp-date', 'rep-date', 'close-del-date', 'dash-calc-dos', 'claimstab-calc-dos', 'modal-calc-dos', 'modalcalc-dos'];
  dateInputs.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = today;
  });

  // Setup click outside listener for search suggestions dropdown
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('click', function(e) {
      var searchBox = document.querySelector ? document.querySelector('.search-wrapper') : null;
      var dropdown = document.getElementById('search-suggestions-dropdown');
      if (dropdown && searchBox && !searchBox.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });
  }

  // Global keyboard shortcuts (Press '/' or Ctrl+K for fast search, Esc to close)
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeFastSearchModal();
        closeModal('modal-warranty-calc');
        return;
      }
      var tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
      var isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
      if ((e.key === '/' && !isInput) || ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K'))) {
        e.preventDefault();
        openFastSearchModal();
      }
    });
  }

  // 1. Instant Cold Start from local cache (0ms perceived latency!)
  loadCachedState();

  // 2. Fetch fresh bulk database state in the background
  syncAllData(false);
}

function loadCachedState() {
  var loaded = false;
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      var cached = JSON.parse(raw);
      if (cached && cached.tables) {
        applyStateData(cached);
        updateSyncStatusBadge('Cached (Offline Ready)', 'cached');
        console.log('⚡ Loaded complete database state from instant local cache.');
        loaded = true;
      }
    }
  } catch (err) {
    console.warn('Cache read warning:', err);
  }
  if (!loaded) {
    renderCurrentView();
  }
}

function syncAllData(isManual) {
  if (BWMS.isSyncing) return;
  BWMS.isSyncing = true;
  updateSyncStatusBadge('Syncing cloud...', 'syncing');

  callServer('apiGetBulkState', [], function(res) {
    BWMS.isSyncing = false;
    if (res && res.success && res.data) {
      applyStateData(res.data);
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(res.data));
      } catch (storageErr) {
        console.warn('Failed to cache state to localStorage:', storageErr);
      }
      BWMS.lastSyncedAt = new Date();
      updateSyncStatusBadge('Synced just now', 'online');

      if (isManual) {
        var totalRecords = (BWMS.tickets.length + BWMS.claims.length + BWMS.tests.length);
        showToast('✅ Cloud Sync Complete: ' + totalRecords + ' records updated in memory.', 'success');
      }
    } else {
      updateSyncStatusBadge('Cloud offline', 'offline');
      if (isManual) {
        showToast('Sync warning: ' + ((res && res.error) ? res.error : 'Network error'), 'warning');
      }
    }
  }, function(err) {
    BWMS.isSyncing = false;
    updateSyncStatusBadge('Cloud offline', 'offline');
    console.warn('Bulk sync error:', err);
    if (isManual) {
      showToast('Backend connection error: ' + err, 'error');
    }
  });
}

function applyStateData(data) {
  var t = data.tables || {};
  BWMS.config = data.config || t.Config || BWMS.config;
  BWMS.models = data.models || t.Battery_Models || BWMS.models;
  BWMS.dealers = data.dealers || t.Dealers || BWMS.dealers;
  BWMS.tickets = data.tickets || t.Tickets || [];
  BWMS.claims = data.claims || t.Claims || [];
  BWMS.tests = data.tests || t.Battery_Tests || [];
  BWMS.challans = data.challans || t.Delivery_Challans || [];
  BWMS.dispatches = data.dispatches || t.Company_Dispatches || [];
  BWMS.dispatchItems = data.dispatchItems || t.Company_Dispatch_Items || [];
  BWMS.stockUpdates = data.stockUpdates || t.Stock_Update_Log || [];
  BWMS.auditLog = data.auditLog || t.Audit_Log || [];
  BWMS.currentUser = data.currentUser || BWMS.currentUser;
  BWMS.dashboard = data.dashboard || {};
  BWMS.reports = data.reports || {};

  // Update User Profile Badge
  var userEl = document.getElementById('current-user-name');
  var avatarEl = document.getElementById('current-user-avatar');
  if (userEl) userEl.textContent = BWMS.currentUser.name || BWMS.currentUser.email || 'Staff Operator';
  if (avatarEl) {
    var initials = (BWMS.currentUser.name || 'OP').substring(0, 2).toUpperCase();
    avatarEl.textContent = initials;
  }

  // Populate Dropdowns
  populateDropdowns();

  // Update Settings Form fields
  populateSettingsForm();

  // Re-render currently active view
  renderCurrentView();
}

function updateSyncStatusBadge(text, state) {
  var badge = document.getElementById('sync-status-badge');
  var dot = document.getElementById('sync-dot');
  var label = document.getElementById('sync-status-text');
  var refreshIcon = document.getElementById('sync-refresh-icon');

  if (label) label.textContent = text;
  if (dot) {
    dot.className = 'sync-dot';
    if (state === 'syncing') dot.classList.add('syncing');
    else if (state === 'offline') dot.classList.add('offline');
  }
  if (refreshIcon) {
    if (state === 'syncing') refreshIcon.classList.add('spin');
    else refreshIcon.classList.remove('spin');
  }
  if (badge) {
    badge.title = 'In-Memory fast store: ' + (BWMS.tickets.length || 0) + ' tickets, ' + (BWMS.claims.length || 0) + ' claims. Click to sync with Google Cloud.';
  }

  // Update cloud settings info tab
  var storeStats = document.getElementById('cloud-store-stats');
  if (storeStats) {
    storeStats.textContent = 'Active • ' + (BWMS.tickets.length + BWMS.claims.length + BWMS.tests.length) + ' items in memory';
  }
}

function populateDropdowns() {
  // Model Selects
  var modelSelects = ['intake-model', 'filter-tickets-model', 'filter-claims-model', 'dash-calc-model', 'claimstab-calc-model', 'modal-calc-model', 'modalcalc-model'];
  modelSelects.forEach(function(selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    var currentVal = sel.value;
    var defaultText = selId.startsWith('filter') ? 'All Battery Models' : '-- Select Battery Model --';
    sel.innerHTML = '<option value="' + (selId.startsWith('filter') ? 'ALL' : '') + '">' + defaultText + '</option>';
    (BWMS.models || []).forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m.model_name || m.model_code;
      var gM = m.guarantee_months || 12;
      var pM = m.pro_rata_months || 12;
      var tM = m.warranty_months || 24;
      opt.textContent = (m.model_name || m.model_code) + ' (' + gM + 'G+' + pM + 'P = ' + tM + 'M)';
      sel.appendChild(opt);
    });
    if (currentVal) sel.value = currentVal;
  });

  // Dealer Selects
  var dealerSelects = ['intake-dealer-name'];
  dealerSelects.forEach(function(selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    var currentVal = sel.value;
    sel.innerHTML = '<option value="">-- Select Dealer --</option>';
    BWMS.dealers.forEach(function(d) {
      var opt = document.createElement('option');
      opt.value = d.dealer_name;
      opt.textContent = d.dealer_name + (d.city ? ' (' + d.city + ')' : '');
      sel.appendChild(opt);
    });
    if (currentVal) sel.value = currentVal;
  });
}

function setSelectValueFuzzy(selectEl, query) {
  if (!selectEl || !selectEl.options || !query) return false;
  var q = String(query).trim().toLowerCase();
  // 1. Exact value match
  for (var i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].value.toLowerCase() === q) {
      selectEl.selectedIndex = i;
      return true;
    }
  }
  // 2. Exact text match
  for (var i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].textContent.toLowerCase() === q) {
      selectEl.selectedIndex = i;
      return true;
    }
  }
  // 3. Substring match
  for (var i = 0; i < selectEl.options.length; i++) {
    var optVal = selectEl.options[i].value.toLowerCase();
    var optTxt = selectEl.options[i].textContent.toLowerCase();
    if ((optVal && (optVal.indexOf(q) !== -1 || q.indexOf(optVal) !== -1)) ||
        (optTxt && (optTxt.indexOf(q) !== -1 || q.indexOf(optTxt) !== -1))) {
      selectEl.selectedIndex = i;
      return true;
    }
  }
  // 4. Token match (e.g. 42B20R, 0BH40B20R, EPIQ35R)
  var tokens = q.split(/[\s\-_(),/]+/).filter(function(t) { return t.length >= 4; });
  if (tokens.length > 0) {
    for (var i = 0; i < selectEl.options.length; i++) {
      var hay = (selectEl.options[i].value + ' ' + selectEl.options[i].textContent).toLowerCase();
      var matched = tokens.some(function(tok) { return hay.indexOf(tok) !== -1; });
      if (matched) {
        selectEl.selectedIndex = i;
        return true;
      }
    }
  }
  // 5. If still no match and query is non-empty, add dynamic option so value isn't lost
  if (q) {
    var opt = document.createElement('option');
    opt.value = query;
    opt.textContent = query;
    selectEl.appendChild(opt);
    selectEl.value = query;
    return true;
  }
  return false;
}

function populateSettingsForm() {
  if (BWMS.config.COMPANY_NAME) document.getElementById('cfg-company-name').value = BWMS.config.COMPANY_NAME;
  if (BWMS.config.COMPANY_GST) document.getElementById('cfg-company-gst').value = BWMS.config.COMPANY_GST;
  if (BWMS.config.COMPANY_ADDRESS) document.getElementById('cfg-company-address').value = BWMS.config.COMPANY_ADDRESS;
  if (BWMS.config.COMPANY_PHONE) document.getElementById('cfg-company-phone').value = BWMS.config.COMPANY_PHONE;
  if (BWMS.config.COMPANY_EMAIL) document.getElementById('cfg-company-email').value = BWMS.config.COMPANY_EMAIL;
  if (BWMS.config.COMPANY_TERMS) {
    var termsEl = document.getElementById('cfg-company-terms');
    if (termsEl) termsEl.value = BWMS.config.COMPANY_TERMS;
  }
}

// ─── INSTANT NAVIGATION & ROUTING ─────────────────────────────────────────────

function navigateTo(viewName, params) {
  BWMS.activeView = viewName;
  var views = document.querySelectorAll('.app-view');
  views.forEach(function(v) { v.style.display = 'none'; });

  var targetView = document.getElementById('view-' + viewName);
  if (targetView) targetView.style.display = 'block';

  var navItems = document.querySelectorAll('.sidebar-nav .nav-item');
  navItems.forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-view') === viewName) {
      item.classList.add('active');
    }
  });

  // Close mobile sidebar if open
  var sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }

  // Render view instantly from local memory
  renderCurrentView(params);
}

function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.classList.toggle('open');
}

function renderCurrentView(params) {
  var v = BWMS.activeView;
  if (v === 'dashboard') renderDashboard();
  else if (v === 'tickets') renderTicketsTable(params);
  else if (v === 'lab') renderLabTables();
  else if (v === 'claims') renderClaimsTable(params);
  else if (v === 'pending-company') renderDispatchTables();
  else if (v === 'replacement-pending') renderReplacementsTables();
  else if (v === 'stock-tasks') renderStockTasksTables();
  else if (v === 'challans') renderChallansTable(params);
  else if (v === 'reports') renderReportsView();
  else if (v === 'audit') renderAuditTable();
  else if (v === 'settings') renderSettingsView();
}

// ─── DASHBOARD VIEW RENDERER ──────────────────────────────────────────────────

function renderDashboard() {
  var tickets = BWMS.tickets || [];
  var claims = BWMS.claims || [];

  // Calculate live counts
  var underTesting = tickets.filter(function(t) { return t.status === 'RECEIVED' || t.status === 'TESTING'; }).length;
  var readyForCompany = claims.filter(function(c) { return c.status === 'CLAIM_CREATED' || c.status === 'READY_FOR_COMPANY'; }).length;
  var sentToCompany = claims.filter(function(c) { return c.status === 'SENT_TO_COMPANY'; }).length;
  var rejectedReturnPending = tickets.filter(function(t) {
    var s = (t.status || '').toUpperCase();
    return s === 'REJECTED_RETURN_PENDING' || s === 'REJECTED — RETURN PENDING' || s === 'TEST_REJECTED';
  }).length;
  var stockTasksPending = claims.filter(function(c) {
    var s = (c.status || '').toUpperCase();
    return (s === 'REPLACEMENT_RECEIVED' || s === 'STOCK_UPDATED') && c.stock_status !== 'UPDATED';
  }).length;

  // Ageing > 15 days
  var overdue15Count = claims.filter(function(c) {
    if (c.status !== 'SENT_TO_COMPANY') return false;
    var d = calcDaysElapsed(c.company_dispatch_date);
    return d > 15;
  }).length;

  // Render Visual Warranty Pipeline
  renderWarrantyPipeline('dashboard-pipeline-container');

  // KPI Elements
  setElText('kpi-total-tickets', tickets.length);
  setElText('kpi-pending-tests', underTesting);
  setElText('kpi-pending-company', readyForCompany);
  setElText('kpi-replacement-due', sentToCompany);
  setElText('kpi-stock-tasks', stockTasksPending);

  // Sidebar Badges
  setElText('badge-tickets', tickets.length);
  setElText('badge-lab', underTesting);
  setElText('badge-claims', claims.length);
  setElText('badge-pending-company', readyForCompany);
  setElText('badge-replacement-due', sentToCompany);
  setElText('badge-stock-tasks', stockTasksPending);

  // Attention Counts
  setElText('att-lab-count', underTesting);
  setElText('att-return-count', rejectedReturnPending);
  setElText('att-dispatch-count', readyForCompany);
  setElText('att-ageing-count', overdue15Count);
  setElText('att-stock-count', stockTasksPending);

  // Recent Tickets Feed (newest 12)
  var tbody = document.getElementById('dashboard-recent-tickets');
  if (!tbody) return;
  tbody.innerHTML = '';
  var recents = tickets.slice().reverse().slice(0, 12);

  if (recents.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:15px; color:#94a3b8;">No intake tickets recorded yet. Click "+ Receive Battery" to begin.</td></tr>';
    return;
  }

  recents.forEach(function(t) {
    var nextAction = getTicketNextAction(t);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + t.ticket_no + '\')">' + t.ticket_no + '</strong></td>' +
      '<td>' + renderSourceBadge(t.source_type) + '</td>' +
      '<td><strong>' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + '</small></td>' +
      '<td>' + t.battery_model + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
      '<td>' + formatDate(t.date_received) + '</td>' +
      '<td>' + renderStatusBadge(t.status) + '</td>' +
      '<td><span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span></td>' +
      '<td>' + renderTicketActions(t) + '</td>';
    tbody.appendChild(tr);
  });
}

// ─── TICKETS (RECEIVE BATTERY) RENDERER ────────────────────────────────────────

function renderTicketsTable(params) {
  if (params && params.status && document.getElementById('filter-tickets-status')) {
    document.getElementById('filter-tickets-status').value = params.status;
  }
  if (params && params.search && document.getElementById('filter-tickets-search')) {
    document.getElementById('filter-tickets-search').value = params.search;
  }

  var search = (document.getElementById('filter-tickets-search') ? document.getElementById('filter-tickets-search').value : '').toLowerCase().trim();
  var statusFilter = document.getElementById('filter-tickets-status') ? document.getElementById('filter-tickets-status').value : 'ALL';
  var sourceFilter = document.getElementById('filter-tickets-source') ? document.getElementById('filter-tickets-source').value : 'ALL';
  var modelFilter = document.getElementById('filter-tickets-model') ? document.getElementById('filter-tickets-model').value : 'ALL';

  var tickets = BWMS.tickets || [];
  var filtered = tickets.filter(function(t) {
    if (statusFilter !== 'ALL') {
      var ts = (t.status || '').toUpperCase();
      var sf = statusFilter.toUpperCase();
      if (sf === 'PASSED') {
        if (ts !== 'PASSED' && ts !== 'TEST_PASSED') return false;
      } else if (sf === 'REJECTED_RETURN_PENDING') {
        if (ts !== 'REJECTED_RETURN_PENDING' && ts !== 'REJECTED — RETURN PENDING' && ts !== 'TEST_REJECTED') return false;
      } else if (sf === 'REJECTED_RETURNED') {
        if (ts !== 'REJECTED_RETURNED' && ts !== 'REJECTED — RETURNED') return false;
      } else if (sf === 'CLOSED') {
        if (ts !== 'CLOSED' && ts !== 'CLAIM_CLOSED' && ts !== 'REJECTED_RETURNED' && ts !== 'REJECTED — RETURNED') return false;
      } else if (ts !== sf) {
        return false;
      }
    }
    if (sourceFilter !== 'ALL' && t.source_type !== sourceFilter) return false;
    if (modelFilter !== 'ALL' && t.battery_model !== modelFilter) return false;
    if (search) {
      var blob = [
        t.ticket_no,
        t.customer_name,
        t.dealer_name,
        t.mobile,
        t.vehicle_number,
        t.battery_model,
        t.original_serial_no,
        t.remarks
      ].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  // Render Visual Warranty Pipeline
  renderWarrantyPipeline('tickets-pipeline-container', statusFilter);

  // Update counter badge
  var countBadge = document.getElementById('tickets-count-badge');
  if (countBadge) countBadge.textContent = filtered.length + ' of ' + tickets.length + ' records';

  var tbody = document.getElementById('tickets-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:25px; color:#94a3b8;">No matching intake tickets found.</td></tr>';
    return;
  }

  // Reverse to show latest first
  filtered.slice().reverse().forEach(function(t) {
    var nextAction = getTicketNextAction(t);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + t.ticket_no + '\')">' + t.ticket_no + '</strong></td>' +
      '<td>' + renderSourceBadge(t.source_type) + '</td>' +
      '<td><strong>' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + (t.vehicle_number ? ' • ' + t.vehicle_number : '') + '</small></td>' +
      '<td>' + t.battery_model + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
      '<td>' + formatDate(t.date_received) + '</td>' +
      '<td>' + (t.service_battery_issued ? '<span class="badge badge-blue">Lent: ' + (t.service_battery_serial || 'Yes') + '</span>' : '<span style="color:#94a3b8;">None</span>') + '</td>' +
      '<td>' + renderStatusBadge(t.status) + '</td>' +
      '<td><span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span></td>' +
      '<td>' + renderTicketActions(t) + '</td>';
    tbody.appendChild(tr);
  });
}

function openIntakeModal(prefill) {
  document.getElementById('form-intake').reset();
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('intake-date').value = today;
  toggleSourceFields();
  toggleServiceBatteryFields();

  if (prefill) {
    if (prefill.model && document.getElementById('intake-model')) {
      setSelectValueFuzzy(document.getElementById('intake-model'), prefill.model);
    }
    if (prefill.serial && document.getElementById('intake-serial')) {
      document.getElementById('intake-serial').value = prefill.serial;
    }
    if (prefill.customer_name && document.getElementById('intake-customer-name')) {
      document.getElementById('intake-customer-name').value = prefill.customer_name;
    }
    if (prefill.mobile && document.getElementById('intake-mobile')) {
      document.getElementById('intake-mobile').value = prefill.mobile;
    }
    if (prefill.dos && document.getElementById('intake-remarks')) {
      var rem = document.getElementById('intake-remarks').value;
      if (!rem || rem.indexOf('Purchase Date') === -1) {
        document.getElementById('intake-remarks').value = (rem ? rem + ' | ' : '') + 'Purchase Date: ' + prefill.dos;
      }
    }
  }

  openModal('modal-intake');
}

function toggleSourceFields() {
  var src = document.getElementById('intake-source').value;
  var dGroup = document.getElementById('group-dealer');
  if (dGroup) dGroup.style.display = (src === 'DEALER') ? 'block' : 'none';
}

function toggleServiceBatteryFields() {
  var val = document.getElementById('intake-service-issued').value;
  var show = (val === 'YES');
  var mGroup = document.getElementById('group-sb-model');
  var sGroup = document.getElementById('group-sb-serial');
  if (mGroup) mGroup.style.display = show ? 'block' : 'none';
  if (sGroup) sGroup.style.display = show ? 'block' : 'none';
}

function handleIntakeSubmit(e) {
  e.preventDefault();
  var ticketData = {
    source_type: document.getElementById('intake-source').value,
    dealer_name: document.getElementById('intake-dealer-name').value,
    customer_name: document.getElementById('intake-customer-name').value,
    mobile: document.getElementById('intake-mobile').value,
    address: document.getElementById('intake-address').value,
    vehicle_number: document.getElementById('intake-vehicle').value,
    battery_model: document.getElementById('intake-model').value,
    original_serial_no: document.getElementById('intake-serial').value.trim(),
    date_received: document.getElementById('intake-date').value,
    service_battery_issued: document.getElementById('intake-service-issued').value === 'YES',
    service_battery_model: document.getElementById('intake-sb-model').value,
    service_battery_serial: document.getElementById('intake-sb-serial').value,
    remarks: document.getElementById('intake-remarks').value
  };

  closeModal('modal-intake');

  // Optimistic local update
  var tempTicketNo = 'TKT-TEMP-' + Math.floor(Math.random() * 9000 + 1000);
  var optimisticTicket = Object.assign({}, ticketData, {

function renderLabTables() {
  var search = (document.getElementById('filter-lab-search') ? document.getElementById('filter-lab-search').value : '').toLowerCase().trim();
  var verdictFilter = document.getElementById('filter-lab-verdict') ? document.getElementById('filter-lab-verdict').value : 'ALL';

  // Render Queue Table
  var tbodyQueue = document.getElementById('lab-queue-body');
  if (tbodyQueue) {
    tbodyQueue.innerHTML = '';
    var filteredQueue = queueItems.filter(function(t) {
      if (!search) return true;
      var blob = [t.ticket_no, t.customer_name, t.dealer_name, t.battery_model, t.original_serial_no, t.remarks].join(' ').toLowerCase();
      return blob.indexOf(search) !== -1;

    } else {
      filteredQueue.forEach(function(t) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + t.ticket_no + '</strong></td>' +
          '<td><strong>' + (t.customer_name || t.dealer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + '</small></td>' +

          '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
          '<td>' + formatDate(t.date_received) + '</td>' +
          '<td>' + (t.remarks || 'No symptoms noted') + '</td>' +
          '<td><button class="btn btn-primary btn-sm" onclick="openTestModal(\'' + t.ticket_no + '\', \'' + t.battery_model + '\', \'' + t.original_serial_no + '\')">🔬 Conduct Test</button></td>';
        tbodyQueue.appendChild(tr);
      });
    }
  }

  // Render Completed History Table
  var tbodyHistory = document.getElementById('lab-history-body');
  if (tbodyHistory) {
    tbodyHistory.innerHTML = '';
    var tests = BWMS.tests || [];
    var filteredHistory = tests.filter(function(tst) {
      if (verdictFilter !== 'ALL' && tst.test_result !== verdictFilter) return false;
      if (search) {
        var blob = [tst.test_id, tst.ticket_no, tst.original_serial_no, tst.tested_by, tst.test_remarks].join(' ').toLowerCase();
        if (blob.indexOf(search) === -1) return false;
      }
      return true;
    });

    if (filteredHistory.length === 0) {
      tbodyHistory.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No completed diagnostic tests found.</td></tr>';
    } else {
      filteredHistory.slice().reverse().forEach(function(tst) {
        var tr = document.createElement('tr');
        var isPass = (tst.test_result === 'PASS');
        var linkedClaim = (BWMS.claims || []).find(function(c) { return c.ticket_no === tst.ticket_no; });
        var retChallan = (BWMS.challans || []).find(function(ch) { return ch.ticket_no === tst.ticket_no && (ch.challan_type === 'BATTERY_RETURN' || !ch.challan_type); });

        var actionBtns = '<div style="display:flex; gap:6px; flex-wrap:wrap;">';
        if (isPass) {
          if (!linkedClaim) {
            actionBtns += '<button class="btn btn-success btn-sm" onclick="openClaimModal(\'' + tst.ticket_no + '\')">📝 + File Claim</button>';
          } else {
            actionBtns += '<button class="btn btn-warning btn-sm" onclick="navigateTo(\'pending-company\')">🚚 Dispatch</button>';
          }
        } else {
          if (!retChallan) {
            actionBtns += '<button class="btn btn-danger btn-sm" onclick="createReturnChallan(\'' + tst.ticket_no + '\')">📄 + Challan</button>';
          } else {
            actionBtns += '<button class="btn btn-secondary btn-sm" onclick="printReturnChallan(\'' + retChallan.challan_no + '\')">🖨️ Challan</button>';
            if (retChallan.status !== 'ACKNOWLEDGED') {
              actionBtns += '<button class="btn btn-danger btn-sm" onclick="openMarkReturnedModal(\'' + retChallan.challan_no + '\')">🤝 Handover</button>';
            }
          }
        }
        actionBtns += '<button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + tst.ticket_no + '\')">Timeline</button>';
        actionBtns += '</div>';

        tr.innerHTML =
          '<td><strong style="color:var(--accent);">' + (tst.test_id || 'TST-') + '</strong></td>' +
          '<td><small onclick="showTimeline(\'' + tst.ticket_no + '\')" style="cursor:pointer; color:var(--text-muted);">' + tst.ticket_no + '</small></td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + tst.original_serial_no + '</span></td>' +
          '<td>' + formatDate(tst.test_date) + '</td>' +
          '<td><strong>' + (tst.open_circuit_voltage ? tst.open_circuit_voltage + 'V' : '-') + '</strong></td>' +
          '<td>' + renderTestVerdictBadge(tst.test_result) + '</td>' +

        tbodyHistory.appendChild(tr);
      });
    }
  }

function handleTestSubmit(e) {
  e.preventDefault();
  var testData = {
    ticket_no: document.getElementById('test-ticket-no').value,
    test_result: document.getElementById('test-result').value,
    test_date: document.getElementById('test-date').value,
    tested_by: document.getElementById('test-tested-by').value,
    open_circuit_voltage: document.getElementById('test-voltage').value,
    specific_gravity: document.getElementById('test-gravity') ? document.getElementById('test-gravity').value : '',
    load_test_voltage: document.getElementById('test-load-voltage') ? document.getElementById('test-load-voltage').value : '',

    test_remarks: document.getElementById('test-remarks').value
  };

  // Optimistic local update with canonical backend status
  var tkt = BWMS.tickets.find(function(t) { return t.ticket_no === testData.ticket_no; });

        }
      }
    } else {
      showToast((res && res.error) ? res.error : 'Failed to record test', 'error');
      syncAllData(false);
    }
  });
}

function renderClaimsTable(params) {
  if (params && params.status && document.getElementById('filter-claims-status')) {
    document.getElementById('filter-claims-status').value = params.status;
  }
  if (params && params.search && document.getElementById('filter-claims-search')) {
    document.getElementById('filter-claims-search').value = params.search;
  }

  var search = (document.getElementById('filter-claims-search') ? document.getElementById('filter-claims-search').value : '').toLowerCase().trim();
  var statusFilter = document.getElementById('filter-claims-status') ? document.getElementById('filter-claims-status').value : 'ALL';
  var warrantyFilter = document.getElementById('filter-claims-warranty') ? document.getElementById('filter-claims-warranty').value : 'ALL';
  var modelFilter = document.getElementById('filter-claims-model') ? document.getElementById('filter-claims-model').value : 'ALL';

  var claims = BWMS.claims || [];
  var filtered = claims.filter(function(c) {
    if (statusFilter !== 'ALL') {
      var cs = (c.status || '').toUpperCase();
      var sf = statusFilter.toUpperCase();
      if (sf === 'CLOSED' || sf === 'CLAIM_CLOSED') {
        if (cs !== 'CLOSED' && cs !== 'CLAIM_CLOSED') return false;
      } else if (sf === 'STOCK_UPDATED') {
        if (cs !== 'STOCK_UPDATED' && (cs !== 'REPLACEMENT_RECEIVED' || c.stock_status !== 'UPDATED')) return false;
      } else if (cs !== sf) {
        return false;
      }
    }
    if (warrantyFilter !== 'ALL') {
      var ws = (c.warranty_status || '').toUpperCase();
      var cov = (c.coverage_type || '').toUpperCase();
      var rem = (c.remarks || '').toUpperCase();
      var wf = warrantyFilter.toUpperCase();
      if (wf === 'PRO_RATA') {
        if (ws !== 'PRO_RATA' && cov !== 'PRO_RATA' && rem.indexOf('PRO-RATA') === -1) return false;
      } else if (wf === 'IN_WARRANTY') {
        if (ws !== 'IN_WARRANTY' && cov !== 'FULL_REPLACEMENT') return false;
      } else if (wf === 'OUT_OF_WARRANTY') {
        if (ws !== 'OUT_OF_WARRANTY' && ws !== 'EXPIRED' && cov !== 'EXPIRED') return false;
      } else if (ws !== wf) {
        return false;
      }
    }
    if (modelFilter !== 'ALL' && c.battery_model !== modelFilter) return false;
    if (search) {
      var blob = [
        c.claim_no,
        c.ticket_no,
        c.customer_name,
        c.dealer_name,
        c.mobile,
        c.battery_model,
        c.original_serial_no,
        c.replacement_serial_no
      ].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  // Render Visual Warranty Pipeline
  renderWarrantyPipeline('claims-pipeline-container', statusFilter);

  setElText('claims-count-badge', filtered.length + ' of ' + claims.length + ' claims');

  var tbody = document.getElementById('claims-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:25px; color:#94a3b8;">No matching claims found.</td></tr>';
    return;
  }

  filtered.slice().reverse().forEach(function(c) {
    var nextAction = getClaimNextAction(c);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
      '<td><small onclick="showTimeline(\'' + c.ticket_no + '\')" style="cursor:pointer; color:var(--text-muted);">' + c.ticket_no + '</small></td>' +
      '<td><strong>' + (c.customer_name || c.dealer_name) + '</strong><br><small style="color:#64748b;">' + (c.mobile || '') + '</small></td>' +
      '<td>' + c.battery_model + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + c.original_serial_no + '</span></td>' +
      '<td>Sale: ' + formatDate(c.date_of_sale) + '<br><small>Exp: ' + formatDate(c.warranty_expiry_date) + '</small></td>' +
      '<td>' + renderWarrantyBadge(c.warranty_status) + '</td>' +
      '<td>' + renderStatusBadge(c.status) + '</td>' +
      '<td><span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span></td>' +
      '<td>' + renderClaimActions(c) + '</td>';
    tbody.appendChild(tr);
  });
}

function openClaimModal(ticketNo) {
  var t = (BWMS.tickets || []).find(function(item) { return item.ticket_no === ticketNo; });
  if (!t) {
    showToast('Ticket not found in local memory', 'error');
    return;
  }

  document.getElementById('form-claim').reset();
  document.getElementById('claim-ticket-no').value = t.ticket_no;
  document.getElementById('claim-view-ticket').textContent = t.ticket_no;
  document.getElementById('claim-view-party').textContent = (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) || '';
  document.getElementById('claim-view-model').textContent = t.battery_model || '';
  document.getElementById('claim-view-serial').textContent = t.original_serial_no || '';

  // Look up model specifications via fuzzy resolver
  var m = findBatteryModel(t.battery_model);
  var calcPreview = calculateWarrantyDetails(t.battery_model, null, null);
  var totalMonths = calcPreview.totalMonths;
  var guaranteeMonths = calcPreview.guaranteeMonths;
  var proRataMonths = calcPreview.proRataMonths;

  var specsEl = document.getElementById('claim-model-specs');
  if (specsEl) {
    specsEl.innerHTML =
      '<span class="badge badge-blue">Warranty: ' + totalMonths + 'M (' + guaranteeMonths + 'G + ' + proRataMonths + 'P)</span> ' +
      (m && m.brand ? '<span class="badge badge-gray">' + m.brand + '</span> ' : '') +
      (m && m.capacity_ah ? '<span class="badge badge-gray">' + m.capacity_ah + ' Ah</span>' : '');
  }

  var dosInput = document.getElementById('claim-dos');
  if (dosInput) {
    var extractedDos = '';
    if (t.remarks && t.remarks.indexOf('Purchase Date:') !== -1) {
      var matchDos = t.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
      if (matchDos) extractedDos = matchDos[1];
    }
    if (t.date_of_sale) {
      dosInput.value = t.date_of_sale.indexOf('T') !== -1 ? t.date_of_sale.split('T')[0] : t.date_of_sale;
    } else if (extractedDos) {
      dosInput.value = extractedDos;
    } else {
      var d = new Date();
      d.setMonth(d.getMonth() - 6);
      dosInput.value = d.toISOString().split('T')[0];
    }
  }

  var mrpInput = document.getElementById('claim-mrp');
  if (mrpInput) {
    mrpInput.value = calcPreview.mrp || 5500;
  }

  calculateClaimWarranty();
  openModal('modal-claim');
}

function calculateClaimWarranty() {
  var model = document.getElementById('claim-view-model') ? document.getElementById('claim-view-model').textContent : '';
  var dos = document.getElementById('claim-dos') ? document.getElementById('claim-dos').value : '';
  var mrp = document.getElementById('claim-mrp') ? document.getElementById('claim-mrp').value : '';
  var box = document.getElementById('claim-calc-box');
  if (!box) return;

  if (!model || !dos) {
    box.innerHTML = 'Enter date of sale to calculate';
    return;
  }

  var calc = calculateWarrantyDetails(model, dos, null, mrp);
  if (!calc.hasDate) {
    box.innerHTML = 'Enter valid date of sale';
    return;
  }

  if (calc.status === 'FULL_GUARANTEE') {
    box.innerHTML =
      '<div style="color:#16a34a; font-weight:700;">✅ FULL GUARANTEE (100% Free Replacement)</div>' +
      '<div style="font-size:12px; color:#334155; margin-top:2px;">Within ' + calc.guaranteeMonths + 'M free guarantee window (Guar Exp: ' + formatDate(calc.guaranteeExpiry) + ') • Customer Payable: <strong style="color:#16a34a;">₹0.00</strong></div>';
  } else if (calc.status === 'PRO_RATA') {
    box.innerHTML =
      '<div style="color:#0284c7; font-weight:700;">⚖️ PRO-RATA WARRANTY (' + calc.discountPercent + '% Discount)</div>' +
      '<div style="font-size:12px; color:#334155; margin-top:2px;">Month ' + (calc.diffMonths + 1) + ' of ' + calc.totalMonths + ' (Exp: ' + formatDate(calc.warrantyExpiry) + ') • Discount: <strong>' + calc.discountPercent + '%</strong> • Customer Pays: <strong style="color:#0369a1;">' + calc.payablePercent + '% (₹' + calc.customerPayable.toLocaleString('en-IN') + ' on ₹' + calc.mrp.toLocaleString('en-IN') + ' MRP)</strong></div>';
  } else {
    box.innerHTML =
      '<div style="color:#dc2626; font-weight:700;">❌ OUT OF WARRANTY (Expired on ' + formatDate(calc.warrantyExpiry) + ')</div>' +
      '<div style="font-size:12px; color:#334155; margin-top:2px;">Battery is outside manufacturer warranty window (' + calc.totalMonths + ' months). Standard scrap exchange discount can be applied.</div>';
  }
}

  else BWMS.selectedDispatchClaims.delete(cb.value);

}

function toggleSelectAllDispatch(checked) {
  var cbs = document.querySelectorAll('.chk-dispatch-item');
  cbs.forEach(function(cb) {
    cb.checked = checked;
    if (checked) BWMS.selectedDispatchClaims.add(cb.value);
    else BWMS.selectedDispatchClaims.delete(cb.value);
  });
  updateSelectedDispatchCount();
}

function updateSelectedDispatchCount() {
  var count = BWMS.selectedDispatchClaims.size;
  setElText('selected-dispatch-count', count + ' claims selected');
}

function openDispatchBatchModal() {
  if (BWMS.selectedDispatchClaims.size === 0) {
    showToast('Please select at least one claim to dispatch to the company.', 'warning');
    return;
  }
  document.getElementById('form-dispatch').reset();

    list.appendChild(div);

function handleDispatchSubmit(e) {
  e.preventDefault();

  var docketVal = document.getElementById('dsp-docket').value;
  var companyVal = document.getElementById('dsp-company-name').value;

// ─── REPLACEMENTS DUE & AGEING RENDERER ───────────────────────────────────────

function switchReplacementTab(tab) {
  BWMS.repTab = tab;
  var btnPending = document.getElementById('tab-btn-rep-pending');
  var btnHistory = document.getElementById('tab-btn-rep-history');
  var containerPending = document.getElementById('container-rep-pending');
  var containerHistory = document.getElementById('container-rep-history');

  if (btnPending) btnPending.classList.toggle('active', tab === 'pending');
  if (btnHistory) btnHistory.classList.toggle('active', tab === 'history');
  if (containerPending) containerPending.style.display = (tab === 'pending') ? 'block' : 'none';
  if (containerHistory) containerHistory.style.display = (tab === 'history') ? 'block' : 'none';

  renderReplacementsTables();
}

function renderReplacementsTables() {
  var search = (document.getElementById('filter-rep-search') ? document.getElementById('filter-rep-search').value : '').toLowerCase().trim();
  var ageingFilter = document.getElementById('filter-rep-ageing') ? document.getElementById('filter-rep-ageing').value : 'ALL';

  var dueClaims = (BWMS.claims || []).filter(function(c) {
    return c.status === 'SENT_TO_COMPANY';
  });

  var receivedClaims = (BWMS.claims || []).filter(function(c) {
    var s = (c.status || '').toUpperCase();
    return s === 'REPLACEMENT_RECEIVED' || s === 'STOCK_UPDATED' || s === 'CLOSED' || s === 'CLAIM_CLOSED';
  });

  setElText('rep-pending-count', dueClaims.length);
  setElText('rep-history-count', receivedClaims.length);
  setElText('rep-count-badge', dueClaims.length + ' pending');

  // Pending Requisitions Table
  var tbodyPending = document.getElementById('replacement-pending-body');
  if (tbodyPending) {
    tbodyPending.innerHTML = '';
    var filtered = dueClaims.filter(function(c) {
      var days = calcDaysElapsed(c.company_dispatch_date);
      if (ageingFilter === '0-7' && days > 7) return false;
      if (ageingFilter === '8-15' && (days < 8 || days > 15)) return false;
      if (ageingFilter === '16-30' && (days < 16 || days > 30)) return false;
      if (ageingFilter === '31+' && days < 31) return false;

      if (search) {
        var blob = [c.claim_no, c.company_challan_no, c.customer_name, c.dealer_name, c.battery_model, c.original_serial_no].join(' ').toLowerCase();
        if (blob.indexOf(search) === -1) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbodyPending.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:25px; color:#16a34a;">No replacement batteries pending from company.</td></tr>';
    } else {
      filtered.forEach(function(c) {
        var days = calcDaysElapsed(c.company_dispatch_date);
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
          '<td><small>' + (c.company_challan_no || c.dispatch_batch_no || 'Batch') + '</small></td>' +
          '<td><strong>' + (c.customer_name || c.dealer_name) + '</strong><br><small style="color:#64748b;">' + (c.mobile || '') + '</small></td>' +
          '<td>' + c.battery_model + '</td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + c.original_serial_no + '</span></td>' +
          '<td>' + formatDate(c.company_dispatch_date) + '</td>' +
          '<td>' + renderAgeingBadge(days) + '</td>' +
          '<td><button class="btn btn-success btn-sm" onclick="openReplacementModal(\'' + c.claim_no + '\', \'' + c.battery_model + '\', \'' + c.original_serial_no + '\')">📥 Receive Replacement</button></td>';
        tbodyPending.appendChild(tr);
      });
    }
  }

  // Received History Table
  var tbodyHistory = document.getElementById('replacement-history-body');
  if (tbodyHistory) {
    tbodyHistory.innerHTML = '';
    if (receivedClaims.length === 0) {
      tbodyHistory.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:25px; color:#94a3b8;">No replacement batteries logged yet.</td></tr>';
    } else {
      receivedClaims.slice().reverse().forEach(function(c) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
          '<td>' + c.battery_model + '</td>' +
          '<td><span style="font-family:monospace; color:#64748b;">' + c.original_serial_no + '</span></td>' +
          '<td><span style="font-family:monospace; font-weight:bold; color:#16a34a;">' + (c.replacement_serial_no || c.replacement_battery_serial_no || '-') + '</span></td>' +
          '<td>' + formatDate(c.replacement_received_date) + '</td>' +
          '<td>' + (c.stock_ref_no || '-') + '</td>' +
          '<td>' + (c.stock_status === 'UPDATED' ? '<span class="badge badge-green">ERP RECONCILED</span>' : '<span class="badge badge-danger">STOCK PENDING</span>') + '</td>' +
          '<td><div style="display:flex; gap:6px;">' +
          (c.stock_status !== 'UPDATED' ? '<button class="btn btn-primary btn-sm" onclick="openStockModal(\'' + c.claim_no + '\')">✍️ Stock Task</button>' : (c.status !== 'CLOSED' && c.status !== 'CLAIM_CLOSED' ? '<button class="btn btn-success btn-sm" onclick="openCloseClaimModal(\'' + c.claim_no + '\')">🤝 Deliver & Close</button>' : '<span class="badge badge-green">Closed</span>')) +
          '  <button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + c.claim_no + '\')">Timeline</button>' +
          '</div></td>';
        tbodyHistory.appendChild(tr);
      });
    }
  }
}

  });

  var tbodyPending = document.getElementById('stock-tasks-body');
  if (tbodyPending) {
    tbodyPending.innerHTML = '';
    var filtered = pendingTasks.filter(function(c) {
      if (!search) return true;
      var blob = [c.claim_no, c.battery_model, c.replacement_serial_no, c.original_serial_no].join(' ').toLowerCase();
      return blob.indexOf(search) !== -1;
    });

    if (filtered.length === 0) {

          '<td><span style="font-family:monospace; color:#64748b;">' + c.original_serial_no + '</span></td>' +
          '<td>' + formatDate(c.replacement_received_date) + '</td>' +
          '<td><span class="badge badge-danger">STOCK UPDATE REQUIRED</span></td>' +
          '<td><button class="btn btn-primary btn-sm" onclick="openStockModal(\'' + c.claim_no + '\')">✍️ Certify ERP Entry</button></td>';
        tbodyPending.appendChild(tr);
      });
    }
  }

  // Reconciled Log Table
  var tbodyHistory = document.getElementById('stock-history-body');
  if (tbodyHistory) {
    tbodyHistory.innerHTML = '';
    var logs = BWMS.stockUpdates || [];
    if (logs.length === 0) {
      tbodyHistory.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No inventory stock reconciliation logs found.</td></tr>';

          actionBtns += '<button class="btn btn-success btn-sm" onclick="openCloseClaimModal(\'' + l.claim_no + '\')">🤝 Handover & Close</button>';
        } else {
          actionBtns += '<span class="badge badge-green">Closed</span>';
        }
        actionBtns += '<button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + l.claim_no + '\')">Timeline</button>';
        actionBtns += '</div>';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent);">' + (l.stock_task_id || 'STK-') + '</strong></td>' +
          '<td><small onclick="showTimeline(\'' + l.claim_no + '\')" style="cursor:pointer; color:var(--text-muted);">' + l.claim_no + '</small></td>' +

        tbodyHistory.appendChild(tr);

function switchChallansTab(tab) {
  BWMS.challansTab = tab;
  var btnAll = document.getElementById('tab-btn-ch-all');
  var btnRet = document.getElementById('tab-btn-ch-ret');
  var btnCom = document.getElementById('tab-btn-ch-com');

  if (btnAll) btnAll.classList.toggle('active', tab === 'all');
  if (btnRet) btnRet.classList.toggle('active', tab === 'ret');
  if (btnCom) btnCom.classList.toggle('active', tab === 'com');

  renderChallansTable();
}

function renderChallansTable(params) {
  if (params && params.tab) {
    BWMS.challansTab = params.tab;
    var btnAll = document.getElementById('tab-btn-ch-all');
    var btnRet = document.getElementById('tab-btn-ch-ret');
    var btnCom = document.getElementById('tab-btn-ch-com');
    if (btnAll) btnAll.classList.toggle('active', params.tab === 'all');
    if (btnRet) btnRet.classList.toggle('active', params.tab === 'ret');
    if (btnCom) btnCom.classList.toggle('active', params.tab === 'com');
  }
  if (params && params.filter && document.getElementById('filter-challans-search')) {
    document.getElementById('filter-challans-search').value = params.filter;
  }
  if (params && params.search && document.getElementById('filter-challans-search')) {
    document.getElementById('filter-challans-search').value = params.search;
  }

  var search = (document.getElementById('filter-challans-search') ? document.getElementById('filter-challans-search').value : '').toLowerCase().trim();
  var tab = BWMS.challansTab || 'all';

  var list = [];
  var seenChallans = new Set();

  // 1. Load actual delivery challans from master database
  (BWMS.challans || []).forEach(function(ch) {
    if (!ch.challan_no) return;
    seenChallans.add(ch.challan_no);
    var isReturn = (ch.challan_type === 'BATTERY_RETURN' || String(ch.challan_no).indexOf('RET') !== -1 || ch.recipient_type !== 'COMPANY');
    list.push({
      challan_no: ch.challan_no,
      type: isReturn ? 'BATTERY_RETURN' : 'COMPANY_DISPATCH',
      date: ch.challan_date || ch.created_at,
      recipient: ch.recipient_name || 'Customer / Dealer',
      serials: ch.battery_serial_no || (ch.quantity ? ch.quantity + ' Batteries' : '-'),
      status: ch.status || 'GENERATED',
      ticket_no: ch.ticket_no || '',
      battery_model: ch.battery_model || ''
    });
  });

  // 2. Load Company Dispatches if not already recorded in challans
  (BWMS.dispatches || []).forEach(function(d) {
    var cNo = d.company_challan_no || d.dispatch_batch_no;
    if (cNo && !seenChallans.has(cNo)) {
      seenChallans.add(cNo);
      list.push({
        challan_no: cNo,
        type: 'COMPANY_DISPATCH',
        date: d.dispatch_date,
        recipient: d.company_name || 'Amaron Batteries Ltd.',
        serials: (d.battery_count || d.claim_count || 1) + ' Batteries (' + (d.carrier_transporter || 'Van') + ')',
        status: 'DISPATCHED',
        dispatch_batch_no: d.dispatch_batch_no
      });
    }
  });

  // 3. Surface any rejected tickets awaiting return challan generation
  (BWMS.tickets || []).forEach(function(t) {
    var s = (t.status || '').toUpperCase();
    if (s === 'REJECTED_RETURN_PENDING' || s === 'TEST_REJECTED' || (s.indexOf('REJECT') !== -1 && s !== 'REJECTED_RETURNED')) {
      var hasChallan = list.some(function(item) { return item.ticket_no === t.ticket_no && item.type === 'BATTERY_RETURN'; });
      if (!hasChallan) {
        list.push({
          challan_no: 'PENDING (' + t.ticket_no + ')',
          type: 'BATTERY_RETURN',
          date: t.date_received,
          recipient: (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name),
          serials: t.original_serial_no,
          status: 'CHALLAN_NOT_GENERATED',
          ticket_no: t.ticket_no,
          battery_model: t.battery_model,
          is_uncreated: true
        });
      }
    }
  });

  setElText('ch-all-count', list.length);
  setElText('ch-ret-count', list.filter(function(i) { return i.type === 'BATTERY_RETURN'; }).length);
  setElText('ch-com-count', list.filter(function(i) { return i.type === 'COMPANY_DISPATCH'; }).length);

  var filtered = list.filter(function(item) {
    if (tab === 'ret' && item.type !== 'BATTERY_RETURN') return false;
    if (tab === 'com' && item.type !== 'COMPANY_DISPATCH') return false;
    if (search) {
      var blob = [item.challan_no, item.recipient, item.serials, item.status, item.ticket_no].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  setElText('challans-count-badge', filtered.length + ' challans');

  var tbody = document.getElementById('challans-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:25px; color:#94a3b8;">No delivery challans recorded yet.</td></tr>';
    return;
  }

// ─── REPORTS & ANALYTICS RENDERER ─────────────────────────────────────────────

function renderReportsView() {
  var claims = BWMS.claims || [];
  var tickets = BWMS.tickets || [];

  // Ageing Distribution
  var a07 = 0, a815 = 0, a1630 = 0, a3160 = 0, a60p = 0;
  claims.forEach(function(c) {
    if (c.status === 'SENT_TO_COMPANY') {
      var d = calcDaysElapsed(c.company_dispatch_date);
      if (d <= 7) a07++;
      else if (d <= 15) a815++;
      else if (d <= 30) a1630++;
      else if (d <= 60) a3160++;
      else a60p++;
    }
  });

  setElText('rep-ageing-0-7', a07);
  setElText('rep-ageing-8-15', a815);
  setElText('rep-ageing-16-30', a1630);
  setElText('rep-ageing-31-60', a3160);
  setElText('rep-ageing-60-plus', a60p);

  // Model Breakdown Table
  var modelMap = {};
  BWMS.models.forEach(function(m) {
    var key = m.model_name || m.model_code;
    modelMap[key] = {
      code: m.model_code || key,
      name: m.model_name || key,
      warranty: (m.warranty_months || 24),
      received: 0,
      passed: 0,
      rejected: 0
    };
  });

  tickets.forEach(function(t) {
    var key = t.battery_model || 'Unknown';
    if (!modelMap[key]) {
      modelMap[key] = { code: key, name: key, warranty: 24, received: 0, passed: 0, rejected: 0 };
    }
    modelMap[key].received++;
    var s = (t.status || '').toUpperCase();
    if (s === 'PASSED' || s === 'TEST_PASSED' || s === 'CLAIM_CREATED' || s === 'READY_FOR_COMPANY' || s === 'SENT_TO_COMPANY' || s === 'REPLACEMENT_RECEIVED' || s === 'STOCK_UPDATED' || s === 'CLOSED') {
      modelMap[key].passed++;
    } else if (s.indexOf('REJECT') !== -1) {
      modelMap[key].rejected++;
    }
  });

  var tbodyModels = document.getElementById('reports-models-body');
  if (tbodyModels) {
    tbodyModels.innerHTML = '';
    var modelKeys = Object.keys(modelMap);
    if (modelKeys.length === 0) {
      tbodyModels.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:15px; color:#94a3b8;">No model performance data available.</td></tr>';
    } else {
      modelKeys.forEach(function(k) {
        var m = modelMap[k];
        var rate = (m.received > 0) ? Math.round((m.rejected / m.received) * 100) : 0;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + m.code + '</strong></td>' +
          '<td>' + m.name + '</td>' +
          '<td>' + m.warranty + ' Months</td>' +
          '<td><strong>' + m.received + '</strong></td>' +
          '<td><span style="color:#16a34a; font-weight:bold;">' + m.passed + '</span></td>' +
          '<td><span style="color:#dc2626; font-weight:bold;">' + m.rejected + '</span></td>' +
          '<td>' + rate + '%</td>';
        tbodyModels.appendChild(tr);
      });
    }
  }

  // Dealer Breakdown Table
  var dealerMap = {};
  BWMS.dealers.forEach(function(d) {
    dealerMap[d.dealer_name] = { name: d.dealer_name, total: 0, pending: 0, closed: 0 };
  });

  claims.forEach(function(c) {
    if (c.dealer_name) {
      if (!dealerMap[c.dealer_name]) {
        dealerMap[c.dealer_name] = { name: c.dealer_name, total: 0, pending: 0, closed: 0 };
      }
      dealerMap[c.dealer_name].total++;
      var cs = (c.status || '').toUpperCase();
      if (cs === 'SENT_TO_COMPANY') dealerMap[c.dealer_name].pending++;
      if (cs === 'CLOSED' || cs === 'CLAIM_CLOSED') dealerMap[c.dealer_name].closed++;
    }
  });

  var tbodyDealers = document.getElementById('reports-dealers-body');
  if (tbodyDealers) {
    tbodyDealers.innerHTML = '';
    var dKeys = Object.keys(dealerMap);
    if (dKeys.length === 0) {
      tbodyDealers.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#94a3b8;">No dealer warranty records found.</td></tr>';
    } else {
      dKeys.forEach(function(dk) {
        var d = dealerMap[dk];
        var resRate = (d.total > 0) ? Math.round((d.closed / d.total) * 100) : 0;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + d.name + '</strong></td>' +
          '<td><strong>' + d.total + '</strong></td>' +
          '<td><span class="badge badge-amber">' + d.pending + '</span></td>' +
          '<td><span class="badge badge-green">' + d.closed + '</span></td>' +
          '<td>' + resRate + '%</td>';
        tbodyDealers.appendChild(tr);
      });
    }
  }
}

// ─── AUDIT TRAIL RENDERER ─────────────────────────────────────────────────────

function renderAuditTable() {
  var search = (document.getElementById('filter-audit-search') ? document.getElementById('filter-audit-search').value : '').toLowerCase().trim();
  var actionFilter = document.getElementById('filter-audit-action') ? document.getElementById('filter-audit-action').value : 'ALL';

  var logs = BWMS.auditLog || [];
  var filtered = logs.filter(function(a) {
    if (actionFilter !== 'ALL') {
      var act = (a.action || '').toUpperCase();
      var af = actionFilter.toUpperCase();
      if (act !== af && act.indexOf(af.replace('_CREATE', '').replace('_RECEIVE', '').replace('_UPDATE', '').replace('_CLAIM', '')) === -1) {
        return false;
      }
    }
    if (search) {
      var blob = [a.action, a.entity_type, a.entity_id, a.user_email, a.details].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  setElText('audit-count-badge', filtered.length + ' events');

  var tbody = document.getElementById('audit-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:25px; color:#94a3b8;">No audit trail events found.</td></tr>';
    return;
  }

  filtered.slice().reverse().slice(0, 100).forEach(function(a) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><small style="color:#64748b;">' + formatDate(a.timestamp) + '</small></td>' +
      '<td><strong>' + (a.action || '') + '</strong></td>' +
      '<td>' + (a.entity_type || a.record_type || '-') + '</td>' +
      '<td><strong style="color:var(--accent);">' + (a.entity_id || a.record_id || '-') + '</strong></td>' +
      '<td>' + (a.user_email || a.performed_by || 'system') + '</td>' +
      '<td><small>' + (a.details || '-') + '</small></td>';
    tbody.appendChild(tr);
  });
}

// ─── UNIVERSAL TIMELINE & INSTANT SEARCH ─────────────────────────────────────

function handleUniversalSearchInput(val) {
  val = (val || '').trim();
  var dropdown = document.getElementById('search-suggestions-dropdown');
  if (!dropdown) return;

  if (val.length < 2) {
    dropdown.style.display = 'none';
    return;
  }

  var lower = val.toLowerCase();
  var matches = [];

  // Search Tickets
  (BWMS.tickets || []).forEach(function(t) {
    if (t.original_serial_no && t.original_serial_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'SERIAL', title: 'Serial: ' + t.original_serial_no, sub: t.ticket_no + ' • ' + (t.customer_name || t.dealer_name), id: t.ticket_no, ticket: t });
    } else if (t.ticket_no && t.ticket_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'TICKET', title: t.ticket_no, sub: (t.customer_name || t.dealer_name) + ' • ' + t.battery_model, id: t.ticket_no, ticket: t });
    } else if (t.customer_name && t.customer_name.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'CUSTOMER', title: t.customer_name, sub: t.ticket_no + ' • ' + (t.mobile || ''), id: t.ticket_no, ticket: t });
    } else if (t.mobile && t.mobile.indexOf(lower) !== -1) {
      matches.push({ type: 'MOBILE', title: 'Mobile: ' + t.mobile, sub: t.customer_name + ' • ' + t.ticket_no, id: t.ticket_no, ticket: t });
    }
  });

  // Search Claims
  (BWMS.claims || []).forEach(function(c) {
    if (c.claim_no && c.claim_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'CLAIM', title: c.claim_no, sub: c.battery_model + ' • ' + c.original_serial_no, id: c.claim_no, claim: c });
    } else if (c.replacement_serial_no && c.replacement_serial_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'REP_SERIAL', title: 'Replacement: ' + c.replacement_serial_no, sub: c.claim_no + ' • ' + c.battery_model, id: c.claim_no, claim: c });
    }
  });

  if (matches.length === 0) {
    dropdown.innerHTML =
      '<div style="padding:14px; text-align:center;">' +
      '  <div style="color:#64748b; font-size:12px; margin-bottom:8px;">No existing tickets or claims for "' + val + '"</div>' +
      '  <div style="display:flex; justify-content:center; gap:8px;">' +
      '    <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById(\'search-suggestions-dropdown\').style.display=\'none\'; openWarrantyCalcModal(null, \'' + val + '\')">⚡ Check Warranty</button>' +
      '    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById(\'search-suggestions-dropdown\').style.display=\'none\'; openIntakeModal({ serial: \'' + val + '\' })">+ Intake Ticket</button>' +
      '  </div>' +
      '</div>';
    dropdown.style.display = 'block';
    return;
  }

  // Deduplicate and take top 8
  var unique = [];
  var seen = new Set();
  matches.forEach(function(m) {
    var key = m.type + ':' + m.id;
    if (!seen.has(key) && unique.length < 8) {
      seen.add(key);
      unique.push(m);
    }
  });

  dropdown.innerHTML = '';
  unique.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'search-dropdown-item';
    var nextActionPill = '';
    if (m.ticket) {
      var na = getTicketNextAction(m.ticket);
      nextActionPill = '<span class="next-action-pill ' + na.badgeClass + '" style="font-size:10px;">' + na.stepLabel + '</span>';
    } else if (m.claim) {
      var ca = getClaimNextAction(m.claim);
      nextActionPill = '<span class="next-action-pill ' + ca.badgeClass + '" style="font-size:10px;">' + ca.stepLabel + '</span>';
    }

    div.innerHTML =
      '<div style="flex:1;">' +
      '  <div style="display:flex; align-items:center; gap:6px;">' +
      '    <strong style="font-size:13px; color:var(--text-main);">' + m.title + '</strong>' +
      '    ' + nextActionPill + ' ' +
      '  </div>' +
      '  <div style="font-size:11px; color:#64748b; margin-top:2px;">' + m.sub + '</div>' +
      '</div>' +
      '<div><span class="badge badge-gray">' + m.type + '</span></div>';
    div.onclick = function() {
      dropdown.style.display = 'none';
      showTimeline(m.id);
    };
    dropdown.appendChild(div);
  });

  dropdown.style.display = 'block';
}

  if (e.key === 'Enter') {
    var dropdown = document.getElementById('search-suggestions-dropdown');
    if (dropdown) dropdown.style.display = 'none';

function showTimeline(query) {
  if (!query) return;

  // Search local in-memory store for instant zero-latency timeline rendering
  var lower = query.toLowerCase().trim();
  var matchedTicket = (BWMS.tickets || []).find(function(t) {
    return t.ticket_no.toLowerCase() === lower || (t.original_serial_no && t.original_serial_no.toLowerCase() === lower);
  });

  var matchedClaim = (BWMS.claims || []).find(function(c) {
    return c.claim_no.toLowerCase() === lower || (c.ticket_no && c.ticket_no.toLowerCase() === lower) || (c.original_serial_no && c.original_serial_no.toLowerCase() === lower);
  });

  var metaBox = document.getElementById('timeline-meta-box');
  var nodesList = document.getElementById('timeline-nodes-list');

  var primary = matchedClaim || matchedTicket || { ticket_no: query };
  metaBox.innerHTML =
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
    '  <div><h3 style="font-size:16px; margin-bottom:4px;">Lifecycle Report for: <span style="color:var(--accent);">' + query + '</span></h3>' +
    '  <span style="color:#64748b; font-size:12px;">Matched: ' + (primary.battery_model || '-') + ' • Serial: <strong>' + (primary.original_serial_no || '-') + '</strong></span></div>' +
    '  <div>' + renderStatusBadge(primary.status || 'FOUND') + '</div>' +
    '</div>';

  nodesList.innerHTML = '<div class="timeline-line"></div>';

  // Construct events locally
  var events = [];
  if (matchedTicket) {
    events.push({
      title: 'Battery Received at Service Center',
      date: matchedTicket.date_received,
      details: 'Intake ticket ' + matchedTicket.ticket_no + ' created for party: ' + (matchedTicket.customer_name || matchedTicket.dealer_name) + ' (' + (matchedTicket.mobile || '') + ').'
    });
  }

  // Diagnostic Test
  var tests = (BWMS.tests || []).filter(function(tst) {
    return (matchedTicket && tst.ticket_no === matchedTicket.ticket_no) || (tst.original_serial_no && tst.original_serial_no.toLowerCase() === lower);
  });
  tests.forEach(function(tst) {
    events.push({
      title: 'Diagnostic Test Conducted: ' + tst.test_result,
      date: tst.test_date,
      details: 'Voltage: ' + (tst.open_circuit_voltage || '-') + 'V • Result: ' + tst.test_result + ' • Remarks: ' + (tst.test_remarks || 'N/A')
    });
  });

  // Claim
  if (matchedClaim) {
    events.push({
      title: 'Warranty Claim Generated (' + matchedClaim.claim_no + ')',
      date: matchedClaim.created_at || matchedClaim.claim_date,
      details: 'Warranty classification: ' + (matchedClaim.warranty_status || 'IN_WARRANTY') + ' • Date of Sale: ' + formatDate(matchedClaim.date_of_sale)
    });

    if (matchedClaim.company_dispatch_date) {
      events.push({
        title: 'Dispatched to Battery Manufacturer Factory',
        date: matchedClaim.company_dispatch_date,
        details: 'Batch Challan: ' + (matchedClaim.company_challan_no || matchedClaim.dispatch_batch_no || 'DC-COM')
      });
    }

    if (matchedClaim.replacement_received_date) {
      events.push({
        title: 'Factory Replacement Received',
        date: matchedClaim.replacement_received_date,
        details: 'Replacement Serial: ' + (matchedClaim.replacement_serial_no || '-') + ' • Invoice/CN Ref: ' + (matchedClaim.stock_ref_no || '-')
      });
    }

    if (matchedClaim.stock_status === 'UPDATED') {
      events.push({
        title: 'ERP Accounting Stock Inward Reconciled',
        date: matchedClaim.stock_updated_date || matchedClaim.updated_at,
        details: 'Accounting reference: ' + (matchedClaim.stock_ref_no || 'STK-IN') + ' by ' + (matchedClaim.stock_updated_by || 'Staff')
      });
    }

    if (matchedClaim.status === 'CLOSED' || matchedClaim.status === 'CLAIM_CLOSED') {
      events.push({
        title: 'Claim Closed & Battery Delivered to Customer',
        date: matchedClaim.closed_date || matchedClaim.updated_at,
        details: 'Handover complete. Replacement battery delivered.'
      });
    }
  }

  if (events.length === 0) {
    nodesList.innerHTML += '<p style="padding:20px; text-align:center; color:#94a3b8;">No chronological events recorded for this query.</p>';
  } else {
    events.forEach(function(ev) {
      var node = document.createElement('div');
      node.className = 'timeline-node';
      node.innerHTML =
        '<div class="timeline-dot"></div>' +
        '<div class="timeline-header">' +
        '  <span class="timeline-title">' + ev.title + '</span>' +
        '  <span class="timeline-date">' + (ev.date ? formatDate(ev.date) : '') + '</span>' +
        '</div>' +
        '<div class="timeline-details">' + (ev.details || '') + '</div>';
      nodesList.appendChild(node);
    });
  }

  openModal('modal-timeline');
}

function openUploadDocModal(claimNo) {

function handleUploadSubmit(e) {
  e.preventDefault();
  var fileInput = document.getElementById('upload-file');
  if (!fileInput.files || fileInput.files.length === 0) {
    showToast('Please select a file to upload.', 'warning');
    return;
  }
  var file = fileInput.files[0];
  var claimNo = document.getElementById('upload-claim-no').value;
  var docType = document.getElementById('upload-doc-type').value;

  var submitBtn = document.getElementById('btn-upload-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Uploading to Drive...';

  var reader = new FileReader();
  reader.onload = function(evt) {
    var base64Data = evt.target.result.split(',')[1];
    var data = {
      claim_no: claimNo,
      document_type: docType,
      file_name: file.name,
      mime_type: file.type || 'application/octet-stream',
      file_base64: base64Data
    };

    callServer('apiUploadDocument', [data], function(res) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Upload to Drive';
      if (res && res.success) {
        closeModal('modal-upload');
        showToast(res.message || 'File saved into claim Drive folder.', 'success');
        syncAllData(false);
      } else {
        showToast((res && res.error) ? res.error : 'Upload failed', 'error');
      }
    });
  };
  reader.onerror = function() {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Upload to Drive';
    showToast('Error reading file for upload.', 'error');
  };
  reader.readAsDataURL(file);
}

function downloadCSV(filename, headers, rows) {
  var csvContent = '\uFEFF';
  csvContent += headers.map(escapeCSVField).join(',') + '\r\n';

  rows.forEach(function(row) {
    var line = row.map(escapeCSVField).join(',');
    csvContent += line + '\r\n';
  });

  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function escapeCSVField(val) {
  if (val === null || val === undefined) return '""';
  var str = String(val).replace(/"/g, '""');
  return '"' + str + '"';
}

function calcDaysElapsed(dateStr) {
  if (!dateStr) return 0;
  try {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return 0;
    var now = new Date();
    var diffTime = Math.abs(now - d);
    return Math.floor(diffTime / (1000 * 60 * 60 * 24));
  } catch (e) {
    return 0;
  }
}

// ─── INSTANT WARRANTY ENGINE & CALCULATOR ────────────────────────────────────

function addCalendarMonths(dateInput, monthsToAdd) {
  var d = parseClientDate(dateInput);
  if (!d) return null;
  var months = parseInt(monthsToAdd, 10);
  if (isNaN(months)) return null;

  var targetYear = d.getFullYear();
  var targetMonth = d.getMonth() + months;
  var targetDay = d.getDate();

  var result = new Date(targetYear, targetMonth, targetDay);
  // Handle month-end boundary overflows (e.g. Aug 31 + 6 months -> Feb 28, Feb 29 + 12M -> Feb 28)
  if (result.getDate() !== targetDay) {
    result.setDate(0); // Clamps to last day of target month
  }
  return result;
}

function parseClientDate(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
  var s = String(val).trim();
  if (s.indexOf('T') !== -1) s = s.split('T')[0];
  var parts = s.split('-');
  if (parts.length === 3 && parts[0].length === 4) {
    var yr = parseInt(parts[0], 10);
    var mo = parseInt(parts[1], 10) - 1;
    var day = parseInt(parts[2], 10);
    return new Date(yr, mo, day);
  }
  var d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function getElapsedCalendarMonths(saleDate, refDate) {
  var s = new Date(saleDate.getFullYear(), saleDate.getMonth(), saleDate.getDate());
  var r = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
  if (r < s) return 0;
  var months = (r.getFullYear() - s.getFullYear()) * 12 + (r.getMonth() - s.getMonth());
  if (r.getDate() < s.getDate()) {
    months--;
  }
  return Math.max(0, months);
}

function findBatteryModel(modelQuery) {
  if (!modelQuery) return null;
  var q = String(modelQuery).trim().toLowerCase();
  var models = BWMS.models || [];

  // 1. Exact match on model_name, model_id, or model_code
  var match = models.find(function(m) {
    var n = String(m.model_name || '').toLowerCase();
    var id = String(m.model_id || '').toLowerCase();
    var c = String(m.model_code || '').toLowerCase();
    return n === q || id === q || c === q;
  });
  if (match) return match;

  // 2. Substring match
  match = models.find(function(m) {
    var n = String(m.model_name || '').toLowerCase();
    var id = String(m.model_id || '').toLowerCase();
    var c = String(m.model_code || '').toLowerCase();
    return n.indexOf(q) !== -1 || q.indexOf(n) !== -1 || (c && (c.indexOf(q) !== -1 || q.indexOf(c) !== -1));
  });
  if (match) return match;

  // 3. Token match (e.g. 0BH40B20R, 42B20R, EPIQ35R, ML35R)
  var tokens = q.split(/[\s\-_(),/]+/).filter(function(t) { return t.length >= 4; });
  if (tokens.length > 0) {
    match = models.find(function(m) {
      var n = String(m.model_name || '').toLowerCase();
      var id = String(m.model_id || '').toLowerCase();
      var c = String(m.model_code || '').toLowerCase();
      var hay = n + ' ' + id + ' ' + c;
      return tokens.some(function(tok) { return hay.indexOf(tok) !== -1; });
    });
    if (match) return match;
  }

  return null;
}

function calculateWarrantyDetails(modelQuery, dateOfSaleStr, refDateStr, mrpValue) {
  var model = findBatteryModel(modelQuery);
  var rawQ = String(modelQuery || '').trim();

  // Extract warranty numbers from model object or model string pattern (e.g. "36+18" or "(24+24)" or "36M")
  var totalMonths = 0;
  var guaranteeMonths = 0;
  var proRataMonths = 0;

  if (model) {
    totalMonths = parseInt(model.warranty_months, 10) || 0;
    guaranteeMonths = parseInt(model.guarantee_months, 10) || 0;
    proRataMonths = parseInt(model.pro_rata_months, 10) || 0;
  }

  // Fallback to pattern matching in query string if not found or 0
  if (guaranteeMonths === 0 || totalMonths === 0) {
    var plusMatch = rawQ.match(/(\d{1,2})\s*[\+\/]\s*(\d{1,2})/);
    if (plusMatch) {
      guaranteeMonths = parseInt(plusMatch[1], 10);
      proRataMonths = parseInt(plusMatch[2], 10);
      totalMonths = guaranteeMonths + proRataMonths;
    } else {
      var mMatch = rawQ.match(/(\d{1,2})\s*(?:m\b|months)/i);
      if (mMatch) {
        totalMonths = parseInt(mMatch[1], 10);
        guaranteeMonths = Math.round(totalMonths / 2);
        proRataMonths = totalMonths - guaranteeMonths;
      }
    }
  }

  if (totalMonths <= 0) totalMonths = 24;
  if (guaranteeMonths <= 0) guaranteeMonths = 12;
  if (proRataMonths <= 0) proRataMonths = Math.max(0, totalMonths - guaranteeMonths);
  if (totalMonths < guaranteeMonths + proRataMonths) totalMonths = guaranteeMonths + proRataMonths;

  // Estimate realistic MRP from Ah capacity if not explicitly provided
  var ah = model && model.capacity_ah ? parseInt(model.capacity_ah, 10) : 0;
  if (!ah) {
    var ahMatch = rawQ.match(/(\d{2,3})\s*ah/i);
    if (ahMatch) ah = parseInt(ahMatch[1], 10);
  }
  var defaultMrp = 5500;
  if (ah > 0) {
    if (ah <= 35) defaultMrp = 4900;
    else if (ah <= 45) defaultMrp = 6400;
    else if (ah <= 65) defaultMrp = 7800;
    else if (ah <= 80) defaultMrp = 9500;
    else if (ah <= 100) defaultMrp = 11500;
    else defaultMrp = 14500;
  }

  var mrp = parseFloat(mrpValue) || (model && model.mrp ? parseFloat(model.mrp) : defaultMrp);

  if (!dateOfSaleStr) {
    return {
      hasDate: false,
      model: model,
      totalMonths: totalMonths,
      guaranteeMonths: guaranteeMonths,
      proRataMonths: proRataMonths,
      mrp: mrp
    };
  }

  var saleDate = parseClientDate(dateOfSaleStr);
  var refDate = refDateStr ? parseClientDate(refDateStr) : new Date();
  if (!saleDate || isNaN(saleDate.getTime())) {
    return { hasDate: false, model: model, totalMonths: totalMonths, guaranteeMonths: guaranteeMonths, proRataMonths: proRataMonths, mrp: mrp };
  }

  var saleMidnight = new Date(saleDate.getFullYear(), saleDate.getMonth(), saleDate.getDate());
  var refMidnight = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());

  var guaranteeExpiry = addCalendarMonths(saleMidnight, guaranteeMonths);
  var warrantyExpiry = addCalendarMonths(saleMidnight, totalMonths);

  var diffDays = Math.floor((refMidnight.getTime() - saleMidnight.getTime()) / (1000 * 60 * 60 * 24));
  var elapsedMonths = getElapsedCalendarMonths(saleMidnight, refMidnight);

  var status = 'EXPIRED';
  var discountPercent = 0;
  var payablePercent = 100;
  var customerPayable = mrp;
  var coverageLabel = 'Warranty Expired';
  var badgeClass = 'step-danger';
  var explanation = '';

  if (refMidnight <= guaranteeExpiry) {
    status = 'FULL_GUARANTEE';
    discountPercent = 100;
    payablePercent = 0;
    customerPayable = 0;
    coverageLabel = '100% Free Replacement Guarantee';
    badgeClass = 'step-green';
    var daysLeft = Math.max(0, Math.floor((guaranteeExpiry.getTime() - refMidnight.getTime()) / (1000 * 60 * 60 * 24)));
    var mosLeft = Math.max(0, guaranteeMonths - elapsedMonths);
    explanation = 'Battery is within the ' + guaranteeMonths + '-month guarantee period (' + mosLeft + ' months / ' + daysLeft + ' days remaining until ' + formatDate(guaranteeExpiry) + '). The customer is entitled to a 100% free replacement battery from the manufacturer. Customer payable: ₹0.';
  } else if (refMidnight <= warrantyExpiry) {
    status = 'PRO_RATA';
    var monthsUsedInProRata = Math.max(1, elapsedMonths - guaranteeMonths + 1);
    discountPercent = proRataMonths > 0 ? Math.max(0, Math.round(100 - (monthsUsedInProRata / proRataMonths) * 100)) : 0;
    payablePercent = 100 - discountPercent;
    customerPayable = Math.round((mrp * payablePercent) / 100);
    coverageLabel = 'Pro-Rata Warranty (' + discountPercent + '% Discount)';
    badgeClass = 'step-blue';
    var daysUntilFinal = Math.max(0, Math.floor((warrantyExpiry.getTime() - refMidnight.getTime()) / (1000 * 60 * 60 * 24)));
    explanation = 'Battery is in the pro-rata period (Month ' + (elapsedMonths + 1) + ' of ' + totalMonths + ', ' + daysUntilFinal + ' days left until ' + formatDate(warrantyExpiry) + '). Customer receives a ' + discountPercent + '% discount on the replacement battery MRP. Customer pays remaining ' + payablePercent + '% balance: ₹' + customerPayable.toLocaleString('en-IN') + ' (on ₹' + mrp.toLocaleString('en-IN') + ' MRP).';
  } else {
    status = 'EXPIRED';
    discountPercent = 0;
    payablePercent = 100;
    customerPayable = mrp;
    coverageLabel = 'Out of Warranty (Expired)';
    badgeClass = 'step-danger';
    var daysPast = Math.max(0, Math.floor((refMidnight.getTime() - warrantyExpiry.getTime()) / (1000 * 60 * 60 * 24)));
    explanation = 'Warranty expired on ' + formatDate(warrantyExpiry) + ' (' + (daysPast > 0 ? daysPast + ' days ago' : 'past expiry date') + '). Battery is outside manufacturer warranty window (' + totalMonths + ' months). Standard scrap buyback or retail exchange can be offered.';
  }

  return {
    hasDate: true,
    model: model,
    saleDate: saleDate,
    refDate: refDate,
    diffMonths: elapsedMonths,
    diffDays: diffDays,
    totalMonths: totalMonths,
    guaranteeMonths: guaranteeMonths,
    proRataMonths: proRataMonths,
    guaranteeExpiry: guaranteeExpiry,
    warrantyExpiry: warrantyExpiry,
    status: status,
    discountPercent: discountPercent,
    payablePercent: payablePercent,
    mrp: mrp,
    customerPayable: customerPayable,
    coverageLabel: coverageLabel,
    badgeClass: badgeClass,
    explanation: explanation
  };
}

function resetWarrantyCalc(prefix) {
