// ─── INSTANT WARRANTY ENGINE & CALCULATOR ────────────────────────────────────

function addCalendarMonths(dateInput, monthsToAdd) {
  var d = parseClientDate(dateInput);
  if (!d) return null;
  var months = parseInt(monthsToAdd, 10);
  if (isNaN(months)) return null;

  var targetYear = d.getFullYear();
  var targetMonth = d.getMonth() + months;
  var targetDay = d.getDate();

  var result = new Date(targetYear, targetMonth, targetDay);
  // Handle month-end boundary overflows (e.g. Aug 31 + 6 months -> Feb 28, Feb 29 + 12M -> Feb 28)
  if (result.getDate() !== targetDay) {
    result.setDate(0); // Clamps to last day of target month
  }
  return result;
}

function parseClientDate(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
  var s = String(val).trim();
  if (s.indexOf('T') !== -1) s = s.split('T')[0];
  var parts = s.split('-');
  if (parts.length === 3 && parts[0].length === 4) {
    var yr = parseInt(parts[0], 10);
    var mo = parseInt(parts[1], 10) - 1;
    var day = parseInt(parts[2], 10);
    return new Date(yr, mo, day);
  }
  var d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function getElapsedCalendarMonths(saleDate, refDate) {
  var s = new Date(saleDate.getFullYear(), saleDate.getMonth(), saleDate.getDate());
  var r = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
  if (r < s) return 0;
  var months = (r.getFullYear() - s.getFullYear()) * 12 + (r.getMonth() - s.getMonth());
  if (r.getDate() < s.getDate()) {
    months--;
  }
  return Math.max(0, months);
}

function findBatteryModel(modelQuery) {
  if (!modelQuery) return null;
  var q = String(modelQuery).trim().toLowerCase();
  var models = BWMS.models || [];

  // 1. Exact match on model_name, model_id, or model_code
  var match = models.find(function(m) {
    var n = String(m.model_name || '').toLowerCase();
    var id = String(m.model_id || '').toLowerCase();
    var c = String(m.model_code || '').toLowerCase();
    return n === q || id === q || c === q;
  });
  if (match) return match;

  // 2. Substring match
  match = models.find(function(m) {
    var n = String(m.model_name || '').toLowerCase();
    var id = String(m.model_id || '').toLowerCase();
    var c = String(m.model_code || '').toLowerCase();
    return n.indexOf(q) !== -1 || q.indexOf(n) !== -1 || (c && (c.indexOf(q) !== -1 || q.indexOf(c) !== -1));
  });
  if (match) return match;

  // 3. Token match (e.g. 0BH40B20R, 42B20R, EPIQ35R, ML35R)
  var tokens = q.split(/[\s\-_(),/]+/).filter(function(t) { return t.length >= 4; });
  if (tokens.length > 0) {
    match = models.find(function(m) {
      var n = String(m.model_name || '').toLowerCase();
      var id = String(m.model_id || '').toLowerCase();
      var c = String(m.model_code || '').toLowerCase();
      var hay = n + ' ' + id + ' ' + c;
      return tokens.some(function(tok) { return hay.indexOf(tok) !== -1; });
    });
    if (match) return match;
  }

  return null;
}

function calculateWarrantyDetails(modelQuery, dateOfSaleStr, refDateStr, mrpValue) {
  var model = findBatteryModel(modelQuery);
  var rawQ = String(modelQuery || '').trim();

  // Extract warranty numbers from model object or model string pattern (e.g. "36+18" or "(24+24)" or "36M")
  var totalMonths = 0;
  var guaranteeMonths = 0;
  var proRataMonths = 0;

  if (model) {
    totalMonths = parseInt(model.warranty_months, 10) || 0;
    guaranteeMonths = parseInt(model.guarantee_months, 10) || 0;
    proRataMonths = parseInt(model.pro_rata_months, 10) || 0;
  }

  // Fallback to pattern matching in query string if not found or 0
  if (guaranteeMonths === 0 || totalMonths === 0) {
    var plusMatch = rawQ.match(/(\d{1,2})\s*[\+\/]\s*(\d{1,2})/);
    if (plusMatch) {
      guaranteeMonths = parseInt(plusMatch[1], 10);
      proRataMonths = parseInt(plusMatch[2], 10);
      totalMonths = guaranteeMonths + proRataMonths;
    } else {
      var mMatch = rawQ.match(/(\d{1,2})\s*(?:m\b|months)/i);
      if (mMatch) {
        totalMonths = parseInt(mMatch[1], 10);
        guaranteeMonths = Math.round(totalMonths / 2);
        proRataMonths = totalMonths - guaranteeMonths;
      }
    }
  }

  if (totalMonths <= 0) totalMonths = 24;
  if (guaranteeMonths <= 0) guaranteeMonths = 12;
  if (proRataMonths <= 0) proRataMonths = Math.max(0, totalMonths - guaranteeMonths);
  if (totalMonths < guaranteeMonths + proRataMonths) totalMonths = guaranteeMonths + proRataMonths;

  // Estimate realistic MRP from Ah capacity if not explicitly provided
  var ah = model && model.capacity_ah ? parseInt(model.capacity_ah, 10) : 0;
  if (!ah) {
    var ahMatch = rawQ.match(/(\d{2,3})\s*ah/i);
    if (ahMatch) ah = parseInt(ahMatch[1], 10);
  }
  var defaultMrp = 5500;
  if (ah > 0) {
    if (ah <= 35) defaultMrp = 4900;
    else if (ah <= 45) defaultMrp = 6400;
    else if (ah <= 65) defaultMrp = 7800;
    else if (ah <= 80) defaultMrp = 9500;
    else if (ah <= 100) defaultMrp = 11500;
    else defaultMrp = 14500;
  }

  var mrp = parseFloat(mrpValue) || (model && model.mrp ? parseFloat(model.mrp) : defaultMrp);

  if (!dateOfSaleStr) {
    return {
      hasDate: false,
      model: model,
      totalMonths: totalMonths,
      guaranteeMonths: guaranteeMonths,
      proRataMonths: proRataMonths,
      mrp: mrp
    };
  }

  var saleDate = parseClientDate(dateOfSaleStr);
  var refDate = refDateStr ? parseClientDate(refDateStr) : new Date();
  if (!saleDate || isNaN(saleDate.getTime())) {
    return { hasDate: false, model: model, totalMonths: totalMonths, guaranteeMonths: guaranteeMonths, proRataMonths: proRataMonths, mrp: mrp };
  }

  var saleMidnight = new Date(saleDate.getFullYear(), saleDate.getMonth(), saleDate.getDate());
  var refMidnight = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());

  var guaranteeExpiry = addCalendarMonths(saleMidnight, guaranteeMonths);
  var warrantyExpiry = addCalendarMonths(saleMidnight, totalMonths);

  var diffDays = Math.floor((refMidnight.getTime() - saleMidnight.getTime()) / (1000 * 60 * 60 * 24));
  var elapsedMonths = getElapsedCalendarMonths(saleMidnight, refMidnight);

  var status = 'EXPIRED';
  var discountPercent = 0;
  var payablePercent = 100;
  var customerPayable = mrp;
  var coverageLabel = 'Warranty Expired';
  var badgeClass = 'step-danger';
  var explanation = '';

  if (refMidnight <= guaranteeExpiry) {
    status = 'FULL_GUARANTEE';
    discountPercent = 100;
    payablePercent = 0;
    customerPayable = 0;
    coverageLabel = '100% Free Replacement Guarantee';
    badgeClass = 'step-green';
    var daysLeft = Math.max(0, Math.floor((guaranteeExpiry.getTime() - refMidnight.getTime()) / (1000 * 60 * 60 * 24)));
    var mosLeft = Math.max(0, guaranteeMonths - elapsedMonths);
    explanation = 'Battery is within the ' + guaranteeMonths + '-month guarantee period (' + mosLeft + ' months / ' + daysLeft + ' days remaining until ' + formatDate(guaranteeExpiry) + '). The customer is entitled to a 100% free replacement battery from the manufacturer. Customer payable: ₹0.';
  } else if (refMidnight <= warrantyExpiry) {
    status = 'PRO_RATA';
    var monthsUsedInProRata = Math.max(1, elapsedMonths - guaranteeMonths + 1);
    discountPercent = proRataMonths > 0 ? Math.max(0, Math.round(100 - (monthsUsedInProRata / proRataMonths) * 100)) : 0;
    payablePercent = 100 - discountPercent;
    customerPayable = Math.round((mrp * payablePercent) / 100);
    coverageLabel = 'Pro-Rata Warranty (' + discountPercent + '% Discount)';
    badgeClass = 'step-blue';
    var daysUntilFinal = Math.max(0, Math.floor((warrantyExpiry.getTime() - refMidnight.getTime()) / (1000 * 60 * 60 * 24)));
    explanation = 'Battery is in the pro-rata period (Month ' + (elapsedMonths + 1) + ' of ' + totalMonths + ', ' + daysUntilFinal + ' days left until ' + formatDate(warrantyExpiry) + '). Customer receives a ' + discountPercent + '% discount on the replacement battery MRP. Customer pays remaining ' + payablePercent + '% balance: ₹' + customerPayable.toLocaleString('en-IN') + ' (on ₹' + mrp.toLocaleString('en-IN') + ' MRP).';
  } else {
    status = 'EXPIRED';
    discountPercent = 0;
    payablePercent = 100;
    customerPayable = mrp;
    coverageLabel = 'Out of Warranty (Expired)';
    badgeClass = 'step-danger';
    var daysPast = Math.max(0, Math.floor((refMidnight.getTime() - warrantyExpiry.getTime()) / (1000 * 60 * 60 * 24)));
    explanation = 'Warranty expired on ' + formatDate(warrantyExpiry) + ' (' + (daysPast > 0 ? daysPast + ' days ago' : 'past expiry date') + '). Battery is outside manufacturer warranty window (' + totalMonths + ' months). Standard scrap buyback or retail exchange can be offered.';
  }

  return {
    hasDate: true,
    model: model,
    saleDate: saleDate,
    refDate: refDate,
    diffMonths: elapsedMonths,
    diffDays: diffDays,
    totalMonths: totalMonths,
    guaranteeMonths: guaranteeMonths,
    proRataMonths: proRataMonths,
    guaranteeExpiry: guaranteeExpiry,
    warrantyExpiry: warrantyExpiry,
    status: status,
    discountPercent: discountPercent,
    payablePercent: payablePercent,
    mrp: mrp,
    customerPayable: customerPayable,
    coverageLabel: coverageLabel,
    badgeClass: badgeClass,
    explanation: explanation
  };
}

    resBox.innerHTML = '';

function lookupSerialInCalc(prefix) {
  var serialInp = getCalcElement(prefix, 'serial');
  var statusEl = getCalcElement(prefix, 'serial-status');
  if (!serialInp) return;
  var rawSerial = serialInp.value.trim();
  var serial = rawSerial.replace(/^['"]|['"]$/g, '').toLowerCase();
  if (!serial) {
    if (statusEl) statusEl.textContent = 'Please enter a serial number to search';
    return;
  }

  var tMatch = (BWMS.tickets || []).find(function(t) {
    if (!t.original_serial_no) return false;
    var s = String(t.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase();
    return s === serial;
  });
  var cMatch = (BWMS.claims || []).find(function(c) {
    var s1 = c.original_serial_no ? String(c.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
    var s2 = c.replacement_serial_no ? String(c.replacement_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
    return s1 === serial || s2 === serial;
  });

  if (!tMatch && !cMatch && serial.length >= 4) {
    tMatch = (BWMS.tickets || []).find(function(t) {
      if (!t.original_serial_no) return false;
      var s = String(t.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase();
      return s.indexOf(serial) !== -1 || serial.indexOf(s) !== -1;
    });
    cMatch = (BWMS.claims || []).find(function(c) {
      var s1 = c.original_serial_no ? String(c.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
      var s2 = c.replacement_serial_no ? String(c.replacement_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
      return (s1 && (s1.indexOf(serial) !== -1 || serial.indexOf(s1) !== -1)) ||
             (s2 && (s2.indexOf(serial) !== -1 || serial.indexOf(s2) !== -1));
    });
  }

  if (tMatch || cMatch) {
    var match = tMatch || cMatch;
    var linkedClaim = (BWMS.claims || []).find(function(c) {
      return (tMatch && c.ticket_no === tMatch.ticket_no) || (cMatch && c.claim_no === cMatch.claim_no);
    });
    var linkedTicket = (BWMS.tickets || []).find(function(t) {
      return (cMatch && t.ticket_no === cMatch.ticket_no) || (tMatch && t.ticket_no === tMatch.ticket_no);
    });

    var modelEl = getCalcElement(prefix, 'model');
    if (modelEl) {
      var modelName = match.battery_model || (linkedClaim && linkedClaim.battery_model) || (linkedTicket && linkedTicket.battery_model);
      if (modelName) setSelectValueFuzzy(modelEl, modelName);
    }
    var dosEl = getCalcElement(prefix, 'dos');
    if (dosEl) {
      var dos = (linkedClaim && linkedClaim.date_of_sale) || match.date_of_sale;
      if (!dos && linkedTicket && linkedTicket.remarks) {
        var mDos = linkedTicket.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
        if (mDos) dos = mDos[1];
      }
      if (!dos && match.remarks) {
        var mDos2 = match.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
        if (mDos2) dos = mDos2[1];
      }
      if (!dos) dos = match.date_received;
      if (dos) dosEl.value = dos.indexOf('T') !== -1 ? dos.split('T')[0] : dos;
    }
    if (statusEl) {
      var recId = match.ticket_no || match.claim_no;
      var party = match.customer_name || match.dealer_name || '';
      statusEl.innerHTML = '<span style="color:#15803d; font-weight:bold;">✓ Found Record: ' + recId + (party ? ' (' + party + ')' : '') + '</span>';
    }
    var matchObj = {
      ticket_no: match.ticket_no || (linkedTicket && linkedTicket.ticket_no),
      claim_no: match.claim_no || (linkedClaim && linkedClaim.claim_no),
      status: match.status,
      battery_model: match.battery_model || (linkedClaim && linkedClaim.battery_model),
      original_serial_no: match.original_serial_no
    };
    runWarrantyCalculator(prefix, matchObj);
  } else {
    if (statusEl) {
      statusEl.innerHTML = '<span style="color:#b45309;">⚠️ Serial not found in active records. Select model & sale date above to compute warranty.</span>';
    }
    var modelVal = getCalcElement(prefix, 'model') ? getCalcElement(prefix, 'model').value : '';
    if (modelVal) runWarrantyCalculator(prefix);
  }
}

function filterPipelineStage(stageKey) {
  var v = BWMS.activeView;
  if (v === 'tickets') {
    var statusSelect = document.getElementById('filter-tickets-status');
    if (stageKey === 'ALL') {
      if (statusSelect) { statusSelect.value = 'ALL'; renderTicketsTable(); }
    } else if (stageKey === 'RECEIVED') {
      if (statusSelect) { statusSelect.value = 'RECEIVED'; renderTicketsTable(); }
    } else if (stageKey === 'TESTED') {
      if (statusSelect) { statusSelect.value = 'PASSED'; renderTicketsTable(); }
    } else if (stageKey === 'CLAIM_RAISED') {
      if (statusSelect) { statusSelect.value = 'CLAIM_CREATED'; renderTicketsTable(); }
    } else if (stageKey === 'SENT_TO_COMPANY') {
      navigateTo('replacement-pending');
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      navigateTo('stock-tasks');
    } else if (stageKey === 'STOCK_UPDATED') {
      navigateTo('claims', { status: 'STOCK_UPDATED' });
    } else if (stageKey === 'CLOSED') {
      if (statusSelect) { statusSelect.value = 'CLOSED'; renderTicketsTable(); }
    }
  } else if (v === 'claims') {
    var claimSelect = document.getElementById('filter-claims-status');
    if (stageKey === 'ALL') {
      if (claimSelect) { claimSelect.value = 'ALL'; renderClaimsTable(); }
    } else if (stageKey === 'RECEIVED') {
      navigateTo('lab');
    } else if (stageKey === 'TESTED') {
      navigateTo('tickets', { status: 'PASSED' });
    } else if (stageKey === 'CLAIM_RAISED') {
      if (claimSelect) { claimSelect.value = 'CLAIM_CREATED'; renderClaimsTable(); }
    } else if (stageKey === 'SENT_TO_COMPANY') {
      if (claimSelect) { claimSelect.value = 'SENT_TO_COMPANY'; renderClaimsTable(); }
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      if (claimSelect) { claimSelect.value = 'REPLACEMENT_RECEIVED'; renderClaimsTable(); }
    } else if (stageKey === 'STOCK_UPDATED') {
      if (claimSelect) { claimSelect.value = 'STOCK_UPDATED'; renderClaimsTable(); }
    } else if (stageKey === 'CLOSED') {
      if (claimSelect) { claimSelect.value = 'CLOSED'; renderClaimsTable(); }
    }
  } else {
    // Dashboard or other views
    if (stageKey === 'ALL') {
      navigateTo('tickets');
    } else if (stageKey === 'RECEIVED') {
      navigateTo('lab');
    } else if (stageKey === 'TESTED') {
      navigateTo('tickets', { status: 'PASSED' });
    } else if (stageKey === 'CLAIM_RAISED') {
      navigateTo('pending-company');
    } else if (stageKey === 'SENT_TO_COMPANY') {
      navigateTo('replacement-pending');
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      navigateTo('stock-tasks');
    } else if (stageKey === 'STOCK_UPDATED') {
      navigateTo('claims', { status: 'STOCK_UPDATED' });
    } else if (stageKey === 'CLOSED') {
      navigateTo('tickets', { status: 'CLOSED' });
    } else {
      navigateTo('tickets');
    }
  }
}

function handleSpotlightSearch(query) {
  var resEl = document.getElementById('spotlight-search-results');
  if (!resEl) return;
  query = (query || '').trim().toLowerCase();

  if (!query) {
    resEl.innerHTML = '<div style="padding:24px; text-align:center; color:#94a3b8; font-size:13px;">Type any serial number, customer name, mobile number, or ticket ID for instant zero-latency results.</div>';
    return;
  }

  var matches = [];
  (BWMS.tickets || []).forEach(function(t) {
    var blob = [t.ticket_no, t.original_serial_no, t.customer_name, t.dealer_name, t.mobile, t.vehicle_number, t.battery_model].join(' ').toLowerCase();
    if (blob.indexOf(query) !== -1) {
      matches.push({ entityType: 'TICKET', data: t, id: t.ticket_no, serial: t.original_serial_no, title: t.ticket_no + ' • ' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name), model: t.battery_model, status: t.status });
    }
  });

  (BWMS.claims || []).forEach(function(c) {
    var blob = [c.claim_no, c.ticket_no, c.original_serial_no, c.replacement_serial_no, c.customer_name, c.dealer_name, c.mobile, c.battery_model].join(' ').toLowerCase();
    if (blob.indexOf(query) !== -1) {
      matches.push({ entityType: 'CLAIM', data: c, id: c.claim_no, serial: c.original_serial_no, title: c.claim_no + ' • ' + (c.customer_name || c.dealer_name), model: c.battery_model, status: c.status });
    }
  });

  if (matches.length === 0) {
    resEl.innerHTML =
      '<div style="padding:20px; text-align:center;">' +
      '  <div style="font-size:14px; color:#475569; margin-bottom:12px;">No active ticket or claim found for <strong>"' + query + '"</strong></div>' +
      '  <div style="display:flex; justify-content:center; gap:10px;">' +
      '    <button type="button" class="btn btn-primary btn-sm" onclick="closeFastSearchModal(); openWarrantyCalcModal(null, \'' + query + '\')">⚡ Check Warranty for this Serial</button>' +
      '    <button type="button" class="btn btn-secondary btn-sm" onclick="closeFastSearchModal(); openIntakeModal({ serial: \'' + query + '\' })">+ New Intake Ticket</button>' +
      '  </div>' +
      '</div>';
    return;
  }

  var html = '';
  matches.slice(0, 10).forEach(function(m) {
    var nextAction = m.entityType === 'TICKET' ? getTicketNextAction(m.data) : getClaimNextAction(m.data);
    var actionBtn = m.entityType === 'TICKET' ? renderTicketActions(m.data) : renderClaimActions(m.data);

    html +=
      '<div class="fast-search-row">' +
      '  <div style="flex:1;" onclick="closeFastSearchModal(); showTimeline(\'' + m.id + '\')">' +
      '    <div style="display:flex; align-items:center; gap:8px;">' +
      '      <span class="badge badge-gray">' + m.entityType + '</span>' +
      '      <strong style="color:var(--accent); font-size:14px;">' + m.id + '</strong>' +
      '      <span style="font-family:monospace; font-weight:bold; color:#1e293b; font-size:12px;">' + m.serial + '</span>' +
      '      <span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span>' +
      '    </div>' +
      '    <div style="font-size:12px; color:#475569; margin-top:2px;">' + m.title + ' • ' + m.model + '</div>' +
      '  </div>' +
      '  <div style="display:flex; gap:6px; align-items:center;" onclick="closeFastSearchModal()">' +
      actionBtn +
      '  </div>' +
      '</div>';
  });

  resEl.innerHTML = html;
}

function renderChallanActions(item) {
  var html = '<div style="display:flex; gap:6px;">';
  if (item.is_uncreated) {
    html += '<button class="btn btn-primary btn-sm" onclick="createReturnChallan(\'' + item.ticket_no + '\')">+ Generate Challan</button>';
  } else if (item.type === 'BATTERY_RETURN') {
    html += '<button class="btn btn-secondary btn-sm" onclick="printReturnChallan(\'' + item.challan_no + '\')">🖨️ Print</button>';
    if (item.status !== 'ACKNOWLEDGED' && item.status !== 'REJECTED_RETURNED') {
      html += '<button class="btn btn-danger btn-sm" onclick="openMarkReturnedModal(\'' + item.challan_no + '\')">🤝 Handover</button>';
    }
  } else {
    html += '<button class="btn btn-secondary btn-sm" onclick="printCompanyChallan(\'' + item.challan_no + '\')">🖨️ Print Batch</button>';
    var batchNo = item.dispatch_batch_no;
    if (!batchNo) {
      var d = (BWMS.dispatches || []).find(function(dsp) { return dsp.company_challan_no === item.challan_no; });
      if (d) batchNo = d.dispatch_batch_no;
    }
    if (batchNo) {
      html += '<button class="btn btn-secondary btn-sm" onclick="openBatchItemsModal(\'' + batchNo + '\')">👁️ Items</button>';
    }
  }
  if (item.ticket_no) {
    html += '<button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + item.ticket_no + '\')">👁️ Timeline</button>';
  }
  html += '</div>';
  return html;
}

function formatDate(dStr) {
  if (!dStr) return '-';
  try {
    var d = new Date(dStr);
    if (isNaN(d.getTime())) return dStr;
    var day = String(d.getDate()).padStart(2, '0');
    var mon = String(d.getMonth() + 1).padStart(2, '0');
    var yr = d.getFullYear();
    return day + '/' + mon + '/' + yr;
  } catch (e) {
    return dStr;
  }
}

    closeAllModals();

function showToast(msg, type) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  var msgEl = document.getElementById('toast-message');
  var iconEl = document.getElementById('toast-icon');

  if (msgEl) msgEl.textContent = msg;
  toast.className = 'toast show ' + (type || '');

  if (type === 'success') {
    if (iconEl) iconEl.textContent = '✅';
  } else if (type === 'error') {
    if (iconEl) iconEl.textContent = '❌';
  } else if (type === 'warning') {
    if (iconEl) iconEl.textContent = '⚠️';
  } else {
    if (iconEl) iconEl.textContent = 'ℹ️';
  }

  setTimeout(function() {
    toast.classList.remove('show');
  }, 4000);
}

function fbPickFields(obj, allowedKeys) {
  var out = {};
  (allowedKeys || []).forEach(function(k) {
    if (obj && obj[k] !== undefined) out[k] = obj[k];
  });
  return out;
}

function fbStr(v, maxLen, fallback) {
  if (v === undefined || v === null) return fallback !== undefined ? fallback : '';
  var s = String(v).trim();
  return (maxLen && s.length > maxLen) ? s.substring(0, maxLen) : s;
}

function fbNum(v, fallback, min, max) {
  if (v === undefined || v === null || v === '') return fallback;
  var n = Number(v);
  if (!isFinite(n)) return fallback;
  if (min !== undefined && n < min) n = min;
  if (max !== undefined && n > max) n = max;
  return n;
}

function fbSafeId(raw) {
  return String(raw || '').trim().replace(/\//g, '_');
}

function fbCleanConfig(obj, nowIso) {
  var src = obj || {};
  var out = { updated_at: fbStr(src.updated_at || nowIso, 50) };
  var strKeys = [
    'COMPANY_NAME', 'COMPANY_ADDRESS', 'COMPANY_PHONE', 'COMPANY_EMAIL',
    'COMPANY_GST', 'COMPANY_TERMS', 'TIMEZONE',
    'TICKET_PREFIX', 'CLAIM_PREFIX', 'RETURN_CHALLAN_PREFIX',
    'COMPANY_CHALLAN_PREFIX', 'DISPATCH_PREFIX'
  ];
  var seqKeys = [
    'TICKET_SEQ', 'CLAIM_SEQ', 'RETURN_CHALLAN_SEQ',
    'COMPANY_CHALLAN_SEQ', 'DISPATCH_SEQ'
  ];
  strKeys.forEach(function(k) {
    if (src[k] !== undefined && src[k] !== null) {
      out[k] = fbStr(src[k], k === 'COMPANY_TERMS' ? 2000 : 400);
    }
  });
  seqKeys.forEach(function(k) {
    if (src[k] !== undefined && src[k] !== null && src[k] !== '') {
      out[k] = Math.max(1, Math.round(fbNum(src[k], 1001, 1, 1000000000)));
    }
  });
  return out;
}

function fbCleanModel(m, nowIso) {
  var cap = fbNum(m.capacity_ah, 35, 0, 1000);
  var war = fbNum(m.warranty_months, 36, 0, 240);
  var gua = fbNum(m.guarantee_months, 18, 0, 240);
  var pro = fbNum(m.pro_rata_months, Math.max(0, war - gua), 0, 240);
  var out = {
    model_id: fbSafeId(m.model_id || ('MOD-' + Math.floor(Math.random() * 9000 + 1000))),
    model_code: fbStr(m.model_code || '', 60),
    brand: fbStr(m.brand || 'Amaron', 80, 'Amaron') || 'Amaron',
    model_name: fbStr(m.model_name || m.model_code || 'Battery Model', 150) || 'Battery Model',
    capacity_ah: cap,
    warranty_months: war,
    guarantee_months: gua,
    pro_rata_months: pro,
    is_active: m.is_active !== false && String(m.is_active).toUpperCase() !== 'FALSE',
    updated_at: fbStr(m.updated_at || nowIso, 50)
  };
  if (m.mrp !== undefined && m.mrp !== null && m.mrp !== '') {
    out.mrp = fbNum(m.mrp, 0, 0, 1000000);
  }
  return out;
}

function fbCleanDealer(d, nowIso) {
  return {
    dealer_id: fbSafeId(d.dealer_id || ('DLR-' + Math.floor(Math.random() * 9000 + 1000))),
    dealer_name: fbStr(d.dealer_name || 'Authorized Dealer', 150) || 'Authorized Dealer',
    contact_person: fbStr(d.contact_person || '', 100),
    mobile: fbStr(d.mobile || '', 30),
    address: fbStr(d.address || '', 300),
    gstin: fbStr(d.gstin || '', 30),
    city: fbStr(d.city || '', 80),
    is_active: d.is_active !== false && String(d.is_active).toUpperCase() !== 'FALSE',
    updated_at: fbStr(d.updated_at || nowIso, 50)
  };
}

function sortFirestoreRecords(colName, list) {
  if (!Array.isArray(list)) return [];
  var fieldMap = {
    battery_models: 'model_id',
    dealers: 'dealer_id',
    customers: 'created_at',
    tickets: 'ticket_no',
    battery_tests: 'test_date',
    claims: 'claim_no',
    claim_documents: 'uploaded_at',
    delivery_challans: 'challan_no',
    company_dispatches: 'dispatch_batch_no',
    company_dispatch_items: 'item_id',
    stock_update_log: 'claim_no',
    service_batteries: 'sb_id',
    service_battery_logs: 'created_at',
    audit_log: 'timestamp'
  };
  var key = fieldMap[colName];
  if (!key) return list;
  return list.slice().sort(function(a, b) {
    return String((a && a[key]) || '').localeCompare(String((b && b[key]) || ''));
  });
}

function fbBuildAuditDoc(action, recordType, recordId, oldStatus, newStatus, details) {
  var nowIso = new Date().toISOString();
  var yr = new Date().getFullYear();
  var id = 'AUD-' + yr + '-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 900 + 100);
  return {
    audit_id: id,
    timestamp: nowIso,
    user_email: (BWMS.currentUser && BWMS.currentUser.email) ? String(BWMS.currentUser.email).toLowerCase() : BOOTSTRAP_ADMIN_EMAIL,
    action: fbStr(action || 'EVENT', 80),
    record_type: fbStr(recordType || 'SYSTEM', 50),
    entity_type: fbStr(recordType || 'SYSTEM', 50),
    record_id: fbStr(recordId || '', 80),
    entity_id: fbStr(recordId || '', 80),
    old_status: fbStr(oldStatus || '', 60),
    new_status: fbStr(newStatus || '', 60),
    details: fbStr(details || '', 1000)
  };
}

function fbComputeNextSeq(cfgData, seqKey, prefixKey, defaultPrefix, list, field) {
  var yr = new Date().getFullYear();
  var prefix = (cfgData && cfgData[prefixKey]) ? String(cfgData[prefixKey]).trim() : defaultPrefix;
  var cfgSeq = parseInt(cfgData && cfgData[seqKey], 10);
  if (isNaN(cfgSeq) || cfgSeq < 1) cfgSeq = 1001;

  var maxExisting = 1000;
  (list || []).forEach(function(item) {
    var val = String((item && item[field]) || '');
    if (val.indexOf('-TEMP-') !== -1) return;
    var m = val.match(/(\d+)$/);
    if (m) {
      var n = parseInt(m[1], 10);
      if (!isNaN(n) && n > maxExisting) maxExisting = n;
    }
  });

  var nextNum = Math.max(cfgSeq, maxExisting + 1);
  return {
    id: prefix + '-' + yr + '-' + String(nextNum).padStart(6, '0'),
    nextSeq: nextNum + 1,
    prefix: prefix
  };
}

async function executeFirebaseAction(funcName, args) {
  var FB = (typeof window !== 'undefined') ? window.FB_CLIENT : null;
  if (!FB || !FB.db) {
    throw new Error('Firebase Firestore client is not initialized.');
  }
  if (!BWMS.isAuthorizedStaff) {
    throw new Error('Authentication required. Please sign in with an authorized staff Google account.');
  }

  var db = FB.db;
  args = args || [];
  var d = args[0] || {};
  var nowIso = new Date().toISOString();
  var todayIso = nowIso.split('T')[0];
  var userEmail = (BWMS.currentUser && BWMS.currentUser.email) ? BWMS.currentUser.email : BOOTSTRAP_ADMIN_EMAIL;
  var userName = (BWMS.currentUser && BWMS.currentUser.name) ? BWMS.currentUser.name : userEmail;

  if (funcName === 'apiCheckConnection') {
    var pingSnap = await FB.getDoc(FB.doc(db, 'config', 'app_settings'));
    return {
      success: true,
      data: { status: 'OK', project: FIREBASE_PROJECT_ID, configExists: pingSnap.exists() },
      message: 'Connected to Firebase Firestore (' + FIREBASE_PROJECT_ID + ').'
    };
  }

  if (funcName === 'apiGetBulkState') {
    var results = await Promise.all([
      FB.getDoc(FB.doc(db, 'config', 'app_settings')),
      FB.getDocs(FB.collection(db, 'battery_models')),
      FB.getDocs(FB.collection(db, 'dealers')),
      FB.getDocs(FB.collection(db, 'customers')),
      FB.getDocs(FB.collection(db, 'tickets')),
      FB.getDocs(FB.collection(db, 'battery_tests')),
      FB.getDocs(FB.collection(db, 'claims')),
      FB.getDocs(FB.collection(db, 'claim_documents')),
      FB.getDocs(FB.collection(db, 'delivery_challans')),
      FB.getDocs(FB.collection(db, 'company_dispatches')),
      FB.getDocs(FB.collection(db, 'company_dispatch_items')),
      FB.getDocs(FB.collection(db, 'stock_update_log')),
      FB.getDocs(FB.collection(db, 'service_batteries')),
      FB.getDocs(FB.collection(db, 'service_battery_logs')),
      FB.getDocs(FB.collection(db, 'audit_log'))
    ]);
    function mapSnap(colName, snap) {
      var arr = [];
      snap.forEach(function(s) { arr.push(s.data()); });
      return sortFirestoreRecords(colName, arr);
    }
    var cfg = results[0].exists() ? results[0].data() : Object.assign({}, getDefaultSeedState().config);
    var staffList = BWMS.staffList || [];
    if (BWMS.isAdminUser) {
      var staffSnap = await FB.getDocs(FB.collection(db, 'authorized_staff'));
      staffList = [];
      staffSnap.forEach(function(s) { staffList.push(s.data()); });
      staffList.sort(function(a, b) { return String(a.email || '').localeCompare(String(b.email || '')); });
    }
    var payload = {
      config: cfg,
      models: mapSnap('battery_models', results[1]),
      dealers: mapSnap('dealers', results[2]),
      customers: mapSnap('customers', results[3]),
      tickets: mapSnap('tickets', results[4]),
      tests: mapSnap('battery_tests', results[5]),
      claims: mapSnap('claims', results[6]),
      claimDocuments: mapSnap('claim_documents', results[7]),
      challans: mapSnap('delivery_challans', results[8]),
      dispatches: mapSnap('company_dispatches', results[9]),
      dispatchItems: mapSnap('company_dispatch_items', results[10]),
      stockUpdates: mapSnap('stock_update_log', results[11]),
      serviceBatteries: mapSnap('service_batteries', results[12]),
      serviceBatteryLogs: mapSnap('service_battery_logs', results[13]),
      auditLog: mapSnap('audit_log', results[14]),
      staffList: staffList,
      currentUser: BWMS.currentUser
    };
    payload.tables = {
      Config: payload.config,
      Battery_Models: payload.models,
      Dealers: payload.dealers,
      Customers: payload.customers,
      Tickets: payload.tickets,
      Battery_Tests: payload.tests,
      Claims: payload.claims,
      Claim_Documents: payload.claimDocuments,
      Delivery_Challans: payload.challans,
      Company_Dispatches: payload.dispatches,
      Company_Dispatch_Items: payload.dispatchItems,
      Stock_Update_Log: payload.stockUpdates,
      Service_Batteries: payload.serviceBatteries,
      Service_Battery_Logs: payload.serviceBatteryLogs,
      Audit_Log: payload.auditLog
    };
    return { success: true, data: payload, message: 'Synced from Firebase Firestore.' };
  }

  if (funcName === 'apiSaveConfig') {
    var cfgRef = FB.doc(db, 'config', 'app_settings');
    var updatedCfg = await FB.runTransaction(db, async function(tx) {
      var snap = await tx.get(cfgRef);
      var base = snap.exists() ? snap.data() : {};
      var merged = fbCleanConfig(Object.assign({}, base, d, { updated_at: nowIso }), nowIso);
      tx.set(cfgRef, merged);
      return merged;
    });
    await FB.setDoc(FB.doc(db, 'audit_log', fbBuildAuditDoc('CONFIG_SAVED', 'SYSTEM', 'app_settings', '', '', 'Updated shop profile configuration').audit_id),
      fbBuildAuditDoc('CONFIG_SAVED', 'SYSTEM', 'app_settings', '', '', 'Updated shop profile configuration'));
    return { success: true, data: updatedCfg, message: 'Configuration saved to Firestore.' };
  }

  if (funcName === 'apiSaveModel') {
    var existingMod = (BWMS.models || []).find(function(m) {
      return (d.model_id && m.model_id === d.model_id) || m.model_name === d.model_name;
    });
    var modelId = existingMod ? existingMod.model_id : ('MOD-' + Date.now().toString(36).toUpperCase().slice(-5));
    var modelDoc = fbCleanModel(Object.assign({}, existingMod || {}, d, { model_id: modelId, updated_at: nowIso }), nowIso);
    var audMod = fbBuildAuditDoc('BATTERY_MODEL_SAVED', 'Battery_Models', modelId, '', '', 'Saved model: ' + modelDoc.model_name);
    var bMod = FB.writeBatch(db);
    bMod.set(FB.doc(db, 'battery_models', modelId), modelDoc);
    bMod.set(FB.doc(db, 'audit_log', audMod.audit_id), audMod);
    await bMod.commit();
    return { success: true, data: modelDoc, message: 'Battery model saved to Firestore.' };
  }

  if (funcName === 'apiDeleteModel') {
    var modKey = (typeof d === 'object' && d !== null) ? (d.model_id || d.model_name) : args[0];
    var foundMod = (BWMS.models || []).find(function(m) {
      return m.model_id === modKey || m.model_name === modKey || m.model_code === modKey;
    });
    var delModId = foundMod ? foundMod.model_id : fbSafeId(modKey);
    if (!delModId) throw new Error('Battery model not found: ' + modKey);
    var audDelMod = fbBuildAuditDoc('BATTERY_MODEL_DELETED', 'Battery_Models', delModId, '', '', 'Removed model: ' + ((foundMod && foundMod.model_name) || delModId));
    var bDelMod = FB.writeBatch(db);
    bDelMod.delete(FB.doc(db, 'battery_models', delModId));
    bDelMod.set(FB.doc(db, 'audit_log', audDelMod.audit_id), audDelMod);
    await bDelMod.commit();
    return { success: true, data: { model_id: delModId, model_name: foundMod ? foundMod.model_name : delModId }, message: 'Battery model removed from Firestore.' };
  }

  if (funcName === 'apiSaveDealer') {
    var dlrId = fbSafeId(d.dealer_id || ('DLR-' + Date.now().toString(36).toUpperCase().slice(-5)));
    var dlrDoc = fbCleanDealer(Object.assign({}, d, { dealer_id: dlrId, updated_at: nowIso }), nowIso);
    var audDlr = fbBuildAuditDoc('DEALER_SAVED', 'Dealers', dlrId, '', '', 'Saved dealer: ' + dlrDoc.dealer_name);
    var bDlr = FB.writeBatch(db);
    bDlr.set(FB.doc(db, 'dealers', dlrId), dlrDoc);
    bDlr.set(FB.doc(db, 'audit_log', audDlr.audit_id), audDlr);
    await bDlr.commit();
    return { success: true, data: dlrDoc, message: 'Authorized dealer saved to Firestore.' };
  }

  if (funcName === 'apiSaveStaff' || funcName === 'apiToggleStaffActive' || funcName === 'apiDeleteStaff') {
    if (!BWMS.isAdminUser) throw new Error('Only an Admin can manage authorized staff.');
    var targetEmail = fbStr((typeof d === 'object' && d !== null) ? d.email : args[0], 150).toLowerCase();
    if (!targetEmail || targetEmail.indexOf('@') === -1) throw new Error('Valid staff email is required.');

    if (funcName === 'apiDeleteStaff') {
      if (targetEmail === BOOTSTRAP_ADMIN_EMAIL) throw new Error('Primary admin cannot be deleted.');
      var audStDel = fbBuildAuditDoc('STAFF_REMOVED', 'SYSTEM', targetEmail, '', '', 'Removed staff access: ' + targetEmail);
      var bStDel = FB.writeBatch(db);
      bStDel.delete(FB.doc(db, 'authorized_staff', targetEmail));
      bStDel.set(FB.doc(db, 'audit_log', audStDel.audit_id), audStDel);
      await bStDel.commit();
      return { success: true, data: { email: targetEmail }, message: 'Staff member removed.' };
    }

    var staffRef = FB.doc(db, 'authorized_staff', targetEmail);
    var savedStaff = await FB.runTransaction(db, async function(tx) {
      var snap = await tx.get(staffRef);
      var prev = snap.exists() ? snap.data() : null;
      var role = fbStr((d && d.role) || (prev && prev.role) || 'OPERATOR', 20).toUpperCase();
      if (role !== 'ADMIN' && role !== 'OPERATOR' && role !== 'TESTER') role = 'OPERATOR';
      var active = (funcName === 'apiToggleStaffActive') ? Boolean(d.active) : (d.active !== false);
      if (targetEmail === BOOTSTRAP_ADMIN_EMAIL) {
        role = 'ADMIN';
        active = true;
      }
      var staffDoc = {
        email: targetEmail,
        name: fbStr((d && d.name) || (prev && prev.name) || targetEmail.split('@')[0], 100) || targetEmail.split('@')[0],
        role: role,
        active: active,
        created_at: (prev && prev.created_at) ? fbStr(prev.created_at, 40) : nowIso.substring(0, 40),
        updated_at: nowIso.substring(0, 40)
      };
      tx.set(staffRef, staffDoc);
      var audSt = fbBuildAuditDoc(funcName === 'apiToggleStaffActive' ? 'STAFF_STATUS' : 'STAFF_SAVED', 'SYSTEM', targetEmail, '', role + (active ? ':ACTIVE' : ':DISABLED'), 'Updated staff access for ' + targetEmail);
      tx.set(FB.doc(db, 'audit_log', audSt.audit_id), audSt);
      return staffDoc;
    });
    return { success: true, data: savedStaff, message: 'Staff access saved.' };
  }

  if (funcName === 'apiCreateTicket') {
    var cleanSerial = fbStr(d.original_serial_no, 80);
    if (!cleanSerial) throw new Error('Battery serial number is required.');

    var liveTicketsSnap = await FB.getDocs(FB.collection(db, 'tickets'));
    var liveTickets = [];
    liveTicketsSnap.forEach(function(s) { liveTickets.push(s.data()); });

    var dup = liveTickets.find(function(t) {
      if (!t || !t.ticket_no || String(t.ticket_no).indexOf('TKT-TEMP-') === 0) return false;
      var ts = String(t.status || '').toUpperCase();
      return String(t.original_serial_no || '').trim().toLowerCase() === cleanSerial.toLowerCase() &&
             ts !== 'CLOSED' && ts !== 'CLAIM_CLOSED' && ts !== 'REJECTED_RETURNED' && ts !== 'REJECTED — RETURNED';
    });
    if (dup) throw new Error('Serial ' + cleanSerial + ' is already active under ' + dup.ticket_no + ' (' + dup.status + ').');

    var srcType = fbStr(d.source_type || 'CUSTOMER', 20).toUpperCase() === 'DEALER' ? 'DEALER' : 'CUSTOMER';
    var dealerName = srcType === 'DEALER' ? fbStr(d.dealer_name, 150) : '';
    var dealerObj = dealerName ? (BWMS.dealers || []).find(function(dl) { return String(dl.dealer_name).toLowerCase() === dealerName.toLowerCase(); }) : null;
    var partyCustName = fbStr(d.customer_name, 150) || dealerName || 'Customer';
    var mobile = fbStr(d.mobile, 30);
    var sbIssued = (d.service_battery_issued === true || String(d.service_battery_issued).toUpperCase() === 'TRUE');
    var sbSerial = sbIssued ? fbStr(d.service_battery_serial, 80) : '';
    var existingSbMeta = sbSerial ? (BWMS.serviceBatteries || []).find(function(s) {
      return String(s.serial_no || '').trim().toLowerCase() === sbSerial.toLowerCase();
    }) : null;
    var existingCust = mobile ? (BWMS.customers || []).find(function(c) { return String(c.mobile || '').trim() === mobile; }) : null;

    var cfgRef = FB.doc(db, 'config', 'app_settings');
    var sbRef = existingSbMeta ? FB.doc(db, 'service_batteries', existingSbMeta.sb_id) : null;

    var createdTkt = await FB.runTransaction(db, async function(tx) {
      var cfgSnap = await tx.get(cfgRef);
      var sbSnap = sbRef ? await tx.get(sbRef) : null;
      var cfgData = cfgSnap.exists() ? cfgSnap.data() : {};
      var seqRes = fbComputeNextSeq(cfgData, 'TICKET_SEQ', 'TICKET_PREFIX', 'TKT', liveTickets, 'ticket_no');
      var ticketNo = seqRes.id;

      // Update config counter cleanly
      var nextCfg = fbCleanConfig(Object.assign({}, cfgData, {
        TICKET_PREFIX: seqRes.prefix,
        TICKET_SEQ: seqRes.nextSeq,
        updated_at: nowIso
      }), nowIso);
      tx.set(cfgRef, nextCfg);

      // Customer creation if needed
      var custId = existingCust ? fbStr(existingCust.customer_id, 60) : '';
      if (mobile && !custId) {
        custId = 'CUST-' + new Date().getFullYear() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        tx.set(FB.doc(db, 'customers', custId), {
          customer_id: custId,
          name: partyCustName,
          mobile: mobile,
          address: fbStr(d.address, 300),
          vehicle_number: fbStr(d.vehicle_number, 40),
          created_at: nowIso
        });
      }

      // Service battery lock/assign if issued
      var sbModelFinal = sbIssued ? fbStr(d.service_battery_model || 'Standby Service Battery', 150) : '';
      var sbDateFinal = sbIssued ? fbStr(d.service_battery_date || todayIso, 30) : '';
      if (sbIssued && sbSerial) {
        var holderName = (srcType === 'DEALER' && dealerName) ? dealerName : partyCustName;
        if (sbSnap && sbSnap.exists()) {
          var liveSb = sbSnap.data();
          if (liveSb.is_blocked || liveSb.status === 'BLOCKED') {
            throw new Error('Service battery ' + sbSerial + ' is BLOCKED (' + (liveSb.block_reason || 'Unavailable') + ').');
          }
          if (liveSb.status === 'ASSIGNED') {

        remarks: fbStr(d.remarks || 'Assigned & locked to customer', 1000), created_at: nowIso
      });
      var audSbAs = fbBuildAuditDoc('SB_ASSIGNED', 'SERVICE_BATTERY', sb.sb_id, sb.status, 'ASSIGNED', 'Assigned ' + sb.serial_no + ' to ' + custName);
      tx.set(FB.doc(db, 'audit_log', audSbAs.audit_id), audSbAs);
      return upd;
    });
    return { success: true, data: assignedSb, message: 'Service battery ' + assignedSb.serial_no + ' assigned.' };
  }

  if (funcName === 'apiReturnServiceBattery') {
    var retKey = fbStr(d.sb_id || d.serial_no || d.service_battery_serial, 80);
    var retMeta = (BWMS.serviceBatteries || []).find(function(s) {
      return (retKey && (s.sb_id === retKey || String(s.serial_no || '').trim().toLowerCase() === retKey.toLowerCase())) ||
             (d.ticket_no && s.current_ticket_no === d.ticket_no);
    });
    if (!retMeta) throw new Error('Service battery not found for return.');
    var sbRefRet2 = FB.doc(db, 'service_batteries', retMeta.sb_id);
    var rDate2 = fbStr(d.returned_date || todayIso, 30);

    var returnedSb = await FB.runTransaction(db, async function(tx) {
      var sbSnap = await tx.get(sbRefRet2);
      if (!sbSnap.exists()) throw new Error('Service battery not found.');
      var sb = sbSnap.data();
      var dOut = sb.assigned_date ? Math.max(0, Math.floor((new Date(rDate2) - new Date(sb.assigned_date)) / 86400000)) : 0;
      var blockAfter = (d.block_after_return === true || sb.is_blocked === true);
      var prevCust = sb.current_customer_name || '';
      var prevTkt = sb.current_ticket_no || '';
      var prevAssign = sb.assigned_date || '';
      var upd = Object.assign({}, sb, {
        status: blockAfter ? 'BLOCKED' : 'AVAILABLE',
        is_blocked: blockAfter,
        block_reason: blockAfter ? fbStr(d.block_reason || sb.block_reason || 'Pending Recharge / Inspection', 300) : '',
        current_ticket_no: '',
        current_customer_name: '',
        current_mobile: '',
        assigned_date: '',
        last_rotated_date: rDate2,
        updated_at: nowIso
      });
      tx.set(sbRefRet2, fbPickFields(upd, FB_ALLOWED_FIELDS.service_batteries));
      var logIdRet = 'SBL-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 90 + 10);
      tx.set(FB.doc(db, 'service_battery_logs', logIdRet), {
        log_id: logIdRet, sb_id: sb.sb_id, serial_no: sb.serial_no, model_name: sb.model_name,
        action_type: 'RETURNED', ticket_no: prevTkt, customer_name: prevCust, mobile: '',
        assigned_date: prevAssign, returned_date: rDate2, days_rotated: dOut, performed_by: userEmail,
        remarks: fbStr(d.remarks || ('Returned after ' + dOut + ' day(s)'), 1000), created_at: nowIso
      });
      var audSbRet = fbBuildAuditDoc('SB_RETURNED', 'SERVICE_BATTERY', sb.sb_id, sb.status, upd.status, 'Returned ' + sb.serial_no + ' (' + dOut + ' days)');
      tx.set(FB.doc(db, 'audit_log', audSbRet.audit_id), audSbRet);
      return upd;
    });
    return { success: true, data: returnedSb, message: 'Service battery ' + returnedSb.serial_no + ' returned.' };
  }

  if (funcName === 'apiBlockServiceBattery') {
    var blkKey = fbStr(d.sb_id || d.serial_no, 80);
    var blkMeta = (BWMS.serviceBatteries || []).find(function(s) {
      return s.sb_id === blkKey || String(s.serial_no || '').trim().toLowerCase() === blkKey.toLowerCase();
    });
    if (!blkMeta) throw new Error('Service battery not found.');
    var doBlk = d.blocked !== false;
    var sbRefB = FB.doc(db, 'service_batteries', blkMeta.sb_id);

    var blockedSb = await FB.runTransaction(db, async function(tx) {
      var sbSnap = await tx.get(sbRefB);
      if (!sbSnap.exists()) throw new Error('Service battery not found.');
      var sb = sbSnap.data();
      var nextStatus = doBlk
        ? (String(sb.status).toUpperCase() === 'ASSIGNED' ? 'ASSIGNED' : 'BLOCKED')
        : ((sb.current_customer_name || sb.current_ticket_no) ? 'ASSIGNED' : 'AVAILABLE');
      var reason = doBlk ? fbStr(d.reason || d.block_reason || 'Manually Blocked', 300) : '';
      var upd = Object.assign({}, sb, {
        is_blocked: doBlk,
        block_reason: reason,
        status: nextStatus,
        updated_at: nowIso
      });
      tx.set(sbRefB, fbPickFields(upd, FB_ALLOWED_FIELDS.service_batteries));
      var logIdB = 'SBL-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 90 + 10);
      tx.set(FB.doc(db, 'service_battery_logs', logIdB), {
        log_id: logIdB, sb_id: sb.sb_id, serial_no: sb.serial_no, model_name: sb.model_name,
        action_type: doBlk ? 'BLOCKED' : 'UNBLOCKED', ticket_no: sb.current_ticket_no || '',
        customer_name: sb.current_customer_name || '', mobile: '', assigned_date: '', returned_date: '',
        days_rotated: 0, performed_by: userEmail, remarks: reason || (doBlk ? 'Blocked' : 'Unblocked'), created_at: nowIso
      });
      var audSbBlk = fbBuildAuditDoc(doBlk ? 'SB_BLOCKED' : 'SB_UNBLOCKED', 'SERVICE_BATTERY', sb.sb_id, sb.status, nextStatus, sb.serial_no + ' ' + (doBlk ? 'blocked' : 'unblocked'));
      tx.set(FB.doc(db, 'audit_log', audSbBlk.audit_id), audSbBlk);
      return upd;
    });
    return { success: true, data: blockedSb, message: 'Service battery ' + blockedSb.serial_no + (doBlk ? ' blocked.' : ' unblocked.') };
  }

  if (funcName === 'apiDeleteServiceBattery') {
    var delKey = fbStr((typeof d === 'object' && d !== null) ? (d.sb_id || d.serial_no) : args[0], 80);
    var delMeta = (BWMS.serviceBatteries || []).find(function(s) { return s.sb_id === delKey || s.serial_no === delKey; });
    if (!delMeta) throw new Error('Service battery not found.');
    if (String(delMeta.status).toUpperCase() === 'ASSIGNED') {
      throw new Error('Cannot remove while assigned to a customer.');
    }
    var logIdDel = 'SBL-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 90 + 10);
    var audSbDel = fbBuildAuditDoc('SB_REMOVED', 'SERVICE_BATTERY', delMeta.sb_id, delMeta.status, 'REMOVED', 'Removed service battery ' + delMeta.serial_no);
    var bDelSb = FB.writeBatch(db);
    bDelSb.set(FB.doc(db, 'service_battery_logs', logIdDel), {
      log_id: logIdDel, sb_id: delMeta.sb_id, serial_no: delMeta.serial_no, model_name: delMeta.model_name || '',
      action_type: 'REMOVED', ticket_no: '', customer_name: '', mobile: '', assigned_date: '', returned_date: '',
      days_rotated: 0, performed_by: userEmail, remarks: 'Removed from stock pool', created_at: nowIso
    });
    bDelSb.delete(FB.doc(db, 'service_batteries', delMeta.sb_id));
    bDelSb.set(FB.doc(db, 'audit_log', audSbDel.audit_id), audSbDel);
    await bDelSb.commit();
    return { success: true, data: { sb_id: delMeta.sb_id, serial_no: delMeta.serial_no, removed: true }, message: 'Service battery removed.' };
  }

  if (funcName === 'apiFreshResetTransactional') {
    if (!BWMS.isAdminUser) throw new Error('Only Admin accounts can wipe transactional records.');
    var resetCols = [
      'tickets', 'battery_tests', 'claims', 'claim_documents',
      'delivery_challans', 'company_dispatches', 'company_dispatch_items',
      'replacement_receipts', 'stock_update_log', 'customers'
    ];
    var delRefs = [];
    for (var ci = 0; ci < resetCols.length; ci++) {
      var snap = await FB.getDocs(FB.collection(db, resetCols[ci]));
      snap.forEach(function(docItem) { delRefs.push(docItem.ref); });
    }
    var CHUNK = 350;
    for (var wi = 0; wi < delRefs.length; wi += CHUNK) {
      var batchDel = FB.writeBatch(db);
      delRefs.slice(wi, wi + CHUNK).forEach(function(r) { batchDel.delete(r); });
      await batchDel.commit();
    }

    // Release any ASSIGNED service batteries back to pool
    var sbSnapAll = await FB.getDocs(FB.collection(db, 'service_batteries'));
    var batchResetExtra = FB.writeBatch(db);
    sbSnapAll.forEach(function(sbDoc) {
      var sb = sbDoc.data();
      if (String(sb.status).toUpperCase() === 'ASSIGNED' || sb.current_ticket_no) {
        var upd = Object.assign({}, sb, {
          status: sb.is_blocked ? 'BLOCKED' : 'AVAILABLE',
          current_ticket_no: '',
          current_customer_name: '',
          current_mobile: '',
          assigned_date: '',
          updated_at: nowIso
        });
        batchResetExtra.set(sbDoc.ref, fbPickFields(upd, FB_ALLOWED_FIELDS.service_batteries));
      }
    });

    // Reset sequence counters to 1001
    var cfgSnapCur = await FB.getDoc(FB.doc(db, 'config', 'app_settings'));
    var baseCfg = cfgSnapCur.exists() ? cfgSnapCur.data() : {};
    var resetCfg = fbCleanConfig(Object.assign({}, baseCfg, {
      TICKET_SEQ: 1001,
      CLAIM_SEQ: 1001,
      RETURN_CHALLAN_SEQ: 1001,
      COMPANY_CHALLAN_SEQ: 1001,
      DISPATCH_SEQ: 1001,
      updated_at: nowIso
    }), nowIso);
    batchResetExtra.set(FB.doc(db, 'config', 'app_settings'), resetCfg);
    var audRst = fbBuildAuditDoc('FRESH_RESET', 'SYSTEM', 'all_tickets', '', 'CLEAN', 'Cleared ' + delRefs.length + ' transactional records for fresh start');
    batchResetExtra.set(FB.doc(db, 'audit_log', audRst.audit_id), audRst);
    await batchResetExtra.commit();

    return { success: true, data: { deletedCount: delRefs.length }, message: 'Cleared ' + delRefs.length + ' ticket/claim records. Portal is ready for a fresh start!' };
  }

  throw new Error('Unsupported Firebase action: ' + funcName);
}

function nextLocalSeq(prefix, list, field) {
  var year = new Date().getFullYear();
  var maxNum = 1000;
  (list || []).forEach(function(item) {
    var val = String(item[field] || '');
    if (val.indexOf('-TEMP-') !== -1) return;
    var m = val.match(/(\d+)$/);
    if (m) {
      var n = parseInt(m[1], 10);
      if (!isNaN(n) && n > maxNum) maxNum = n;
    }
  });
  return prefix + '-' + year + '-' + String(maxNum + 1).padStart(6, '0');
}

function appendLocalAudit(action, recordType, recordId, details) {
  var nowIso = new Date().toISOString();
  BWMS.auditLog = BWMS.auditLog || [];
  BWMS.auditLog.push({
    audit_id: 'AUD-' + Date.now().toString().slice(-6),
    timestamp: nowIso,
    user_email: (BWMS.currentUser && BWMS.currentUser.email) ? BWMS.currentUser.email : 'staff@distributor.in',
    action: action,
    record_type: recordType,
    entity_type: recordType,
    record_id: recordId,
    entity_id: recordId,
    details: details || ''
  });
}

function executeLocalFallback(funcName, args) {
  args = args || [];
  var d = args[0] || {};
  var todayIso = new Date().toISOString().split('T')[0];
  var nowIso = new Date().toISOString();

  try {
    if (funcName === 'apiGetBulkState') {
      if (!BWMS.models || BWMS.models.length === 0) {
        var seed = getDefaultSeedState();
        applyStateData(seed);
      }
      saveStateToLocalCache();
      return {
        success: true,
        isLocalFallback: true,
        data: {
          tables: {
            Config: BWMS.config,
            Battery_Models: BWMS.models,
            Dealers: BWMS.dealers,
            Tickets: BWMS.tickets,
            Claims: BWMS.claims,
            Battery_Tests: BWMS.tests,
            Delivery_Challans: BWMS.challans,
            Company_Dispatches: BWMS.dispatches,
            Company_Dispatch_Items: BWMS.dispatchItems,
            Stock_Update_Log: BWMS.stockUpdates,
            Service_Batteries: BWMS.serviceBatteries,
            Service_Battery_Logs: BWMS.serviceBatteryLogs,
            Audit_Log: BWMS.auditLog
          },
          config: BWMS.config,
          models: BWMS.models,
          dealers: BWMS.dealers,
          tickets: BWMS.tickets,
          claims: BWMS.claims,
          tests: BWMS.tests,
          challans: BWMS.challans,
          dispatches: BWMS.dispatches,
          dispatchItems: BWMS.dispatchItems,
          stockUpdates: BWMS.stockUpdates,
          serviceBatteries: BWMS.serviceBatteries,
          serviceBatteryLogs: BWMS.serviceBatteryLogs,
          auditLog: BWMS.auditLog,
          currentUser: BWMS.currentUser
        },
        message: 'Loaded local state'
      };
    }

    if (funcName === 'apiCreateTicket') {
      var tNo = nextLocalSeq('TKT', BWMS.tickets, 'ticket_no');
      if (d.service_battery_issued && d.service_battery_serial) {
        var sbSer = String(d.service_battery_serial).trim();
        var sbCheck = executeLocalFallback('apiAssignServiceBattery', [{
          serial_no: sbSer,
          model_name: d.service_battery_model || 'Standby Service Battery',
          ticket_no: tNo,
          customer_name: (d.source_type === 'DEALER' && d.dealer_name) ? d.dealer_name : d.customer_name,
          mobile: d.mobile || '',
          assigned_date: d.service_battery_date || todayIso,
          auto_create: true,
          skip_ticket_update: true
        }]);
        if (!sbCheck.success) return sbCheck;
      }
      var ticket = Object.assign({}, d, {
        ticket_no: tNo,
        status: 'RECEIVED',
        date_received: d.date_received || todayIso,
        created_at: nowIso,
        updated_at: nowIso
      });
      BWMS.tickets.push(ticket);
      appendLocalAudit('INTAKE', 'TICKET', tNo, 'Intake ticket created for ' + (ticket.customer_name || ticket.dealer_name) + ' (' + ticket.original_serial_no + ')');
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: ticket, message: 'Ticket ' + tNo + ' created.' };
    }

    if (funcName === 'apiRecordBatteryTest') {
      var tkt = (BWMS.tickets || []).find(function(t) { return t.ticket_no === d.ticket_no; });
      var newStatus = (String(d.test_result).toUpperCase() === 'PASS') ? 'PASSED' : 'REJECTED_RETURN_PENDING';
      if (tkt) {
        tkt.status = newStatus;
        tkt.updated_at = nowIso;
      }
      var testRec = Object.assign({}, d, {
        test_id: 'TST-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 900000 + 100000),
        original_serial_no: tkt ? tkt.original_serial_no : (d.original_serial_no || ''),
        test_date: d.test_date || todayIso
      });
      BWMS.tests.push(testRec);
      appendLocalAudit(newStatus === 'PASSED' ? 'TEST_PASS' : 'TEST_REJECT', 'TICKET', d.ticket_no, 'Diagnostic test: ' + d.test_result);
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: { test: testRec, ticket_no: d.ticket_no, new_status: newStatus }, message: 'Test recorded (' + d.test_result + ').' };
    }

    if (funcName === 'apiCreateClaim') {
      var origTicket = (BWMS.tickets || []).find(function(t) { return t.ticket_no === d.ticket_no; });
      if (!origTicket) return { success: false, error: 'Ticket not found: ' + d.ticket_no, message: 'Ticket not found' };
      var cNo = nextLocalSeq('CLM', BWMS.claims, 'claim_no');
      var wCalc = calculateWarrantyDetails(origTicket.battery_model, d.date_of_sale, origTicket.date_received || todayIso);
      var wStatus = (wCalc.status === 'FULL_GUARANTEE') ? 'IN_WARRANTY' : (wCalc.status === 'PRO_RATA' ? 'PRO_RATA' : 'OUT_OF_WARRANTY');
      var expIso = wCalc.warrantyExpiry ? (wCalc.warrantyExpiry instanceof Date ? wCalc.warrantyExpiry.toISOString().split('T')[0] : String(wCalc.warrantyExpiry)) : '';
      var immEndL = d.replacement_end ? String(d.replacement_end).trim().toUpperCase() : '';
      var hasImmL = Boolean((immEndL === 'DISTRIBUTOR_END' || immEndL === 'DEALER_END' || immEndL === 'COMPANY_END') && d.replacement_serial_no);
      if (hasImmL && String(d.replacement_serial_no).trim().toLowerCase() === String(origTicket.original_serial_no || '').trim().toLowerCase()) {
        return { success: false, error: 'Replacement serial cannot match original serial', message: 'Duplicate serial rejected' };
      }
      var immModelL = hasImmL ? (d.replacement_model || origTicket.battery_model || '') : '';
      var immPartyL = hasImmL ? (d.replaced_by_party || (immEndL === 'DEALER_END' ? origTicket.dealer_name : ((BWMS.config && BWMS.config.COMPANY_NAME) || 'Distributor Counter'))) : '';
      var immDateL = hasImmL ? (d.replacement_received_date || todayIso) : '';
      var claimRec = {
        claim_no: cNo,
        ticket_no: origTicket.ticket_no,
        source_type: origTicket.source_type || 'CUSTOMER',
        customer_name: origTicket.customer_name || '',
        dealer_name: origTicket.dealer_name || '',
        mobile: origTicket.mobile || '',
        address: origTicket.address || '',
        vehicle_number: origTicket.vehicle_number || '',
        battery_model: origTicket.battery_model || '',
        original_serial_no: origTicket.original_serial_no || '',
        date_of_sale: d.date_of_sale || '',
        warranty_months: wCalc.totalMonths || 36,
        warranty_expiry_date: expIso,
        warranty_status: wStatus,
        claim_date: todayIso,
        status: hasImmL ? 'REPLACEMENT_RECEIVED' : 'CLAIM_CREATED',
        replacement_end: hasImmL ? immEndL : '',
        replaced_by_party: immPartyL,
        replacement_model: immModelL,
        replacement_serial_no: hasImmL ? String(d.replacement_serial_no).trim() : '',
        replacement_received_date: immDateL,
        stock_status: hasImmL ? 'UPDATE_REQUIRED' : 'NOT_APPLICABLE',
        stock_ref_no: hasImmL ? (d.company_invoice_ref || '') : '',
        remarks: d.remarks || origTicket.remarks || '',
        created_at: nowIso,
        updated_at: nowIso
      };
      BWMS.claims.push(claimRec);
      origTicket.status = claimRec.status;
      if (hasImmL) {
        BWMS.stockUpdates = BWMS.stockUpdates || [];
        BWMS.stockUpdates.push({
          stock_task_id: 'STK-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 900000 + 100000),
          claim_no: cNo,
          replacement_model: immModelL,
          replacement_serial_no: claimRec.replacement_serial_no,
          received_date: immDateL,
          replacement_end: immEndL,
          stock_status: 'UPDATE_REQUIRED',
          accounting_ref_no: d.company_invoice_ref || '',
          updated_at: '',
          updated_by: '',
          remarks: getReplacementEndLabel(immEndL) + ' replacement (' + immModelL + ') pending ERP entry'
        });
      }
      appendLocalAudit('CLAIM_CREATE', 'CLAIM', cNo, 'Warranty claim created for ' + origTicket.original_serial_no);
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: claimRec, message: 'Warranty Claim ' + cNo + ' created.' };
    }

    if (funcName === 'apiCreateReturnChallan') {
      var tId = typeof d === 'string' ? d : d.ticket_no;

      if (doBlk) {
        blkSb.status = (String(blkSb.status).toUpperCase() === 'ASSIGNED') ? 'ASSIGNED' : 'BLOCKED';
      } else {
        blkSb.status = (blkSb.current_customer_name || blkSb.current_ticket_no) ? 'ASSIGNED' : 'AVAILABLE';
      }
      blkSb.updated_at = nowIso;
      BWMS.serviceBatteryLogs.push({
        log_id: 'SBL-' + Date.now().toString().slice(-6),
        sb_id: blkSb.sb_id,
        serial_no: blkSb.serial_no,
        model_name: blkSb.model_name,
        action_type: doBlk ? 'BLOCKED' : 'UNBLOCKED',
        ticket_no: blkSb.current_ticket_no || '',
        customer_name: blkSb.current_customer_name || '',
        mobile: '',
        assigned_date: '',
        returned_date: '',
        days_rotated: 0,
        remarks: blkSb.block_reason || (doBlk ? 'Blocked' : 'Unblocked'),
        created_at: nowIso
      });
      appendLocalAudit(doBlk ? 'SB_BLOCKED' : 'SB_UNBLOCKED', 'SERVICE_BATTERY', blkSb.sb_id, blkSb.serial_no + ' ' + (doBlk ? 'blocked' : 'unblocked'));
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: blkSb, message: 'Service battery ' + blkSb.serial_no + (doBlk ? ' blocked.' : ' unblocked.') };
    }

    if (funcName === 'apiDeleteServiceBattery') {
      var delKey = (typeof d === 'object' && d !== null) ? (d.sb_id || d.serial_no) : args[0];
      var delSb = (BWMS.serviceBatteries || []).find(function(s) { return s.sb_id === delKey || s.serial_no === delKey; });
      if (!delSb) return { success: false, error: 'Service battery not found.', message: 'Not found' };
      if (String(delSb.status).toUpperCase() === 'ASSIGNED') {
        return { success: false, error: 'Cannot remove while assigned to customer.', message: 'Battery assigned' };
      }
      BWMS.serviceBatteries = (BWMS.serviceBatteries || []).filter(function(s) { return s !== delSb; });
      appendLocalAudit('SB_REMOVED', 'SERVICE_BATTERY', delSb.sb_id, 'Removed service battery ' + delSb.serial_no);
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: { sb_id: delSb.sb_id, serial_no: delSb.serial_no, removed: true }, message: 'Service battery removed.' };
    }

    if (funcName === 'apiSaveDealer') {
      var newDlr = {
        dealer_id: 'DLR-' + Math.floor(Math.random() * 9000 + 1000),
        dealer_name: d.dealer_name,
        contact_person: d.contact_person || '',
        mobile: d.mobile || '',
        gstin: d.gstin || '',
        address: d.address || '',
        is_active: true
      };
      BWMS.dealers.push(newDlr);
      appendLocalAudit('DEALER_SAVED', 'Dealers', newDlr.dealer_id, 'Saved dealer: ' + newDlr.dealer_name);
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: newDlr, message: 'Dealer saved.' };
    }

    if (funcName === 'apiUploadDocument') {
      BWMS.claimDocuments = BWMS.claimDocuments || [];
      var newDoc = {
        doc_id: 'DOC-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 900000 + 100000),
        claim_no: d.claim_no,
        doc_type: d.doc_type || d.document_type || 'OTHER',
        file_name: d.file_name || 'document.pdf',
        mime_type: d.mime_type || 'application/octet-stream',
        file_size_kb: parseInt(d.file_size_kb, 10) || 1,
        data_url: d.data_url || ('data:' + (d.mime_type || 'application/octet-stream') + ';base64,' + (d.file_base64 || '')),
        uploaded_at: nowIso,
        uploaded_by: (BWMS.currentUser && BWMS.currentUser.email) || BOOTSTRAP_ADMIN_EMAIL
      };
      BWMS.claimDocuments.push(newDoc);
      var uClm = (BWMS.claims || []).find(function(c) { return c.claim_no === d.claim_no; });
      if (uClm) {
        uClm.doc_count = (uClm.doc_count || 0) + 1;
        if (uClm.status === 'CLAIM_CREATED') uClm.status = 'READY_FOR_COMPANY';
      }
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: newDoc, message: 'Document attached to claim ' + d.claim_no };
    }

    if (funcName === 'apiDeleteDocument') {
      var delDId = (typeof d === 'object' && d !== null) ? d.doc_id : args[0];
      var delCNo = (typeof d === 'object' && d !== null) ? d.claim_no : args[1];
      BWMS.claimDocuments = (BWMS.claimDocuments || []).filter(function(docItem) { return docItem.doc_id !== delDId; });
      if (delCNo) {
        var dClm = (BWMS.claims || []).find(function(c) { return c.claim_no === delCNo; });
        if (dClm) dClm.doc_count = Math.max(0, (dClm.doc_count || 1) - 1);
      }
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: { doc_id: delDId }, message: 'Document removed.' };
    }

    if (funcName === 'apiSaveStaff' || funcName === 'apiToggleStaffActive' || funcName === 'apiDeleteStaff') {
      BWMS.staffList = BWMS.staffList || [];
      var sEmail = String((typeof d === 'object' && d !== null) ? d.email : args[0] || '').trim().toLowerCase();
      if (!sEmail || sEmail.indexOf('@') === -1) return { success: false, error: 'Valid email required' };
      if (funcName === 'apiDeleteStaff') {
        if (sEmail === BOOTSTRAP_ADMIN_EMAIL) return { success: false, error: 'Primary admin protected' };
        BWMS.staffList = BWMS.staffList.filter(function(s) { return s.email !== sEmail; });
        return { success: true, isLocalFallback: true, data: { email: sEmail }, message: 'Staff deleted.' };
      }
      var exSt = BWMS.staffList.find(function(s) { return s.email === sEmail; });
      var nextSt = {
        email: sEmail,
        name: (d && d.name) || (exSt && exSt.name) || sEmail.split('@')[0],
        role: (sEmail === BOOTSTRAP_ADMIN_EMAIL) ? 'ADMIN' : ((d && d.role) || (exSt && exSt.role) || 'OPERATOR'),
        active: (sEmail === BOOTSTRAP_ADMIN_EMAIL) ? true : ((funcName === 'apiToggleStaffActive') ? !!d.active : (d.active !== false)),
        created_at: (exSt && exSt.created_at) || nowIso,
        updated_at: nowIso
      };
      if (exSt) Object.assign(exSt, nextSt);
      else BWMS.staffList.push(nextSt);
      return { success: true, isLocalFallback: true, data: nextSt, message: 'Staff saved.' };
    }

    if (funcName === 'apiFreshResetTransactional') {
      BWMS.tickets = [];
      BWMS.tests = [];
      BWMS.claims = [];
      BWMS.claimDocuments = [];
      BWMS.challans = [];
      BWMS.dispatches = [];
      BWMS.dispatchItems = [];
      BWMS.stockUpdates = [];
      BWMS.customers = [];
      (BWMS.serviceBatteries || []).forEach(function(sb) {
        if (String(sb.status).toUpperCase() === 'ASSIGNED') {
          sb.status = sb.is_blocked ? 'BLOCKED' : 'AVAILABLE';
          sb.current_ticket_no = '';
          sb.current_customer_name = '';
          sb.current_mobile = '';
          sb.assigned_date = '';
        }
      });
      if (BWMS.config) {
        BWMS.config.TICKET_SEQ = 1001;
        BWMS.config.CLAIM_SEQ = 1001;
        BWMS.config.RETURN_CHALLAN_SEQ = 1001;
        BWMS.config.COMPANY_CHALLAN_SEQ = 1001;
        BWMS.config.DISPATCH_SEQ = 1001;
      }
      saveStateToLocalCache();
      return { success: true, isLocalFallback: true, data: { deletedCount: 1 }, message: 'Cleared all transactional records.' };
    }

    if (funcName === 'apiCheckConnection') {
      return { success: true, isLocalFallback: true, data: { status: 'OK', project: FIREBASE_PROJECT_ID }, message: 'Local store active.' };
    }
  } catch (localErr) {
    return { success: false, error: localErr.message, message: localErr.message };
  }
  return { success: false, error: 'Action not supported offline: ' + funcName, message: 'Action not supported offline' };
}

function callServer(funcName, args, onSuccess, onError) {
  args = args || [];

  // 1. Primary Cloud Backend: Firebase Cloud Firestore
  if (typeof window !== 'undefined' && window.FB_CLIENT && window.FB_CLIENT.ready && window.FB_CLIENT.db) {
    executeFirebaseAction(funcName, args)
      .then(function(res) {
        if (onSuccess) onSuccess(res);
      })
      .catch(function(err) {
        var errMsg = (err && err.message) ? err.message : String(err);
        if (onError) onError(errMsg);
        else if (onSuccess) onSuccess({ success: false, error: errMsg, message: errMsg });
        else showToast('Firestore Error: ' + errMsg, 'error');
      });
    return;
  }

  // 2. If running inside Google Apps Script iframe environment (legacy fallback):
  if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run[funcName] === 'function') {
    var runner = google.script.run
      .withSuccessHandler(function(response) {
        if (onSuccess) onSuccess(response);
      })
      .withFailureHandler(function(error) {
        var errMsg = (error && error.message) ? error.message : String(error);
        if (onError) onError(errMsg);
        else showToast('Server Error: ' + errMsg, 'error');
      });
    runner[funcName].apply(runner, args);
    return;
  }

  // 3. Offline / Node.js VM local engine for unit tests
  var localRes = executeLocalFallback(funcName, args);
  if (onSuccess) onSuccess(localRes);
}
</script>
