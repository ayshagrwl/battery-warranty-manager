// ─── INSTANT WARRANTY ENGINE & CALCULATOR ────────────────────────────────────

function addCalendarMonths(dateInput, monthsToAdd) {
  var d = parseClientDate(dateInput);
  if (!d) return null;
  var months = parseInt(monthsToAdd, 10);
  if (isNaN(months)) return null;

  var targetYear = d.getFullYear();
  var targetMonth = d.getMonth() + months;
  var targetDay = d.getDate();

  var result = new Date(targetYear, targetMonth, targetDay);
  // Handle month-end boundary overflows (e.g. Aug 31 + 6 months -> Feb 28, Feb 29 + 12M -> Feb 28)
  if (result.getDate() !== targetDay) {
    result.setDate(0); // Clamps to last day of target month
  }
  return result;
}

function parseClientDate(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
  var s = String(val).trim();
  if (s.indexOf('T') !== -1) s = s.split('T')[0];
  var parts = s.split('-');
  if (parts.length === 3 && parts[0].length === 4) {
    var yr = parseInt(parts[0], 10);
    var mo = parseInt(parts[1], 10) - 1;
    var day = parseInt(parts[2], 10);
    return new Date(yr, mo, day);
  }
  var d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function getElapsedCalendarMonths(saleDate, refDate) {
  var s = new Date(saleDate.getFullYear(), saleDate.getMonth(), saleDate.getDate());
  var r = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
  if (r < s) return 0;
  var months = (r.getFullYear() - s.getFullYear()) * 12 + (r.getMonth() - s.getMonth());
  if (r.getDate() < s.getDate()) {
    months--;
  }
  return Math.max(0, months);
}

function findBatteryModel(modelQuery) {
  if (!modelQuery) return null;
  var q = String(modelQuery).trim().toLowerCase();
  var models = BWMS.models || [];

  // 1. Exact match on model_name, model_id, or model_code
  var match = models.find(function(m) {
    var n = String(m.model_name || '').toLowerCase();
    var id = String(m.model_id || '').toLowerCase();
    var c = String(m.model_code || '').toLowerCase();
    return n === q || id === q || c === q;
  });
  if (match) return match;

  // 2. Substring match
  match = models.find(function(m) {
    var n = String(m.model_name || '').toLowerCase();
    var id = String(m.model_id || '').toLowerCase();
    var c = String(m.model_code || '').toLowerCase();
    return n.indexOf(q) !== -1 || q.indexOf(n) !== -1 || (c && (c.indexOf(q) !== -1 || q.indexOf(c) !== -1));
  });
  if (match) return match;

  // 3. Token match (e.g. 0BH40B20R, 42B20R, EPIQ35R, ML35R)
  var tokens = q.split(/[\s\-_(),/]+/).filter(function(t) { return t.length >= 4; });
  if (tokens.length > 0) {
    match = models.find(function(m) {
      var n = String(m.model_name || '').toLowerCase();
      var id = String(m.model_id || '').toLowerCase();
      var c = String(m.model_code || '').toLowerCase();
      var hay = n + ' ' + id + ' ' + c;
      return tokens.some(function(tok) { return hay.indexOf(tok) !== -1; });
    });
    if (match) return match;
  }

  return null;
}

function calculateWarrantyDetails(modelQuery, dateOfSaleStr, refDateStr, mrpValue) {
  var model = findBatteryModel(modelQuery);
  var rawQ = String(modelQuery || '').trim();

  // Extract warranty numbers from model object or model string pattern (e.g. "36+18" or "(24+24)" or "36M")
  var totalMonths = 0;
  var guaranteeMonths = 0;
  var proRataMonths = 0;

  if (model) {
    totalMonths = parseInt(model.warranty_months, 10) || 0;
    guaranteeMonths = parseInt(model.guarantee_months, 10) || 0;
    proRataMonths = parseInt(model.pro_rata_months, 10) || 0;
  }

  // Fallback to pattern matching in query string if not found or 0
  if (guaranteeMonths === 0 || totalMonths === 0) {
    var plusMatch = rawQ.match(/(\d{1,2})\s*[\+\/]\s*(\d{1,2})/);
    if (plusMatch) {
      guaranteeMonths = parseInt(plusMatch[1], 10);
      proRataMonths = parseInt(plusMatch[2], 10);
      totalMonths = guaranteeMonths + proRataMonths;
    } else {
      var mMatch = rawQ.match(/(\d{1,2})\s*(?:m\b|months)/i);
      if (mMatch) {
        totalMonths = parseInt(mMatch[1], 10);
        guaranteeMonths = Math.round(totalMonths / 2);
        proRataMonths = totalMonths - guaranteeMonths;
      }
    }
  }

  if (totalMonths <= 0) totalMonths = 24;
  if (guaranteeMonths <= 0) guaranteeMonths = 12;
  if (proRataMonths <= 0) proRataMonths = Math.max(0, totalMonths - guaranteeMonths);
  if (totalMonths < guaranteeMonths + proRataMonths) totalMonths = guaranteeMonths + proRataMonths;

  // Estimate realistic MRP from Ah capacity if not explicitly provided
  var ah = model && model.capacity_ah ? parseInt(model.capacity_ah, 10) : 0;
  if (!ah) {
    var ahMatch = rawQ.match(/(\d{2,3})\s*ah/i);
    if (ahMatch) ah = parseInt(ahMatch[1], 10);
  }
  var defaultMrp = 5500;
  if (ah > 0) {
    if (ah <= 35) defaultMrp = 4900;
    else if (ah <= 45) defaultMrp = 6400;
    else if (ah <= 65) defaultMrp = 7800;
    else if (ah <= 80) defaultMrp = 9500;
    else if (ah <= 100) defaultMrp = 11500;
    else defaultMrp = 14500;
  }

  var mrp = parseFloat(mrpValue) || (model && model.mrp ? parseFloat(model.mrp) : defaultMrp);

  if (!dateOfSaleStr) {
    return {
      hasDate: false,
      model: model,
      totalMonths: totalMonths,
      guaranteeMonths: guaranteeMonths,
      proRataMonths: proRataMonths,
      mrp: mrp
    };
  }

  var saleDate = parseClientDate(dateOfSaleStr);
  var refDate = refDateStr ? parseClientDate(refDateStr) : new Date();
  if (!saleDate || isNaN(saleDate.getTime())) {
    return { hasDate: false, model: model, totalMonths: totalMonths, guaranteeMonths: guaranteeMonths, proRataMonths: proRataMonths, mrp: mrp };
  }

  var saleMidnight = new Date(saleDate.getFullYear(), saleDate.getMonth(), saleDate.getDate());
  var refMidnight = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());

  var guaranteeExpiry = addCalendarMonths(saleMidnight, guaranteeMonths);
  var warrantyExpiry = addCalendarMonths(saleMidnight, totalMonths);

  var diffDays = Math.floor((refMidnight.getTime() - saleMidnight.getTime()) / (1000 * 60 * 60 * 24));
  var elapsedMonths = getElapsedCalendarMonths(saleMidnight, refMidnight);

  var status = 'EXPIRED';
  var discountPercent = 0;
  var payablePercent = 100;
  var customerPayable = mrp;
  var coverageLabel = 'Warranty Expired';
  var badgeClass = 'step-danger';
  var explanation = '';

  if (refMidnight <= guaranteeExpiry) {
    status = 'FULL_GUARANTEE';
    discountPercent = 100;
    payablePercent = 0;
    customerPayable = 0;
    coverageLabel = '100% Free Replacement Guarantee';
    badgeClass = 'step-green';
    var daysLeft = Math.max(0, Math.floor((guaranteeExpiry.getTime() - refMidnight.getTime()) / (1000 * 60 * 60 * 24)));
    var mosLeft = Math.max(0, guaranteeMonths - elapsedMonths);
    explanation = 'Battery is within the ' + guaranteeMonths + '-month guarantee period (' + mosLeft + ' months / ' + daysLeft + ' days remaining until ' + formatDate(guaranteeExpiry) + '). The customer is entitled to a 100% free replacement battery from the manufacturer. Customer payable: ₹0.';
  } else if (refMidnight <= warrantyExpiry) {
    status = 'PRO_RATA';
    var monthsUsedInProRata = Math.max(1, elapsedMonths - guaranteeMonths + 1);
    discountPercent = proRataMonths > 0 ? Math.max(0, Math.round(100 - (monthsUsedInProRata / proRataMonths) * 100)) : 0;
    payablePercent = 100 - discountPercent;
    customerPayable = Math.round((mrp * payablePercent) / 100);
    coverageLabel = 'Pro-Rata Warranty (' + discountPercent + '% Discount)';
    badgeClass = 'step-blue';
    var daysUntilFinal = Math.max(0, Math.floor((warrantyExpiry.getTime() - refMidnight.getTime()) / (1000 * 60 * 60 * 24)));
    explanation = 'Battery is in the pro-rata period (Month ' + (elapsedMonths + 1) + ' of ' + totalMonths + ', ' + daysUntilFinal + ' days left until ' + formatDate(warrantyExpiry) + '). Customer receives a ' + discountPercent + '% discount on the replacement battery MRP. Customer pays remaining ' + payablePercent + '% balance: ₹' + customerPayable.toLocaleString('en-IN') + ' (on ₹' + mrp.toLocaleString('en-IN') + ' MRP).';
  } else {
    status = 'EXPIRED';
    discountPercent = 0;
    payablePercent = 100;
    customerPayable = mrp;
    coverageLabel = 'Out of Warranty (Expired)';
    badgeClass = 'step-danger';
    var daysPast = Math.max(0, Math.floor((refMidnight.getTime() - warrantyExpiry.getTime()) / (1000 * 60 * 60 * 24)));
    explanation = 'Warranty expired on ' + formatDate(warrantyExpiry) + ' (' + (daysPast > 0 ? daysPast + ' days ago' : 'past expiry date') + '). Battery is outside manufacturer warranty window (' + totalMonths + ' months). Standard scrap buyback or retail exchange can be offered.';
  }

  return {
    hasDate: true,
    model: model,
    saleDate: saleDate,
    refDate: refDate,
    diffMonths: elapsedMonths,
    diffDays: diffDays,
    totalMonths: totalMonths,
    guaranteeMonths: guaranteeMonths,
    proRataMonths: proRataMonths,
    guaranteeExpiry: guaranteeExpiry,
    warrantyExpiry: warrantyExpiry,
    status: status,
    discountPercent: discountPercent,
    payablePercent: payablePercent,
    mrp: mrp,
    customerPayable: customerPayable,
    coverageLabel: coverageLabel,
    badgeClass: badgeClass,
    explanation: explanation
  };
}

  var html =

function resetWarrantyCalc(prefix) {
  var sEl = getCalcElement(prefix, 'serial'); if (sEl) sEl.value = '';
  var mEl = getCalcElement(prefix, 'model'); if (mEl) mEl.value = '';
  var dEl = getCalcElement(prefix, 'dos'); if (dEl) dEl.value = '';
  var pEl = getCalcElement(prefix, 'mrp'); if (pEl) pEl.value = '';
  var statusEl = getCalcElement(prefix, 'serial-status');
  if (statusEl) statusEl.textContent = 'Enter serial number to lookup';
  var resBox = getCalcElement(prefix, 'result');
  if (resBox) {
    resBox.innerHTML = '';
    resBox.style.display = 'none';
  }
}

function lookupSerialInCalc(prefix) {
  var serialInp = getCalcElement(prefix, 'serial');
  var statusEl = getCalcElement(prefix, 'serial-status');
  if (!serialInp) return;
  var rawSerial = serialInp.value.trim();
  var serial = rawSerial.replace(/^['"]|['"]$/g, '').toLowerCase();
  if (!serial) {
    if (statusEl) statusEl.textContent = 'Please enter a serial number to search';
    return;
  }

  var tMatch = (BWMS.tickets || []).find(function(t) {
    if (!t.original_serial_no) return false;
    var s = String(t.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase();
    return s === serial;
  });
  var cMatch = (BWMS.claims || []).find(function(c) {
    var s1 = c.original_serial_no ? String(c.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
    var s2 = c.replacement_serial_no ? String(c.replacement_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
    return s1 === serial || s2 === serial;
  });

  if (!tMatch && !cMatch && serial.length >= 4) {
    tMatch = (BWMS.tickets || []).find(function(t) {
      if (!t.original_serial_no) return false;
      var s = String(t.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase();
      return s.indexOf(serial) !== -1 || serial.indexOf(s) !== -1;
    });
    cMatch = (BWMS.claims || []).find(function(c) {
      var s1 = c.original_serial_no ? String(c.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
      var s2 = c.replacement_serial_no ? String(c.replacement_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
      return (s1 && (s1.indexOf(serial) !== -1 || serial.indexOf(s1) !== -1)) ||
             (s2 && (s2.indexOf(serial) !== -1 || serial.indexOf(s2) !== -1));
    });
  }

  if (tMatch || cMatch) {
    var match = tMatch || cMatch;
    var linkedClaim = (BWMS.claims || []).find(function(c) {
      return (tMatch && c.ticket_no === tMatch.ticket_no) || (cMatch && c.claim_no === cMatch.claim_no);
    });
    var linkedTicket = (BWMS.tickets || []).find(function(t) {
      return (cMatch && t.ticket_no === cMatch.ticket_no) || (tMatch && t.ticket_no === tMatch.ticket_no);
    });

    var modelEl = getCalcElement(prefix, 'model');
    if (modelEl) {
      var modelName = match.battery_model || (linkedClaim && linkedClaim.battery_model) || (linkedTicket && linkedTicket.battery_model);
      if (modelName) setSelectValueFuzzy(modelEl, modelName);
    }
    var dosEl = getCalcElement(prefix, 'dos');
    if (dosEl) {
      var dos = (linkedClaim && linkedClaim.date_of_sale) || match.date_of_sale;
      if (!dos && linkedTicket && linkedTicket.remarks) {
        var mDos = linkedTicket.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
        if (mDos) dos = mDos[1];
      }
      if (!dos && match.remarks) {
        var mDos2 = match.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
        if (mDos2) dos = mDos2[1];
      }
      if (!dos) dos = match.date_received;
      if (dos) dosEl.value = dos.indexOf('T') !== -1 ? dos.split('T')[0] : dos;
    }
    if (statusEl) {
      var recId = match.ticket_no || match.claim_no;
      var party = match.customer_name || match.dealer_name || '';
      statusEl.innerHTML = '<span style="color:#15803d; font-weight:bold;">✓ Found Record: ' + recId + (party ? ' (' + party + ')' : '') + '</span>';
    }
    var matchObj = {
      ticket_no: match.ticket_no || (linkedTicket && linkedTicket.ticket_no),
      claim_no: match.claim_no || (linkedClaim && linkedClaim.claim_no),
      status: match.status,
      battery_model: match.battery_model || (linkedClaim && linkedClaim.battery_model),
      original_serial_no: match.original_serial_no
    };
    runWarrantyCalculator(prefix, matchObj);
  } else {
    if (statusEl) {
      statusEl.innerHTML = '<span style="color:#b45309;">⚠️ Serial not found in active records. Select model & sale date above to compute warranty.</span>';
    }
    var modelVal = getCalcElement(prefix, 'model') ? getCalcElement(prefix, 'model').value : '';
    if (modelVal) runWarrantyCalculator(prefix);
  }
}

function openWarrantyCalcModal(prefillModel, prefillSerial, prefillDos) {
  populateDropdowns();
  var modelEl = getCalcElement('modal', 'model');
  var serialEl = getCalcElement('modal', 'serial');
  var dosEl = getCalcElement('modal', 'dos');

  if (prefillModel && modelEl) {
    setSelectValueFuzzy(modelEl, prefillModel);
  }
  if (prefillSerial && serialEl) {
    serialEl.value = prefillSerial;
  }
  if (prefillDos && dosEl) {
    dosEl.value = prefillDos;
  }
  if (prefillModel || prefillSerial || prefillDos) {
    runWarrantyCalculator('modal');
  }
  openModal('modal-warranty-calc');
}

function openIntakeWithCalcData(prefix) {
  var modelVal = getCalcElement(prefix, 'model') ? getCalcElement(prefix, 'model').value : '';
  var serialVal = getCalcElement(prefix, 'serial') ? getCalcElement(prefix, 'serial').value : '';
  var dosVal = getCalcElement(prefix, 'dos') ? getCalcElement(prefix, 'dos').value : '';

  if (prefix === 'modal') {
    closeModal('modal-warranty-calc');
  }

  openIntakeModal({
    model: modelVal,
    serial: serialVal,
    dos: dosVal
  });
}

function renderWarrantyPipeline(containerId, activeFilter) {
  var el = document.getElementById(containerId);
  if (!el) return;

  var tickets = BWMS.tickets || [];
  var claims = BWMS.claims || [];

  var countReceived = tickets.filter(function(t) { return t.status === 'RECEIVED' || t.status === 'TESTING'; }).length;
  var countTested = tickets.filter(function(t) {
    var s = (t.status || '').toUpperCase();
    return s === 'PASSED' || s === 'TEST_PASSED' || s === 'REJECTED_RETURN_PENDING' || s === 'TEST_REJECTED';
  }).length;
  var countClaimRaised = claims.filter(function(c) {
    var s = (c.status || '').toUpperCase();
    return s === 'CLAIM_CREATED' || s === 'READY_FOR_COMPANY';
  }).length;
  var countSent = claims.filter(function(c) { return c.status === 'SENT_TO_COMPANY'; }).length;
  var countRepReceived = claims.filter(function(c) {
    var s = (c.status || '').toUpperCase();
    return s === 'REPLACEMENT_RECEIVED' && c.stock_status !== 'UPDATED';
  }).length;
  var countStockUpdated = claims.filter(function(c) {
    var s = (c.status || '').toUpperCase();
    return s === 'STOCK_UPDATED' || (s === 'REPLACEMENT_RECEIVED' && c.stock_status === 'UPDATED');
  }).length;
  var countClosed = tickets.filter(function(t) {
    var s = (t.status || '').toUpperCase();
    return s === 'CLOSED' || s === 'CLAIM_CLOSED' || s === 'REJECTED_RETURNED' || s === 'REJECTED — RETURNED';
  }).length;
  var totalItems = tickets.length;

  var currentActive = activeFilter || 'ALL';

  var isTestedActive = (currentActive === 'PASSED' || currentActive === 'TESTED' || currentActive === 'REJECTED_RETURN_PENDING' || currentActive === 'TEST_REJECTED');
  var isClaimRaisedActive = (currentActive === 'CLAIM_CREATED' || currentActive === 'CLAIM_RAISED' || currentActive === 'READY_FOR_COMPANY');
  var isSentActive = (currentActive === 'SENT_TO_COMPANY');
  var isRepReceivedActive = (currentActive === 'REPLACEMENT_RECEIVED');
  var isStockUpdatedActive = (currentActive === 'STOCK_UPDATED');
  var isClosedActive = (currentActive === 'CLOSED' || currentActive === 'CLAIM_CLOSED' || currentActive === 'REJECTED_RETURNED');

  var html =
    '<div class="warranty-pipeline-card">' +
    '  <div class="pipeline-header">' +
    '    <div class="pipeline-title"><span>⚡</span> <span>Warranty Lifecycle Pipeline Tracker</span></div>' +
    '    <div class="pipeline-subtitle">Click any stage to filter active items across the entire workflow</div>' +
    '  </div>' +
    '  <div class="pipeline-stages-bar">' +
    '    <div class="pipeline-stage ' + (currentActive === 'ALL' ? 'active' : '') + '" onclick="filterPipelineStage(\'ALL\')" id="' + containerId + '-stage-all">' +
    '      <div class="pstage-top"><span class="pstage-num">●</span><span class="pstage-count">' + totalItems + '</span></div>' +
    '      <div class="pstage-name">All Items</div>' +
    '      <div class="pstage-sub">Entire Registry</div>' +
    '    </div>' +
    '    <div class="pstage-arrow">➔</div>' +
    '    <div class="pipeline-stage ' + (currentActive === 'RECEIVED' ? 'active' : '') + '" onclick="filterPipelineStage(\'RECEIVED\')" id="' + containerId + '-stage-1">' +
    '      <div class="pstage-top"><span class="pstage-num">1</span><span class="pstage-count">' + countReceived + '</span></div>' +
    '      <div class="pstage-name">📥 Received</div>' +
    '      <div class="pstage-sub">Testing Due</div>' +
    '    </div>' +
    '    <div class="pstage-arrow">➔</div>' +
    '    <div class="pipeline-stage ' + (isTestedActive ? 'active' : '') + '" onclick="filterPipelineStage(\'TESTED\')" id="' + containerId + '-stage-2">' +
    '      <div class="pstage-top"><span class="pstage-num">2</span><span class="pstage-count">' + countTested + '</span></div>' +
    '      <div class="pstage-name">🔬 Tested</div>' +
    '      <div class="pstage-sub">Claim / Challan</div>' +
    '    </div>' +
    '    <div class="pstage-arrow">➔</div>' +
    '    <div class="pipeline-stage ' + (isClaimRaisedActive ? 'active' : '') + '" onclick="filterPipelineStage(\'CLAIM_RAISED\')" id="' + containerId + '-stage-3">' +
    '      <div class="pstage-top"><span class="pstage-num">3</span><span class="pstage-count">' + countClaimRaised + '</span></div>' +
    '      <div class="pstage-name">📋 Claim Raised</div>' +
    '      <div class="pstage-sub">Dispatch Due</div>' +
    '    </div>' +
    '    <div class="pstage-arrow">➔</div>' +
    '    <div class="pipeline-stage ' + (isSentActive ? 'active' : '') + '" onclick="filterPipelineStage(\'SENT_TO_COMPANY\')" id="' + containerId + '-stage-4">' +
    '      <div class="pstage-top"><span class="pstage-num">4</span><span class="pstage-count">' + countSent + '</span></div>' +
    '      <div class="pstage-name">🏭 Sent to Mfr</div>' +
    '      <div class="pstage-sub">At Factory</div>' +
    '    </div>' +
    '    <div class="pstage-arrow">➔</div>' +
    '    <div class="pipeline-stage ' + (isRepReceivedActive ? 'active' : '') + '" onclick="filterPipelineStage(\'REPLACEMENT_RECEIVED\')" id="' + containerId + '-stage-5">' +
    '      <div class="pstage-top"><span class="pstage-num">5</span><span class="pstage-count">' + countRepReceived + '</span></div>' +
    '      <div class="pstage-name">⏳ Rep Received</div>' +
    '      <div class="pstage-sub">Stock Task Due</div>' +
    '    </div>' +
    '    <div class="pstage-arrow">➔</div>' +
    '    <div class="pipeline-stage ' + (isStockUpdatedActive ? 'active' : '') + '" onclick="filterPipelineStage(\'STOCK_UPDATED\')" id="' + containerId + '-stage-6">' +
    '      <div class="pstage-top"><span class="pstage-num">6</span><span class="pstage-count">' + countStockUpdated + '</span></div>' +
    '      <div class="pstage-name">📦 Stock Updated</div>' +
    '      <div class="pstage-sub">Handover Due</div>' +
    '    </div>' +
    '    <div class="pstage-arrow">➔</div>' +
    '    <div class="pipeline-stage ' + (isClosedActive ? 'active' : '') + '" onclick="filterPipelineStage(\'CLOSED\')" id="' + containerId + '-stage-7">' +
    '      <div class="pstage-top"><span class="pstage-num">7</span><span class="pstage-count">' + countClosed + '</span></div>' +
    '      <div class="pstage-name">✅ Completed</div>' +
    '      <div class="pstage-sub">Closed</div>' +
    '    </div>' +
    '  </div>' +
    '</div>';

  el.innerHTML = html;
}

function filterPipelineStage(stageKey) {
  var v = BWMS.activeView;
  if (v === 'tickets') {
    var statusSelect = document.getElementById('filter-tickets-status');
    if (stageKey === 'ALL') {
      if (statusSelect) { statusSelect.value = 'ALL'; renderTicketsTable(); }
    } else if (stageKey === 'RECEIVED') {
      if (statusSelect) { statusSelect.value = 'RECEIVED'; renderTicketsTable(); }
    } else if (stageKey === 'TESTED') {
      if (statusSelect) { statusSelect.value = 'PASSED'; renderTicketsTable(); }
    } else if (stageKey === 'CLAIM_RAISED') {
      if (statusSelect) { statusSelect.value = 'CLAIM_CREATED'; renderTicketsTable(); }
    } else if (stageKey === 'SENT_TO_COMPANY') {
      navigateTo('replacement-pending');
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      navigateTo('stock-tasks');
    } else if (stageKey === 'STOCK_UPDATED') {
      navigateTo('claims', { status: 'STOCK_UPDATED' });
    } else if (stageKey === 'CLOSED') {
      if (statusSelect) { statusSelect.value = 'CLOSED'; renderTicketsTable(); }
    }
  } else if (v === 'claims') {
    var claimSelect = document.getElementById('filter-claims-status');
    if (stageKey === 'ALL') {
      if (claimSelect) { claimSelect.value = 'ALL'; renderClaimsTable(); }
    } else if (stageKey === 'RECEIVED') {
      navigateTo('lab');
    } else if (stageKey === 'TESTED') {
      navigateTo('tickets', { status: 'PASSED' });
    } else if (stageKey === 'CLAIM_RAISED') {
      if (claimSelect) { claimSelect.value = 'CLAIM_CREATED'; renderClaimsTable(); }
    } else if (stageKey === 'SENT_TO_COMPANY') {
      if (claimSelect) { claimSelect.value = 'SENT_TO_COMPANY'; renderClaimsTable(); }
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      if (claimSelect) { claimSelect.value = 'REPLACEMENT_RECEIVED'; renderClaimsTable(); }
    } else if (stageKey === 'STOCK_UPDATED') {
      if (claimSelect) { claimSelect.value = 'STOCK_UPDATED'; renderClaimsTable(); }
    } else if (stageKey === 'CLOSED') {
      if (claimSelect) { claimSelect.value = 'CLOSED'; renderClaimsTable(); }
    }
  } else {
    // Dashboard or other views
    if (stageKey === 'ALL') {
      navigateTo('tickets');
    } else if (stageKey === 'RECEIVED') {
      navigateTo('lab');
    } else if (stageKey === 'TESTED') {
      navigateTo('tickets', { status: 'PASSED' });
    } else if (stageKey === 'CLAIM_RAISED') {
      navigateTo('pending-company');
    } else if (stageKey === 'SENT_TO_COMPANY') {
      navigateTo('replacement-pending');
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      navigateTo('stock-tasks');
    } else if (stageKey === 'STOCK_UPDATED') {
      navigateTo('claims', { status: 'STOCK_UPDATED' });
    } else if (stageKey === 'CLOSED') {
      navigateTo('tickets', { status: 'CLOSED' });
    } else {
      navigateTo('tickets');
    }
  }
}

// ─── FAST SEARCH SPOTLIGHT MODAL ─────────────────────────────────────────────

function openFastSearchModal() {
  var bd = document.getElementById('fast-search-backdrop');
  if (bd) {
    bd.style.display = 'flex';
    var inp = document.getElementById('spotlight-search-input');
    if (inp) {
      inp.value = '';
      inp.focus();
      handleSpotlightSearch('');
    }
  }
}

function closeFastSearchModal() {
  var bd = document.getElementById('fast-search-backdrop');
  if (bd) bd.style.display = 'none';
}

function handleSpotlightSearch(query) {
  var resEl = document.getElementById('spotlight-search-results');
  if (!resEl) return;
  query = (query || '').trim().toLowerCase();

  if (!query) {
    resEl.innerHTML = '<div style="padding:24px; text-align:center; color:#94a3b8; font-size:13px;">Type any serial number, customer name, mobile number, or ticket ID for instant zero-latency results.</div>';
    return;
  }

  var matches = [];
  (BWMS.tickets || []).forEach(function(t) {
    var blob = [t.ticket_no, t.original_serial_no, t.customer_name, t.dealer_name, t.mobile, t.vehicle_number, t.battery_model].join(' ').toLowerCase();
    if (blob.indexOf(query) !== -1) {
      matches.push({ entityType: 'TICKET', data: t, id: t.ticket_no, serial: t.original_serial_no, title: t.ticket_no + ' • ' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name), model: t.battery_model, status: t.status });
    }
  });

  (BWMS.claims || []).forEach(function(c) {
    var blob = [c.claim_no, c.ticket_no, c.original_serial_no, c.replacement_serial_no, c.customer_name, c.dealer_name, c.mobile, c.battery_model].join(' ').toLowerCase();
    if (blob.indexOf(query) !== -1) {
      matches.push({ entityType: 'CLAIM', data: c, id: c.claim_no, serial: c.original_serial_no, title: c.claim_no + ' • ' + (c.customer_name || c.dealer_name), model: c.battery_model, status: c.status });
    }
  });

  if (matches.length === 0) {
    resEl.innerHTML =
      '<div style="padding:20px; text-align:center;">' +
      '  <div style="font-size:14px; color:#475569; margin-bottom:12px;">No active ticket or claim found for <strong>"' + query + '"</strong></div>' +
      '  <div style="display:flex; justify-content:center; gap:10px;">' +
      '    <button type="button" class="btn btn-primary btn-sm" onclick="closeFastSearchModal(); openWarrantyCalcModal(null, \'' + query + '\')">⚡ Check Warranty for this Serial</button>' +
      '    <button type="button" class="btn btn-secondary btn-sm" onclick="closeFastSearchModal(); openIntakeModal({ serial: \'' + query + '\' })">+ New Intake Ticket</button>' +
      '  </div>' +
      '</div>';
    return;
  }

  var html = '';
  matches.slice(0, 10).forEach(function(m) {
    var nextAction = m.entityType === 'TICKET' ? getTicketNextAction(m.data) : getClaimNextAction(m.data);
    var actionBtn = m.entityType === 'TICKET' ? renderTicketActions(m.data) : renderClaimActions(m.data);

    html +=
      '<div class="fast-search-row">' +
      '  <div style="flex:1;" onclick="closeFastSearchModal(); showTimeline(\'' + m.id + '\')">' +
      '    <div style="display:flex; align-items:center; gap:8px;">' +
      '      <span class="badge badge-gray">' + m.entityType + '</span>' +
      '      <strong style="color:var(--accent); font-size:14px;">' + m.id + '</strong>' +
      '      <span style="font-family:monospace; font-weight:bold; color:#1e293b; font-size:12px;">' + m.serial + '</span>' +
      '      <span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span>' +
      '    </div>' +
      '    <div style="font-size:12px; color:#475569; margin-top:2px;">' + m.title + ' • ' + m.model + '</div>' +
      '  </div>' +
      '  <div style="display:flex; gap:6px; align-items:center;" onclick="closeFastSearchModal()">' +
      actionBtn +
      '  </div>' +
      '</div>';
  });

  resEl.innerHTML = html;
}

function renderChallanActions(item) {
  var html = '<div style="display:flex; gap:6px;">';
  if (item.is_uncreated) {
    html += '<button class="btn btn-primary btn-sm" onclick="createReturnChallan(\'' + item.ticket_no + '\')">+ Generate Challan</button>';
  } else if (item.type === 'BATTERY_RETURN') {
    html += '<button class="btn btn-secondary btn-sm" onclick="printReturnChallan(\'' + item.challan_no + '\')">🖨️ Print</button>';
    if (item.status !== 'ACKNOWLEDGED' && item.status !== 'REJECTED_RETURNED') {
      html += '<button class="btn btn-danger btn-sm" onclick="openMarkReturnedModal(\'' + item.challan_no + '\')">🤝 Handover</button>';
    }
  } else {
    html += '<button class="btn btn-secondary btn-sm" onclick="printCompanyChallan(\'' + item.challan_no + '\')">🖨️ Print Batch</button>';
    var batchNo = item.dispatch_batch_no;
    if (!batchNo) {
      var d = (BWMS.dispatches || []).find(function(dsp) { return dsp.company_challan_no === item.challan_no; });
      if (d) batchNo = d.dispatch_batch_no;
    }
    if (batchNo) {
      html += '<button class="btn btn-secondary btn-sm" onclick="openBatchItemsModal(\'' + batchNo + '\')">👁️ Items</button>';
    }
  }
  if (item.ticket_no) {
    html += '<button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + item.ticket_no + '\')">👁️ Timeline</button>';
  }
  html += '</div>';
  return html;
}

function formatDate(dStr) {
  if (!dStr) return '-';
  try {
    var d = new Date(dStr);
    if (isNaN(d.getTime())) return dStr;
    var day = String(d.getDate()).padStart(2, '0');
    var mon = String(d.getMonth() + 1).padStart(2, '0');
    var yr = d.getFullYear();
    return day + '/' + mon + '/' + yr;
  } catch (e) {
    return dStr;
  }
}

// ─── MODAL CONTROLS & TOAST ───────────────────────────────────────────────────

function openModal(id) {
  var el = document.getElementById(id);
  if (el) {
    el.classList.add('active');
    el.classList.add('open');
    if (document.body && document.body.style) {
      document.body.style.overflow = 'hidden';
    }
  }
}

function closeModal(id) {
  var el = document.getElementById(id);
  if (el) {
    el.classList.remove('active');
    el.classList.remove('open');
    if (document.body && document.body.style) {
      document.body.style.overflow = '';
    }
  }
}

function closeAllModals() {
  document.querySelectorAll('.modal, .modal-overlay').forEach(function(m) {
    m.classList.remove('active');
    m.classList.remove('open');
  });
  closeFastSearchModal();
  document.body.style.overflow = '';
}

window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' || e.key === 'Esc') {
    closeAllModals();
  }
});

function showToast(msg, type) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  var msgEl = document.getElementById('toast-message');
  var iconEl = document.getElementById('toast-icon');

  if (msgEl) msgEl.textContent = msg;
  toast.className = 'toast show ' + (type || '');

  if (type === 'success') {
    if (iconEl) iconEl.textContent = '✅';
  } else if (type === 'error') {
    if (iconEl) iconEl.textContent = '❌';
  } else if (type === 'warning') {
    if (iconEl) iconEl.textContent = '⚠️';
  } else {
    if (iconEl) iconEl.textContent = 'ℹ️';
  }

  setTimeout(function() {
    toast.classList.remove('show');
  }, 4000);
}

// ─── UNIVERSAL RPC RUNNER (APPS SCRIPT & GITHUB PAGES) ───────────────────────

var PROD_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8veuql4nvWujUKPskLUGKFB7l0DnPTlyMbkdh6OgPfJkJlI1IUNovRYyKMEHRPm1j/exec";

function callServer(funcName, args, onSuccess, onError) {
  args = args || [];

  // 1. If running inside Google Apps Script iframe environment:
  if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run[funcName] === 'function') {
    var runner = google.script.run
      .withSuccessHandler(function(response) {
        if (onSuccess) onSuccess(response);
      })
      .withFailureHandler(function(error) {
        var errMsg = (error && error.message) ? error.message : String(error);
        if (onError) onError(errMsg);
        else showToast('Server Error: ' + errMsg, 'error');
      });
    runner[funcName].apply(runner, args);
    return;
  }

  // 2. If running on GitHub Pages or standalone browser — use HTTP fetch to Apps Script Web App
  var url = PROD_WEB_APP_URL;
  var payload = {
    action: funcName,
    args: args
  };

  fetch(url, {
    method: 'POST',
    mode: 'cors',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  })
  .then(function(res) {
    if (!res.ok) {
      throw new Error('HTTP ' + res.status + ': ' + res.statusText);
    }
    return res.json();
  })
  .then(function(json) {
    if (onSuccess) onSuccess(json);
  })
  .catch(function(err) {
    // If POST fails (e.g. strict network filter), try GET fallback
    var getUrl = url + '?action=' + encodeURIComponent(funcName) + '&args=' + encodeURIComponent(JSON.stringify(args));
    fetch(getUrl, { mode: 'cors', redirect: 'follow' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (onSuccess) onSuccess(data);
      })
      .catch(function(getErr) {
        console.error('Remote API Error in [' + funcName + ']:', getErr);
        var msg = (getErr && getErr.message) ? getErr.message : String(getErr);
        if (onError) onError(msg);
        else showToast('Backend error: ' + msg, 'error');
      });
  });
}
