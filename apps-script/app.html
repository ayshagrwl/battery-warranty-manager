  var mEl = getCalcElement(prefix, 'model'); if (mEl) mEl.value = '';
  var dEl = getCalcElement(prefix, 'dos'); if (dEl) dEl.value = '';
  var pEl = getCalcElement(prefix, 'mrp'); if (pEl) pEl.value = '';
  var statusEl = getCalcElement(prefix, 'serial-status');
  if (statusEl) statusEl.textContent = 'Enter serial number to lookup';
  var resBox = getCalcElement(prefix, 'result');
  if (resBox) {
    resBox.innerHTML = '';
    resBox.style.display = 'none';
  }
}

function lookupSerialInCalc(prefix) {
  var serialInp = getCalcElement(prefix, 'serial');
  var statusEl = getCalcElement(prefix, 'serial-status');
  if (!serialInp) return;
  var rawSerial = serialInp.value.trim();
  var serial = rawSerial.replace(/^['"]|['"]$/g, '').toLowerCase();
  if (!serial) {
    if (statusEl) statusEl.textContent = 'Please enter a serial number to search';
    return;
  }

  var tMatch = (BWMS.tickets || []).find(function(t) {
    if (!t.original_serial_no) return false;
    var s = String(t.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase();
    return s === serial;
  });
  var cMatch = (BWMS.claims || []).find(function(c) {
    var s1 = c.original_serial_no ? String(c.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
    var s2 = c.replacement_serial_no ? String(c.replacement_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
    return s1 === serial || s2 === serial;
  });

  if (!tMatch && !cMatch && serial.length >= 4) {
    tMatch = (BWMS.tickets || []).find(function(t) {
      if (!t.original_serial_no) return false;
      var s = String(t.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase();
      return s.indexOf(serial) !== -1 || serial.indexOf(s) !== -1;
    });
    cMatch = (BWMS.claims || []).find(function(c) {
      var s1 = c.original_serial_no ? String(c.original_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
      var s2 = c.replacement_serial_no ? String(c.replacement_serial_no).trim().replace(/^['"]|['"]$/g, '').toLowerCase() : '';
      return (s1 && (s1.indexOf(serial) !== -1 || serial.indexOf(s1) !== -1)) ||
             (s2 && (s2.indexOf(serial) !== -1 || serial.indexOf(s2) !== -1));
    });
  }

  if (tMatch || cMatch) {
    var match = tMatch || cMatch;
    var linkedClaim = (BWMS.claims || []).find(function(c) {
      return (tMatch && c.ticket_no === tMatch.ticket_no) || (cMatch && c.claim_no === cMatch.claim_no);
    });
    var linkedTicket = (BWMS.tickets || []).find(function(t) {
      return (cMatch && t.ticket_no === cMatch.ticket_no) || (tMatch && t.ticket_no === tMatch.ticket_no);
    });

    var modelEl = getCalcElement(prefix, 'model');
    if (modelEl) {
      var modelName = match.battery_model || (linkedClaim && linkedClaim.battery_model) || (linkedTicket && linkedTicket.battery_model);
      if (modelName) setSelectValueFuzzy(modelEl, modelName);
    }
    var dosEl = getCalcElement(prefix, 'dos');
    if (dosEl) {
      var dos = (linkedClaim && linkedClaim.date_of_sale) || match.date_of_sale;
      if (!dos && linkedTicket && linkedTicket.remarks) {
        var mDos = linkedTicket.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
        if (mDos) dos = mDos[1];
      }
      if (!dos && match.remarks) {
        var mDos2 = match.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
        if (mDos2) dos = mDos2[1];
      }
      if (!dos) dos = match.date_received;
      if (dos) dosEl.value = dos.indexOf('T') !== -1 ? dos.split('T')[0] : dos;
    }
    if (statusEl) {
      var recId = match.ticket_no || match.claim_no;
      var party = match.customer_name || match.dealer_name || '';
      statusEl.innerHTML = '<span style="color:#15803d; font-weight:bold;">✓ Found Record: ' + recId + (party ? ' (' + party + ')' : '') + '</span>';
    }
    var matchObj = {
      ticket_no: match.ticket_no || (linkedTicket && linkedTicket.ticket_no),
      claim_no: match.claim_no || (linkedClaim && linkedClaim.claim_no),
      status: match.status,
      battery_model: match.battery_model || (linkedClaim && linkedClaim.battery_model),
      original_serial_no: match.original_serial_no
    };
    runWarrantyCalculator(prefix, matchObj);
  } else {
    if (statusEl) {
      statusEl.innerHTML = '<span style="color:#b45309;">⚠️ Serial not found in active records. Select model & sale date above to compute warranty.</span>';
    }
    var modelVal = getCalcElement(prefix, 'model') ? getCalcElement(prefix, 'model').value : '';
    if (modelVal) runWarrantyCalculator(prefix);
  }
}

function filterPipelineStage(stageKey) {
  var v = BWMS.activeView;
  if (v === 'tickets') {
    var statusSelect = document.getElementById('filter-tickets-status');
    if (stageKey === 'ALL') {
      if (statusSelect) { statusSelect.value = 'ALL'; renderTicketsTable(); }
    } else if (stageKey === 'RECEIVED') {
      if (statusSelect) { statusSelect.value = 'RECEIVED'; renderTicketsTable(); }
    } else if (stageKey === 'TESTED') {
      if (statusSelect) { statusSelect.value = 'PASSED'; renderTicketsTable(); }
    } else if (stageKey === 'CLAIM_RAISED') {
      if (statusSelect) { statusSelect.value = 'CLAIM_CREATED'; renderTicketsTable(); }
    } else if (stageKey === 'SENT_TO_COMPANY') {
      navigateTo('replacement-pending');
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      navigateTo('stock-tasks');
    } else if (stageKey === 'STOCK_UPDATED') {
      navigateTo('claims', { status: 'STOCK_UPDATED' });
    } else if (stageKey === 'CLOSED') {
      if (statusSelect) { statusSelect.value = 'CLOSED'; renderTicketsTable(); }
    }
  } else if (v === 'claims') {
    var claimSelect = document.getElementById('filter-claims-status');
    if (stageKey === 'ALL') {
      if (claimSelect) { claimSelect.value = 'ALL'; renderClaimsTable(); }
    } else if (stageKey === 'RECEIVED') {
      navigateTo('lab');
    } else if (stageKey === 'TESTED') {
      navigateTo('tickets', { status: 'PASSED' });
    } else if (stageKey === 'CLAIM_RAISED') {
      if (claimSelect) { claimSelect.value = 'CLAIM_CREATED'; renderClaimsTable(); }
    } else if (stageKey === 'SENT_TO_COMPANY') {
      if (claimSelect) { claimSelect.value = 'SENT_TO_COMPANY'; renderClaimsTable(); }
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      if (claimSelect) { claimSelect.value = 'REPLACEMENT_RECEIVED'; renderClaimsTable(); }
    } else if (stageKey === 'STOCK_UPDATED') {
      if (claimSelect) { claimSelect.value = 'STOCK_UPDATED'; renderClaimsTable(); }
    } else if (stageKey === 'CLOSED') {
      if (claimSelect) { claimSelect.value = 'CLOSED'; renderClaimsTable(); }
    }
  } else {
    // Dashboard or other views
    if (stageKey === 'ALL') {
      navigateTo('tickets');
    } else if (stageKey === 'RECEIVED') {
      navigateTo('lab');
    } else if (stageKey === 'TESTED') {
      navigateTo('tickets', { status: 'PASSED' });
    } else if (stageKey === 'CLAIM_RAISED') {
      navigateTo('pending-company');
    } else if (stageKey === 'SENT_TO_COMPANY') {
      navigateTo('replacement-pending');
    } else if (stageKey === 'REPLACEMENT_RECEIVED') {
      navigateTo('stock-tasks');
    } else if (stageKey === 'STOCK_UPDATED') {
      navigateTo('claims', { status: 'STOCK_UPDATED' });
    } else if (stageKey === 'CLOSED') {
      navigateTo('tickets', { status: 'CLOSED' });
    } else {
      navigateTo('tickets');
    }
  }
}

// ─── FAST SEARCH SPOTLIGHT MODAL ─────────────────────────────────────────────

function openFastSearchModal() {
  var bd = document.getElementById('fast-search-backdrop');
  if (bd) {
    bd.style.display = 'flex';
    var inp = document.getElementById('spotlight-search-input');
    if (inp) {
      inp.value = '';
      inp.focus();
      handleSpotlightSearch('');
    }
  }
}

function closeFastSearchModal() {
  var bd = document.getElementById('fast-search-backdrop');
  if (bd) bd.style.display = 'none';
}

function handleSpotlightSearch(query) {
  var resEl = document.getElementById('spotlight-search-results');
  if (!resEl) return;
  query = (query || '').trim().toLowerCase();

  if (!query) {
    resEl.innerHTML = '<div style="padding:24px; text-align:center; color:#94a3b8; font-size:13px;">Type any serial number, customer name, mobile number, or ticket ID for instant zero-latency results.</div>';
    return;
  }

  var matches = [];
  (BWMS.tickets || []).forEach(function(t) {
    var blob = [t.ticket_no, t.original_serial_no, t.customer_name, t.dealer_name, t.mobile, t.vehicle_number, t.battery_model].join(' ').toLowerCase();
    if (blob.indexOf(query) !== -1) {
      matches.push({ entityType: 'TICKET', data: t, id: t.ticket_no, serial: t.original_serial_no, title: t.ticket_no + ' • ' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name), model: t.battery_model, status: t.status });
    }
  });

  (BWMS.claims || []).forEach(function(c) {
    var blob = [c.claim_no, c.ticket_no, c.original_serial_no, c.replacement_serial_no, c.customer_name, c.dealer_name, c.mobile, c.battery_model].join(' ').toLowerCase();
    if (blob.indexOf(query) !== -1) {
      matches.push({ entityType: 'CLAIM', data: c, id: c.claim_no, serial: c.original_serial_no, title: c.claim_no + ' • ' + (c.customer_name || c.dealer_name), model: c.battery_model, status: c.status });
    }
  });

  if (matches.length === 0) {
    resEl.innerHTML =
      '<div style="padding:20px; text-align:center;">' +
      '  <div style="font-size:14px; color:#475569; margin-bottom:12px;">No active ticket or claim found for <strong>"' + query + '"</strong></div>' +
      '  <div style="display:flex; justify-content:center; gap:10px;">' +
      '    <button type="button" class="btn btn-primary btn-sm" onclick="closeFastSearchModal(); openWarrantyCalcModal(null, \'' + query + '\')">⚡ Check Warranty for this Serial</button>' +
      '    <button type="button" class="btn btn-secondary btn-sm" onclick="closeFastSearchModal(); openIntakeModal({ serial: \'' + query + '\' })">+ New Intake Ticket</button>' +
      '  </div>' +
      '</div>';
    return;
  }

  var html = '';
  matches.slice(0, 10).forEach(function(m) {
    var nextAction = m.entityType === 'TICKET' ? getTicketNextAction(m.data) : getClaimNextAction(m.data);
    var actionBtn = m.entityType === 'TICKET' ? renderTicketActions(m.data) : renderClaimActions(m.data);

    html +=
      '<div class="fast-search-row">' +
      '  <div style="flex:1;" onclick="closeFastSearchModal(); showTimeline(\'' + m.id + '\')">' +
      '    <div style="display:flex; align-items:center; gap:8px;">' +
      '      <span class="badge badge-gray">' + m.entityType + '</span>' +
      '      <strong style="color:var(--accent); font-size:14px;">' + m.id + '</strong>' +
      '      <span style="font-family:monospace; font-weight:bold; color:#1e293b; font-size:12px;">' + m.serial + '</span>' +
      '      <span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span>' +
      '    </div>' +
      '    <div style="font-size:12px; color:#475569; margin-top:2px;">' + m.title + ' • ' + m.model + '</div>' +
      '  </div>' +
      '  <div style="display:flex; gap:6px; align-items:center;" onclick="closeFastSearchModal()">' +
      actionBtn +
      '  </div>' +
      '</div>';
  });

  resEl.innerHTML = html;
}

function renderChallanActions(item) {
  var html = '<div style="display:flex; gap:6px;">';
  if (item.is_uncreated) {
    html += '<button class="btn btn-primary btn-sm" onclick="createReturnChallan(\'' + item.ticket_no + '\')">+ Generate Challan</button>';
  } else if (item.type === 'BATTERY_RETURN') {
    html += '<button class="btn btn-secondary btn-sm" onclick="printReturnChallan(\'' + item.challan_no + '\')">🖨️ Print</button>';
    if (item.status !== 'ACKNOWLEDGED' && item.status !== 'REJECTED_RETURNED') {
      html += '<button class="btn btn-danger btn-sm" onclick="openMarkReturnedModal(\'' + item.challan_no + '\')">🤝 Handover</button>';
    }
  } else {
    html += '<button class="btn btn-secondary btn-sm" onclick="printCompanyChallan(\'' + item.challan_no + '\')">🖨️ Print Batch</button>';
    var batchNo = item.dispatch_batch_no;
    if (!batchNo) {
      var d = (BWMS.dispatches || []).find(function(dsp) { return dsp.company_challan_no === item.challan_no; });
      if (d) batchNo = d.dispatch_batch_no;
    }
    if (batchNo) {
      html += '<button class="btn btn-secondary btn-sm" onclick="openBatchItemsModal(\'' + batchNo + '\')">👁️ Items</button>';
    }
  }
  if (item.ticket_no) {
    html += '<button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + item.ticket_no + '\')">👁️ Timeline</button>';
  }
  html += '</div>';
  return html;
}

function formatDate(dStr) {
  if (!dStr) return '-';
  try {
    var d = new Date(dStr);
    if (isNaN(d.getTime())) return dStr;
    var day = String(d.getDate()).padStart(2, '0');
    var mon = String(d.getMonth() + 1).padStart(2, '0');
    var yr = d.getFullYear();
    return day + '/' + mon + '/' + yr;
  } catch (e) {
    return dStr;
  }
}

// ─── MODAL CONTROLS & TOAST ───────────────────────────────────────────────────

function openModal(id) {
  var el = document.getElementById(id);
  if (el) {
    el.classList.add('active');
    el.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
}

function closeModal(id) {
  var el = document.getElementById(id);
  if (el) {
    el.classList.remove('active');
    el.classList.remove('open');
    document.body.style.overflow = '';
  }
}

function closeAllModals() {
  document.querySelectorAll('.modal, .modal-overlay').forEach(function(m) {
    m.classList.remove('active');
    m.classList.remove('open');
  });
  closeFastSearchModal();
  document.body.style.overflow = '';
}

window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' || e.key === 'Esc') {
    closeAllModals();
  }
});

function showToast(msg, type) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  var msgEl = document.getElementById('toast-message');
  var iconEl = document.getElementById('toast-icon');

  if (msgEl) msgEl.textContent = msg;
  toast.className = 'toast show ' + (type || '');

  if (type === 'success') {
    if (iconEl) iconEl.textContent = '✅';
  } else if (type === 'error') {
    if (iconEl) iconEl.textContent = '❌';
  } else if (type === 'warning') {
    if (iconEl) iconEl.textContent = '⚠️';
  } else {
    if (iconEl) iconEl.textContent = 'ℹ️';
  }

  setTimeout(function() {
    toast.classList.remove('show');
  }, 4000);
}

// ─── UNIVERSAL RPC RUNNER (APPS SCRIPT & GITHUB PAGES) ───────────────────────

var PROD_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8veuql4nvWujUKPskLUGKFB7l0DnPTlyMbkdh6OgPfJkJlI1IUNovRYyKMEHRPm1j/exec";

function callServer(funcName, args, onSuccess, onError) {
  args = args || [];

  // 1. If running inside Google Apps Script iframe environment:
  if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run[funcName] === 'function') {
    var runner = google.script.run
      .withSuccessHandler(function(response) {
        if (onSuccess) onSuccess(response);
      })
      .withFailureHandler(function(error) {
        var errMsg = (error && error.message) ? error.message : String(error);
        if (onError) onError(errMsg);
        else showToast('Server Error: ' + errMsg, 'error');
      });
    runner[funcName].apply(runner, args);
    return;
  }

  // 2. If running on GitHub Pages or standalone browser — use HTTP fetch to Apps Script Web App
  var url = PROD_WEB_APP_URL;
  var payload = {
    action: funcName,
    args: args
  };

  fetch(url, {
    method: 'POST',
    mode: 'cors',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  })
  .then(function(res) {
    if (!res.ok) {
      throw new Error('HTTP ' + res.status + ': ' + res.statusText);
    }
    return res.json();
  })
  .then(function(json) {
    if (onSuccess) onSuccess(json);
  })
  .catch(function(err) {
    // If POST fails (e.g. strict network filter), try GET fallback
    var getUrl = url + '?action=' + encodeURIComponent(funcName) + '&args=' + encodeURIComponent(JSON.stringify(args));
    fetch(getUrl, { mode: 'cors', redirect: 'follow' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (onSuccess) onSuccess(data);
      })
      .catch(function(getErr) {
        console.error('Remote API Error in [' + funcName + ']:', getErr);
        var msg = (getErr && getErr.message) ? getErr.message : String(getErr);
        if (onError) onError(msg);
        else showToast('Backend error: ' + msg, 'error');
      });
  });
}
