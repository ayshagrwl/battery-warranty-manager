<script>
/**
 * Battery Warranty & Claim Management System — Client Script
 * Ultra-Responsive Single-Page Architecture with In-Memory Bulk State Cache,
 * Real-time Instant Filtering, Multi-Tab Views, and Background Sync.
 */

// ─── GLOBAL IN-MEMORY STORE ──────────────────────────────────────────────────
window.BWMS = {
  config: {},
  models: [],
  dealers: [],
  currentUser: { email: 'staff@distributor.in', name: 'Staff Operator', role: 'OPERATOR' },
  tickets: [],
  claims: [],
  tests: [],
  challans: [],
  dispatches: [],
  dispatchItems: [],
  stockUpdates: [],
  auditLog: [],
  dashboard: {},
  reports: {},
  selectedDispatchClaims: new Set(),
  activeView: 'dashboard',
  labTab: 'queue',
  dispatchTab: 'queue',
  repTab: 'pending',
  stockTab: 'pending',
  challansTab: 'all',
  settingsTab: 'profile',
  isSyncing: false,
  lastSyncedAt: null
};

var CACHE_KEY = 'BWMS_STATE_CACHE_V2';

// ─── INITIALIZATION ──────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

function initApp() {
  // Set default dates across all form inputs
  var today = new Date().toISOString().split('T')[0];
  var dateInputs = ['intake-date', 'test-date', 'claim-dos', 'ret-date', 'dsp-date', 'rep-date', 'close-del-date'];
  dateInputs.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = today;
  });

  // Setup click outside listener for search suggestions dropdown
  document.addEventListener('click', function(e) {
    var searchBox = document.querySelector('.search-wrapper');
    var dropdown = document.getElementById('search-suggestions-dropdown');
    if (dropdown && searchBox && !searchBox.contains(e.target)) {
      dropdown.style.display = 'none';
    }
  });

  // 1. Instant Cold Start from local cache (0ms perceived latency!)
  loadCachedState();

  // 2. Fetch fresh bulk database state in the background
  syncAllData(false);
}

function loadCachedState() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      var cached = JSON.parse(raw);
      if (cached && cached.tables) {
        applyStateData(cached);
        updateSyncStatusBadge('Cached (Offline Ready)', 'cached');
        console.log('⚡ Loaded complete database state from instant local cache.');
      }
    }
  } catch (err) {
    console.warn('Cache read warning:', err);
  }
}

function syncAllData(isManual) {
  if (BWMS.isSyncing) return;
  BWMS.isSyncing = true;
  updateSyncStatusBadge('Syncing cloud...', 'syncing');

  callServer('apiGetBulkState', [], function(res) {
    BWMS.isSyncing = false;
    if (res && res.success && res.data) {
      applyStateData(res.data);
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(res.data));
      } catch (storageErr) {
        console.warn('Failed to cache state to localStorage:', storageErr);
      }
      BWMS.lastSyncedAt = new Date();
      updateSyncStatusBadge('Synced just now', 'online');

      if (isManual) {
        var totalRecords = (BWMS.tickets.length + BWMS.claims.length + BWMS.tests.length);
        showToast('✅ Cloud Sync Complete: ' + totalRecords + ' records updated in memory.', 'success');
      }
    } else {
      updateSyncStatusBadge('Cloud offline', 'offline');
      if (isManual) {
        showToast('Sync warning: ' + ((res && res.error) ? res.error : 'Network error'), 'warning');
      }
    }
  }, function(err) {
    BWMS.isSyncing = false;
    updateSyncStatusBadge('Cloud offline', 'offline');
    console.warn('Bulk sync error:', err);
    if (isManual) {
      showToast('Backend connection error: ' + err, 'error');
    }
  });
}

function applyStateData(data) {
  var t = data.tables || {};
  BWMS.config = data.config || t.Config || BWMS.config;
  BWMS.models = data.models || t.Battery_Models || BWMS.models;
  BWMS.dealers = data.dealers || t.Dealers || BWMS.dealers;
  BWMS.tickets = data.tickets || t.Tickets || [];
  BWMS.claims = data.claims || t.Claims || [];
  BWMS.tests = data.tests || t.Battery_Tests || [];
  BWMS.challans = data.challans || t.Delivery_Challans || [];
  BWMS.dispatches = data.dispatches || t.Company_Dispatches || [];
  BWMS.dispatchItems = data.dispatchItems || t.Company_Dispatch_Items || [];
  BWMS.stockUpdates = data.stockUpdates || t.Stock_Update_Log || [];
  BWMS.auditLog = data.auditLog || t.Audit_Log || [];
  BWMS.currentUser = data.currentUser || BWMS.currentUser;
  BWMS.dashboard = data.dashboard || {};
  BWMS.reports = data.reports || {};

  // Update User Profile Badge
  var userEl = document.getElementById('current-user-name');
  var avatarEl = document.getElementById('current-user-avatar');
  if (userEl) userEl.textContent = BWMS.currentUser.name || BWMS.currentUser.email || 'Staff Operator';
  if (avatarEl) {
    var initials = (BWMS.currentUser.name || 'OP').substring(0, 2).toUpperCase();
    avatarEl.textContent = initials;
  }

  // Populate Dropdowns
  populateDropdowns();

  // Update Settings Form fields
  populateSettingsForm();

  // Re-render currently active view
  renderCurrentView();
}

function updateSyncStatusBadge(text, state) {
  var badge = document.getElementById('sync-status-badge');
  var dot = document.getElementById('sync-dot');
  var label = document.getElementById('sync-status-text');
  var refreshIcon = document.getElementById('sync-refresh-icon');

  if (label) label.textContent = text;
  if (dot) {
    dot.className = 'sync-dot';
    if (state === 'syncing') dot.classList.add('syncing');
    else if (state === 'offline') dot.classList.add('offline');
  }
  if (refreshIcon) {
    if (state === 'syncing') refreshIcon.classList.add('spin');
    else refreshIcon.classList.remove('spin');
  }
  if (badge) {
    badge.title = 'In-Memory fast store: ' + (BWMS.tickets.length || 0) + ' tickets, ' + (BWMS.claims.length || 0) + ' claims. Click to sync with Google Cloud.';
  }

  // Update cloud settings info tab
  var storeStats = document.getElementById('cloud-store-stats');
  if (storeStats) {
    storeStats.textContent = 'Active • ' + (BWMS.tickets.length + BWMS.claims.length + BWMS.tests.length) + ' items in memory';
  }
}

function populateDropdowns() {
  // Model Selects
  var modelSelects = ['intake-model', 'filter-tickets-model', 'filter-claims-model'];
  modelSelects.forEach(function(selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    var currentVal = sel.value;
    var defaultText = selId.startsWith('filter') ? 'All Battery Models' : '-- Select Battery Model --';
    sel.innerHTML = '<option value="' + (selId.startsWith('filter') ? 'ALL' : '') + '">' + defaultText + '</option>';
    BWMS.models.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m.model_name || m.model_code;
      opt.textContent = (m.model_name || m.model_code) + ' (' + (m.warranty_months || m.warranty_period_months || 24) + 'M)';
      sel.appendChild(opt);
    });
    if (currentVal) sel.value = currentVal;
  });

  // Dealer Selects
  var dealerSelects = ['intake-dealer-name'];
  dealerSelects.forEach(function(selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    var currentVal = sel.value;
    sel.innerHTML = '<option value="">-- Select Dealer --</option>';
    BWMS.dealers.forEach(function(d) {
      var opt = document.createElement('option');
      opt.value = d.dealer_name;
      opt.textContent = d.dealer_name + (d.city ? ' (' + d.city + ')' : '');
      sel.appendChild(opt);
    });
    if (currentVal) sel.value = currentVal;
  });
}

function populateSettingsForm() {
  if (BWMS.config.COMPANY_NAME) document.getElementById('cfg-company-name').value = BWMS.config.COMPANY_NAME;
  if (BWMS.config.COMPANY_GST) document.getElementById('cfg-company-gst').value = BWMS.config.COMPANY_GST;
  if (BWMS.config.COMPANY_ADDRESS) document.getElementById('cfg-company-address').value = BWMS.config.COMPANY_ADDRESS;
  if (BWMS.config.COMPANY_PHONE) document.getElementById('cfg-company-phone').value = BWMS.config.COMPANY_PHONE;
  if (BWMS.config.COMPANY_EMAIL) document.getElementById('cfg-company-email').value = BWMS.config.COMPANY_EMAIL;
  if (BWMS.config.COMPANY_TERMS) {
    var termsEl = document.getElementById('cfg-company-terms');
    if (termsEl) termsEl.value = BWMS.config.COMPANY_TERMS;
  }
}

// ─── INSTANT NAVIGATION & ROUTING ─────────────────────────────────────────────

function navigateTo(viewName, params) {
  BWMS.activeView = viewName;
  var views = document.querySelectorAll('.app-view');
  views.forEach(function(v) { v.style.display = 'none'; });

  var targetView = document.getElementById('view-' + viewName);
  if (targetView) targetView.style.display = 'block';

  var navItems = document.querySelectorAll('.sidebar-nav .nav-item');
  navItems.forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-view') === viewName) {
      item.classList.add('active');
    }
  });

  // Close mobile sidebar if open
  var sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }

  // Render view instantly from local memory
  renderCurrentView(params);
}

function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.classList.toggle('open');
}

function renderCurrentView(params) {
  var v = BWMS.activeView;
  if (v === 'dashboard') renderDashboard();
  else if (v === 'tickets') renderTicketsTable();
  else if (v === 'lab') renderLabTables();
  else if (v === 'claims') renderClaimsTable();
  else if (v === 'pending-company') renderDispatchTables();
  else if (v === 'replacement-pending') renderReplacementsTables();
  else if (v === 'stock-tasks') renderStockTasksTables();
  else if (v === 'challans') renderChallansTable();
  else if (v === 'reports') renderReportsView();
  else if (v === 'audit') renderAuditTable();
  else if (v === 'settings') renderSettingsView();
}

// ─── DASHBOARD VIEW RENDERER ──────────────────────────────────────────────────

function renderDashboard() {
  var tickets = BWMS.tickets || [];
  var claims = BWMS.claims || [];

  // Calculate live counts
  var underTesting = tickets.filter(function(t) { return t.status === 'RECEIVED' || t.status === 'TESTING'; }).length;
  var readyForCompany = claims.filter(function(c) { return c.status === 'CLAIM_CREATED' || c.status === 'READY_FOR_COMPANY'; }).length;
  var sentToCompany = claims.filter(function(c) { return c.status === 'SENT_TO_COMPANY'; }).length;
  var rejectedReturnPending = tickets.filter(function(t) { return t.status === 'REJECTED — RETURN PENDING'; }).length;
  var stockTasksPending = claims.filter(function(c) { return c.status === 'REPLACEMENT_RECEIVED' && c.stock_status !== 'UPDATED'; }).length;

  // Ageing > 15 days
  var overdue15Count = claims.filter(function(c) {
    if (c.status !== 'SENT_TO_COMPANY') return false;
    var d = calcDaysElapsed(c.company_dispatch_date);
    return d > 15;
  }).length;

  // KPI Elements
  setElText('kpi-total-tickets', tickets.length);
  setElText('kpi-pending-tests', underTesting);
  setElText('kpi-pending-company', readyForCompany);
  setElText('kpi-replacement-due', sentToCompany);
  setElText('kpi-stock-tasks', stockTasksPending);

  // Sidebar Badges
  setElText('badge-tickets', tickets.length);
  setElText('badge-lab', underTesting);
  setElText('badge-claims', claims.length);
  setElText('badge-pending-company', readyForCompany);
  setElText('badge-replacement-due', sentToCompany);
  setElText('badge-stock-tasks', stockTasksPending);

  // Attention Counts
  setElText('att-lab-count', underTesting);
  setElText('att-return-count', rejectedReturnPending);
  setElText('att-dispatch-count', readyForCompany);
  setElText('att-ageing-count', overdue15Count);
  setElText('att-stock-count', stockTasksPending);

  // Recent Tickets Feed (newest 12)
  var tbody = document.getElementById('dashboard-recent-tickets');
  if (!tbody) return;
  tbody.innerHTML = '';
  var recents = tickets.slice().reverse().slice(0, 12);

  if (recents.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:15px; color:#94a3b8;">No intake tickets recorded yet. Click "+ Receive Battery" to begin.</td></tr>';
    return;
  }

  recents.forEach(function(t) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + t.ticket_no + '\')">' + t.ticket_no + '</strong></td>' +
      '<td>' + renderSourceBadge(t.source_type) + '</td>' +
      '<td><strong>' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + '</small></td>' +
      '<td>' + t.battery_model + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
      '<td>' + formatDate(t.date_received) + '</td>' +
      '<td>' + renderStatusBadge(t.status) + '</td>' +
      '<td>' + renderTicketActions(t) + '</td>';
    tbody.appendChild(tr);
  });
}

// ─── TICKETS (RECEIVE BATTERY) RENDERER ────────────────────────────────────────

function renderTicketsTable() {
  var search = (document.getElementById('filter-tickets-search') ? document.getElementById('filter-tickets-search').value : '').toLowerCase().trim();
  var statusFilter = document.getElementById('filter-tickets-status') ? document.getElementById('filter-tickets-status').value : 'ALL';
  var sourceFilter = document.getElementById('filter-tickets-source') ? document.getElementById('filter-tickets-source').value : 'ALL';
  var modelFilter = document.getElementById('filter-tickets-model') ? document.getElementById('filter-tickets-model').value : 'ALL';

  var tickets = BWMS.tickets || [];
  var filtered = tickets.filter(function(t) {
    if (statusFilter !== 'ALL' && t.status !== statusFilter) return false;
    if (sourceFilter !== 'ALL' && t.source_type !== sourceFilter) return false;
    if (modelFilter !== 'ALL' && t.battery_model !== modelFilter) return false;
    if (search) {
      var blob = [
        t.ticket_no,
        t.customer_name,
        t.dealer_name,
        t.mobile,
        t.vehicle_number,
        t.battery_model,
        t.original_serial_no,
        t.remarks
      ].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  // Update counter badge
  var countBadge = document.getElementById('tickets-count-badge');
  if (countBadge) countBadge.textContent = filtered.length + ' of ' + tickets.length + ' records';

  var tbody = document.getElementById('tickets-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No matching intake tickets found.</td></tr>';
    return;
  }

  // Reverse to show latest first
  filtered.slice().reverse().forEach(function(t) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + t.ticket_no + '\')">' + t.ticket_no + '</strong></td>' +
      '<td>' + renderSourceBadge(t.source_type) + '</td>' +
      '<td><strong>' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + (t.vehicle_number ? ' • ' + t.vehicle_number : '') + '</small></td>' +
      '<td>' + t.battery_model + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
      '<td>' + formatDate(t.date_received) + '</td>' +
      '<td>' + (t.service_battery_issued ? '<span class="badge badge-blue">Lent: ' + (t.service_battery_serial || 'Yes') + '</span>' : '<span style="color:#94a3b8;">None</span>') + '</td>' +
      '<td>' + renderStatusBadge(t.status) + '</td>' +
      '<td>' + renderTicketActions(t) + '</td>';
    tbody.appendChild(tr);
  });
}

function openIntakeModal() {
  document.getElementById('form-intake').reset();
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('intake-date').value = today;
  toggleSourceFields();
  toggleServiceBatteryFields();
  openModal('modal-intake');
}

function toggleSourceFields() {
  var src = document.getElementById('intake-source').value;
  var dGroup = document.getElementById('group-dealer');
  if (dGroup) dGroup.style.display = (src === 'DEALER') ? 'block' : 'none';
}

function toggleServiceBatteryFields() {
  var val = document.getElementById('intake-service-issued').value;
  var show = (val === 'YES');
  var mGroup = document.getElementById('group-sb-model');
  var sGroup = document.getElementById('group-sb-serial');
  if (mGroup) mGroup.style.display = show ? 'block' : 'none';
  if (sGroup) sGroup.style.display = show ? 'block' : 'none';
}

function handleIntakeSubmit(e) {
  e.preventDefault();
  var ticketData = {
    source_type: document.getElementById('intake-source').value,
    dealer_name: document.getElementById('intake-dealer-name').value,
    customer_name: document.getElementById('intake-customer-name').value,
    mobile: document.getElementById('intake-mobile').value,
    address: document.getElementById('intake-address').value,
    vehicle_number: document.getElementById('intake-vehicle').value,
    battery_model: document.getElementById('intake-model').value,
    original_serial_no: document.getElementById('intake-serial').value.trim(),
    date_received: document.getElementById('intake-date').value,
    service_battery_issued: document.getElementById('intake-service-issued').value === 'YES',
    service_battery_model: document.getElementById('intake-sb-model').value,
    service_battery_serial: document.getElementById('intake-sb-serial').value,
    remarks: document.getElementById('intake-remarks').value
  };

  closeModal('modal-intake');

  // Optimistic local update
  var tempTicketNo = 'TKT-TEMP-' + Math.floor(Math.random() * 9000 + 1000);
  var optimisticTicket = Object.assign({}, ticketData, {
    ticket_no: tempTicketNo,
    status: 'RECEIVED',
    created_at: new Date().toISOString().split('T')[0]
  });
  BWMS.tickets.push(optimisticTicket);
  renderTicketsTable();
  renderDashboard();
  showToast('Creating ticket in cloud...', 'info');

  callServer('apiCreateTicket', [ticketData], function(res) {
    if (res && res.success) {
      showToast(res.message || 'Ticket generated successfully!', 'success');
      syncAllData(false);

      if (confirm('Intake ticket ' + res.data.ticket_no + ' generated! Would you like to conduct the Diagnostic Bench Test now?')) {
        openTestModal(res.data.ticket_no, res.data.battery_model, res.data.original_serial_no);
      }
    } else {
      showToast((res && res.error) ? res.error : 'Failed to create ticket', 'error');
      syncAllData(false);
    }
  });
}

// ─── TESTING LAB VIEW RENDERER ────────────────────────────────────────────────

function switchLabTab(tab) {
  BWMS.labTab = tab;
  var btnQueue = document.getElementById('tab-btn-lab-queue');
  var btnHistory = document.getElementById('tab-btn-lab-history');
  var containerQueue = document.getElementById('container-lab-queue');
  var containerHistory = document.getElementById('container-lab-history');

  if (btnQueue) btnQueue.classList.toggle('active', tab === 'queue');
  if (btnHistory) btnHistory.classList.toggle('active', tab === 'history');
  if (containerQueue) containerQueue.style.display = (tab === 'queue') ? 'block' : 'none';
  if (containerHistory) containerHistory.style.display = (tab === 'history') ? 'block' : 'none';

  renderLabTables();
}

function renderLabTables() {
  var search = (document.getElementById('filter-lab-search') ? document.getElementById('filter-lab-search').value : '').toLowerCase().trim();
  var verdictFilter = document.getElementById('filter-lab-verdict') ? document.getElementById('filter-lab-verdict').value : 'ALL';

  var queueItems = (BWMS.tickets || []).filter(function(t) {
    return t.status === 'RECEIVED' || t.status === 'TESTING';
  });

  setElText('lab-queue-tab-count', queueItems.length);
  setElText('lab-history-tab-count', (BWMS.tests || []).length);

  // Render Queue Table
  var tbodyQueue = document.getElementById('lab-queue-body');
  if (tbodyQueue) {
    tbodyQueue.innerHTML = '';
    var filteredQueue = queueItems.filter(function(t) {
      if (!search) return true;
      var blob = [t.ticket_no, t.customer_name, t.dealer_name, t.battery_model, t.original_serial_no, t.remarks].join(' ').toLowerCase();
      return blob.indexOf(search) !== -1;
    });

    if (filteredQueue.length === 0) {
      tbodyQueue.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:25px; color:#16a34a;">🎉 Testing lab queue is clear! All batteries tested.</td></tr>';
    } else {
      filteredQueue.forEach(function(t) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + t.ticket_no + '</strong></td>' +
          '<td><strong>' + (t.customer_name || t.dealer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + '</small></td>' +
          '<td>' + t.battery_model + '</td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
          '<td>' + formatDate(t.date_received) + '</td>' +
          '<td>' + (t.remarks || 'No symptoms noted') + '</td>' +
          '<td><button class="btn btn-primary btn-sm" onclick="openTestModal(\'' + t.ticket_no + '\', \'' + t.battery_model + '\', \'' + t.original_serial_no + '\')">🔬 Conduct Test</button></td>';
        tbodyQueue.appendChild(tr);
      });
    }
  }

  // Render Completed History Table
  var tbodyHistory = document.getElementById('lab-history-body');
  if (tbodyHistory) {
    tbodyHistory.innerHTML = '';
    var tests = BWMS.tests || [];
    var filteredHistory = tests.filter(function(tst) {
      if (verdictFilter !== 'ALL' && tst.test_result !== verdictFilter) return false;
      if (search) {
        var blob = [tst.test_id, tst.ticket_no, tst.original_serial_no, tst.tested_by, tst.test_remarks].join(' ').toLowerCase();
        if (blob.indexOf(search) === -1) return false;
      }
      return true;
    });

    if (filteredHistory.length === 0) {
      tbodyHistory.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No completed diagnostic tests found.</td></tr>';
    } else {
      filteredHistory.slice().reverse().forEach(function(tst) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent);">' + (tst.test_id || 'TST-') + '</strong></td>' +
          '<td><small onclick="showTimeline(\'' + tst.ticket_no + '\')" style="cursor:pointer; color:var(--text-muted);">' + tst.ticket_no + '</small></td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + tst.original_serial_no + '</span></td>' +
          '<td>' + formatDate(tst.test_date) + '</td>' +
          '<td><strong>' + (tst.open_circuit_voltage ? tst.open_circuit_voltage + 'V' : '-') + '</strong></td>' +
          '<td>' + renderTestVerdictBadge(tst.test_result) + '</td>' +
          '<td>' + (tst.tested_by || '-') + '</td>' +
          '<td><small>' + (tst.test_remarks || '-') + '</small></td>' +
          '<td><button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + tst.ticket_no + '\')">Timeline</button></td>';
        tbodyHistory.appendChild(tr);
      });
    }
  }
}

function openTestModal(ticketNo, model, serial) {
  document.getElementById('form-test').reset();
  document.getElementById('test-ticket-no').value = ticketNo;
  document.getElementById('test-view-ticket').textContent = ticketNo;
  document.getElementById('test-view-model').textContent = model || '';
  document.getElementById('test-view-serial').textContent = serial || '';
  document.getElementById('test-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('test-tested-by').value = BWMS.currentUser.name || 'Technician';

function calculateClaimWarranty() {
  var model = document.getElementById('claim-view-model').textContent;
  var dos = document.getElementById('claim-dos').value;
  if (!model || !dos) return;

  var m = (BWMS.models || []).find(function(item) {
    return (item.model_name === model || item.model_code === model);
  });

  var totalMonths = m ? (parseInt(m.warranty_months, 10) || 24) : 24;
  var guaranteeMonths = m ? (parseInt(m.guarantee_months, 10) || 12) : 12;

  var saleDate = new Date(dos);
  var now = new Date();
  var diffMonths = (now.getFullYear() - saleDate.getFullYear()) * 12 + (now.getMonth() - saleDate.getMonth());

  var box = document.getElementById('claim-calc-box');
  if (diffMonths <= guaranteeMonths) {
    box.innerHTML = '<span style="color:#16a34a;">✅ FULL GUARANTEE (100% Free Replacement)</span> (' + (guaranteeMonths - diffMonths) + ' mos guarantee left)';
  } else if (diffMonths <= totalMonths) {
    var proMonths = totalMonths - guaranteeMonths;
    var used = diffMonths - guaranteeMonths;
    var disc = Math.max(0, Math.round(100 - (used / proMonths) * 100));
    box.innerHTML = '<span style="color:#0284c7;">⚖️ PRO-RATA WARRANTY (' + disc + '% Discount)</span>';
  } else {
    box.innerHTML = '<span style="color:#dc2626;">❌ OUT OF WARRANTY (Expired ' + (diffMonths - totalMonths) + ' mos ago)</span>';
  }
}

function renderChallansTable() {

  var list = [];

  // Return Challans
  (BWMS.tickets || []).forEach(function(t) {

      list.push({

        date: t.updated_at || t.date_received,
        recipient: (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name),
        serials: t.original_serial_no,
        status: t.status,
        ticket_no: t.ticket_no
      });
    }
  });

  // Company Dispatches
  (BWMS.dispatches || []).forEach(function(d) {
    list.push({
      challan_no: d.company_challan_no || ('DC-COM-' + d.dispatch_batch_no),
      type: 'COMPANY_DISPATCH',

      var blob = [item.challan_no, item.recipient, item.serials, item.status].join(' ').toLowerCase();

function renderReportsView() {
  var claims = BWMS.claims || [];
  var tickets = BWMS.tickets || [];

  // Ageing Distribution
  var a07 = 0, a815 = 0, a1630 = 0, a3160 = 0, a60p = 0;
  claims.forEach(function(c) {
    if (c.status === 'SENT_TO_COMPANY') {
      var d = calcDaysElapsed(c.company_dispatch_date);
      if (d <= 7) a07++;
      else if (d <= 15) a815++;
      else if (d <= 30) a1630++;
      else if (d <= 60) a3160++;
      else a60p++;
    }
  });

  setElText('rep-ageing-0-7', a07);
  setElText('rep-ageing-8-15', a815);
  setElText('rep-ageing-16-30', a1630);
  setElText('rep-ageing-31-60', a3160);
  setElText('rep-ageing-60-plus', a60p);

  // Model Breakdown Table
  var modelMap = {};
  BWMS.models.forEach(function(m) {
    var key = m.model_name || m.model_code;
    modelMap[key] = {
      code: m.model_code || key,
      name: m.model_name || key,
      warranty: (m.warranty_months || 24),
      received: 0,
      passed: 0,
      rejected: 0
    };
  });

  tickets.forEach(function(t) {
    var key = t.battery_model || 'Unknown';
    if (!modelMap[key]) {
      modelMap[key] = { code: key, name: key, warranty: 24, received: 0, passed: 0, rejected: 0 };
    }
    modelMap[key].received++;
    if (t.status === 'TEST_PASSED' || t.status === 'CLAIM_CREATED') modelMap[key].passed++;
    else if (t.status === 'TEST_REJECTED' || t.status.indexOf('REJECTED') !== -1) modelMap[key].rejected++;
  });

  var tbodyModels = document.getElementById('reports-models-body');
  if (tbodyModels) {
    tbodyModels.innerHTML = '';
    var modelKeys = Object.keys(modelMap);
    if (modelKeys.length === 0) {
      tbodyModels.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:15px; color:#94a3b8;">No model performance data available.</td></tr>';
    } else {
      modelKeys.forEach(function(k) {
        var m = modelMap[k];
        var rate = (m.received > 0) ? Math.round((m.rejected / m.received) * 100) : 0;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + m.code + '</strong></td>' +
          '<td>' + m.name + '</td>' +
          '<td>' + m.warranty + ' Months</td>' +
          '<td><strong>' + m.received + '</strong></td>' +
          '<td><span style="color:#16a34a; font-weight:bold;">' + m.passed + '</span></td>' +
          '<td><span style="color:#dc2626; font-weight:bold;">' + m.rejected + '</span></td>' +
          '<td>' + rate + '%</td>';
        tbodyModels.appendChild(tr);
      });
    }
  }

  // Dealer Breakdown Table
  var dealerMap = {};
  BWMS.dealers.forEach(function(d) {
    dealerMap[d.dealer_name] = { name: d.dealer_name, total: 0, pending: 0, closed: 0 };
  });

  claims.forEach(function(c) {
    if (c.dealer_name) {
      if (!dealerMap[c.dealer_name]) {
        dealerMap[c.dealer_name] = { name: c.dealer_name, total: 0, pending: 0, closed: 0 };
      }
      dealerMap[c.dealer_name].total++;
      if (c.status === 'SENT_TO_COMPANY') dealerMap[c.dealer_name].pending++;
      if (c.status === 'CLAIM_CLOSED') dealerMap[c.dealer_name].closed++;
    }
  });

  var tbodyDealers = document.getElementById('reports-dealers-body');
  if (tbodyDealers) {
    tbodyDealers.innerHTML = '';
    var dKeys = Object.keys(dealerMap);
    if (dKeys.length === 0) {
      tbodyDealers.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#94a3b8;">No dealer warranty records found.</td></tr>';
    } else {
      dKeys.forEach(function(dk) {
        var d = dealerMap[dk];
        var resRate = (d.total > 0) ? Math.round((d.closed / d.total) * 100) : 0;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + d.name + '</strong></td>' +
          '<td><strong>' + d.total + '</strong></td>' +
          '<td><span class="badge badge-amber">' + d.pending + '</span></td>' +
          '<td><span class="badge badge-green">' + d.closed + '</span></td>' +
          '<td>' + resRate + '%</td>';
        tbodyDealers.appendChild(tr);
      });
    }
  }
}

function handleUniversalSearchInput(val) {
  val = (val || '').trim();
  var dropdown = document.getElementById('search-suggestions-dropdown');
  if (!dropdown) return;

  if (val.length < 2) {
    dropdown.style.display = 'none';
    return;
  }

  var lower = val.toLowerCase();
  var matches = [];

  // Search Tickets
  (BWMS.tickets || []).forEach(function(t) {
    if (t.original_serial_no && t.original_serial_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'SERIAL', title: 'Serial: ' + t.original_serial_no, sub: t.ticket_no + ' • ' + (t.customer_name || t.dealer_name), id: t.original_serial_no });
    } else if (t.ticket_no && t.ticket_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'TICKET', title: t.ticket_no, sub: (t.customer_name || t.dealer_name) + ' • ' + t.battery_model, id: t.ticket_no });
    } else if (t.customer_name && t.customer_name.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'CUSTOMER', title: t.customer_name, sub: t.ticket_no + ' • ' + (t.mobile || ''), id: t.ticket_no });
    } else if (t.mobile && t.mobile.indexOf(lower) !== -1) {
      matches.push({ type: 'MOBILE', title: 'Mobile: ' + t.mobile, sub: t.customer_name + ' • ' + t.ticket_no, id: t.ticket_no });
    }
  });

  // Search Claims
  (BWMS.claims || []).forEach(function(c) {
    if (c.claim_no && c.claim_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'CLAIM', title: c.claim_no, sub: c.battery_model + ' • ' + c.original_serial_no, id: c.claim_no });
    } else if (c.replacement_serial_no && c.replacement_serial_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'REP_SERIAL', title: 'Replacement: ' + c.replacement_serial_no, sub: c.claim_no + ' • ' + c.battery_model, id: c.claim_no });
    }
  });

  if (matches.length === 0) {
    dropdown.innerHTML = '<div style="padding:12px; text-align:center; color:#94a3b8; font-size:12px;">No matching records found. Press Enter to full search.</div>';
    dropdown.style.display = 'block';
    return;
  }

  // Deduplicate and take top 8
  var unique = [];
  var seen = new Set();
  matches.forEach(function(m) {
    var key = m.type + ':' + m.id;
    if (!seen.has(key) && unique.length < 8) {
      seen.add(key);
      unique.push(m);
    }
  });

  dropdown.innerHTML = '';
  unique.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'search-dropdown-item';
    div.innerHTML =
      '<div>' +
      '  <div style="font-weight:600; font-size:13px;">' + m.title + '</div>' +
      '  <div style="font-size:11px; color:#64748b;">' + m.sub + '</div>' +
      '</div>' +
      '<div><span class="badge badge-gray">' + m.type + '</span></div>';
    div.onclick = function() {
      dropdown.style.display = 'none';
      showTimeline(m.id);
    };
    dropdown.appendChild(div);
  });

  dropdown.style.display = 'block';
}

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    var dropdown = document.getElementById('search-suggestions-dropdown');
    if (dropdown) dropdown.style.display = 'none';
    var val = document.getElementById('global-search-input').value.trim();
    if (val) showTimeline(val);
  }
}

function showTimeline(query) {
  if (!query) return;

  // Search local in-memory store for instant zero-latency timeline rendering
  var lower = query.toLowerCase().trim();
  var matchedTicket = (BWMS.tickets || []).find(function(t) {
    return t.ticket_no.toLowerCase() === lower || (t.original_serial_no && t.original_serial_no.toLowerCase() === lower);
  });

  var matchedClaim = (BWMS.claims || []).find(function(c) {
    return c.claim_no.toLowerCase() === lower || (c.ticket_no && c.ticket_no.toLowerCase() === lower) || (c.original_serial_no && c.original_serial_no.toLowerCase() === lower);
  });

  var metaBox = document.getElementById('timeline-meta-box');
  var nodesList = document.getElementById('timeline-nodes-list');

  var primary = matchedClaim || matchedTicket || { ticket_no: query };
  metaBox.innerHTML =
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
    '  <div><h3 style="font-size:16px; margin-bottom:4px;">Lifecycle Report for: <span style="color:var(--accent);">' + query + '</span></h3>' +
    '  <span style="color:#64748b; font-size:12px;">Matched: ' + (primary.battery_model || '-') + ' • Serial: <strong>' + (primary.original_serial_no || '-') + '</strong></span></div>' +
    '  <div>' + renderStatusBadge(primary.status || 'FOUND') + '</div>' +
    '</div>';

  nodesList.innerHTML = '<div class="timeline-line"></div>';

  // Construct events locally
  var events = [];
  if (matchedTicket) {
    events.push({
      title: 'Battery Received at Service Center',
      date: matchedTicket.date_received,
      details: 'Intake ticket ' + matchedTicket.ticket_no + ' created for party: ' + (matchedTicket.customer_name || matchedTicket.dealer_name) + ' (' + (matchedTicket.mobile || '') + ').'
    });
  }

  // Diagnostic Test
  var tests = (BWMS.tests || []).filter(function(tst) {
    return (matchedTicket && tst.ticket_no === matchedTicket.ticket_no) || (tst.original_serial_no && tst.original_serial_no.toLowerCase() === lower);
  });
  tests.forEach(function(tst) {
    events.push({
      title: 'Diagnostic Test Conducted: ' + tst.test_result,
      date: tst.test_date,
      details: 'Voltage: ' + (tst.open_circuit_voltage || '-') + 'V • Result: ' + tst.test_result + ' • Remarks: ' + (tst.test_remarks || 'N/A')
    });
  });

  // Claim
  if (matchedClaim) {
    events.push({
      title: 'Warranty Claim Generated (' + matchedClaim.claim_no + ')',
      date: matchedClaim.created_at || matchedClaim.claim_date,
      details: 'Warranty classification: ' + (matchedClaim.warranty_status || 'IN_WARRANTY') + ' • Date of Sale: ' + formatDate(matchedClaim.date_of_sale)
    });

    if (matchedClaim.company_dispatch_date) {
      events.push({
        title: 'Dispatched to Battery Manufacturer Factory',
        date: matchedClaim.company_dispatch_date,
        details: 'Batch Challan: ' + (matchedClaim.company_challan_no || matchedClaim.dispatch_batch_no || 'DC-COM')
      });
    }

    if (matchedClaim.replacement_received_date) {
      events.push({
        title: 'Factory Replacement Received',
        date: matchedClaim.replacement_received_date,
        details: 'Replacement Serial: ' + (matchedClaim.replacement_serial_no || '-') + ' • Invoice/CN Ref: ' + (matchedClaim.stock_ref_no || '-')
      });
    }

    if (matchedClaim.stock_status === 'UPDATED') {
      events.push({
        title: 'ERP Accounting Stock Inward Reconciled',
        date: matchedClaim.stock_updated_date || matchedClaim.updated_at,
        details: 'Accounting reference: ' + (matchedClaim.stock_ref_no || 'STK-IN') + ' by ' + (matchedClaim.stock_updated_by || 'Staff')
      });
    }

    if (matchedClaim.status === 'CLAIM_CLOSED') {
      events.push({
        title: 'Claim Closed & Battery Delivered to Customer',
        date: matchedClaim.closed_date || matchedClaim.updated_at,
        details: 'Handover complete. Replacement battery delivered.'
      });
    }
  }

  if (events.length === 0) {
    nodesList.innerHTML += '<p style="padding:20px; text-align:center; color:#94a3b8;">No chronological events recorded for this query.</p>';
  } else {
    events.forEach(function(ev) {
      var node = document.createElement('div');
      node.className = 'timeline-node';
      node.innerHTML =
        '<div class="timeline-dot"></div>' +
        '<div class="timeline-header">' +
        '  <span class="timeline-title">' + ev.title + '</span>' +
        '  <span class="timeline-date">' + (ev.date ? formatDate(ev.date) : '') + '</span>' +
        '</div>' +
        '<div class="timeline-details">' + (ev.details || '') + '</div>';
      nodesList.appendChild(node);
    });
  }

  openModal('modal-timeline');
}

function openUploadDocModal(claimNo) {
  document.getElementById('form-upload').reset();
  document.getElementById('upload-claim-no').value = claimNo;
  openModal('modal-upload');
}

function handleUploadSubmit(e) {
  e.preventDefault();
  var fileInput = document.getElementById('upload-file');
  if (!fileInput.files || fileInput.files.length === 0) {
    showToast('Please select a file to upload.', 'warning');
    return;
  }
  var file = fileInput.files[0];
  var claimNo = document.getElementById('upload-claim-no').value;
  var docType = document.getElementById('upload-doc-type').value;

  var submitBtn = document.getElementById('btn-upload-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Uploading to Drive...';

  var reader = new FileReader();
  reader.onload = function(evt) {
    var base64Data = evt.target.result.split(',')[1];
    var data = {
      claim_no: claimNo,
      document_type: docType,
      file_name: file.name,
      mime_type: file.type || 'application/octet-stream',
      file_base64: base64Data
    };

    callServer('apiUploadDocument', [data], function(res) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Upload to Drive';
      if (res && res.success) {
        closeModal('modal-upload');
        showToast(res.message || 'File saved into claim Drive folder.', 'success');
        syncAllData(false);
      } else {
        showToast((res && res.error) ? res.error : 'Upload failed', 'error');
      }
    });
  };
  reader.onerror = function() {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Upload to Drive';
    showToast('Error reading file for upload.', 'error');
  };
  reader.readAsDataURL(file);
}

function downloadCSV(filename, headers, rows) {
  var csvContent = '\uFEFF';
  csvContent += headers.map(escapeCSVField).join(',') + '\r\n';

  rows.forEach(function(row) {
    var line = row.map(escapeCSVField).join(',');
    csvContent += line + '\r\n';
  });

  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function escapeCSVField(val) {
  if (val === null || val === undefined) return '""';
  var str = String(val).replace(/"/g, '""');
  return '"' + str + '"';
}

function exportReportsCSV() {
  var headers = ['Model Code', 'Model Name', 'Warranty (M)', 'Total Received', 'Passed', 'Rejected', 'Rejection Rate %'];
  var rows = [];
  var modelMap = {};
  (BWMS.tickets || []).forEach(function(t) {
    var k = t.battery_model || 'Unknown';
    if (!modelMap[k]) modelMap[k] = { code: k, name: k, w: 24, recv: 0, p: 0, r: 0 };
    modelMap[k].recv++;
    if (t.status === 'TEST_PASSED' || t.status === 'CLAIM_CREATED') modelMap[k].p++;
    else if (t.status.indexOf('REJECT') !== -1) modelMap[k].r++;
  });
  for (var k in modelMap) {
    var m = modelMap[k];
    var rate = m.recv > 0 ? Math.round((m.r / m.recv) * 100) : 0;
    rows.push([m.code, m.name, m.w, m.recv, m.p, m.r, rate]);
  }
  downloadCSV('model-performance-report-' + getExportDate() + '.csv', headers, rows);

function setElText(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

function calcDaysElapsed(dateStr) {
  if (!dateStr) return 0;
  try {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return 0;
    var now = new Date();
    var diffTime = Math.abs(now - d);
    return Math.floor(diffTime / (1000 * 60 * 60 * 24));
  } catch (e) {
    return 0;
  }
}

function renderSourceBadge(source) {
  if (source === 'DEALER') return '<span class="badge badge-purple">DEALER</span>';
  return '<span class="badge badge-blue">CUSTOMER</span>';
}

function renderStatusBadge(status) {
  if (!status) return '-';
  var s = status.toUpperCase();
  if (s.indexOf('PASS') !== -1 || s.indexOf('CLOSED') !== -1) return '<span class="badge badge-green">' + status + '</span>';
  if (s.indexOf('REJECT') !== -1) return '<span class="badge badge-red">' + status + '</span>';
  if (s.indexOf('PENDING') !== -1 || s.indexOf('RECEIVED') !== -1) return '<span class="badge badge-amber">' + status + '</span>';
  if (s.indexOf('DISPATCH') !== -1 || s.indexOf('COMPANY') !== -1) return '<span class="badge badge-purple">' + status + '</span>';
  return '<span class="badge badge-gray">' + status + '</span>';
}

function renderTestVerdictBadge(verdict) {
  if (verdict === 'PASS') return '<span class="badge badge-green">PASS (Eligible)</span>';
  if (verdict === 'REJECT') return '<span class="badge badge-red">REJECT (Faulty)</span>';
  return '<span class="badge badge-gray">' + (verdict || '-') + '</span>';
}

function renderWarrantyBadge(wStatus) {
  if (wStatus === 'IN_WARRANTY' || wStatus === 'FULL_REPLACEMENT') return '<span class="badge badge-green">IN WARRANTY</span>';
  if (wStatus === 'OUT_OF_WARRANTY' || wStatus === 'EXPIRED') return '<span class="badge badge-red">OUT OF WARRANTY</span>';
  return '<span class="badge badge-amber">' + (wStatus || 'UNKNOWN') + '</span>';
}

function renderAgeingBadge(days) {
  var d = parseInt(days, 10) || 0;
  if (d <= 7) return '<span class="badge badge-green">' + d + ' Days</span>';
  if (d <= 15) return '<span class="badge badge-blue">' + d + ' Days</span>';
  if (d <= 30) return '<span class="badge badge-amber">' + d + ' Days</span>';
  return '<span class="badge badge-red" style="font-weight:bold;">🚨 ' + d + ' Days</span>';
}

    }

  html += '</div>';
  return html;
}

function formatDate(dStr) {
  if (!dStr) return '-';
  try {
    var d = new Date(dStr);
    if (isNaN(d.getTime())) return dStr;
    var day = String(d.getDate()).padStart(2, '0');
    var mon = String(d.getMonth() + 1).padStart(2, '0');
    var yr = d.getFullYear();
    return day + '/' + mon + '/' + yr;
  } catch (e) {
    return dStr;
  }
}

// ─── MODAL CONTROLS & TOAST ───────────────────────────────────────────────────

function openModal(id) {
  var el = document.getElementById(id);
  if (el) {
    el.classList.add('active');
    el.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
}

function closeModal(id) {
  var el = document.getElementById(id);
  if (el) {
    el.classList.remove('active');
    el.classList.remove('open');
    document.body.style.overflow = '';
  }
}

function closeAllModals() {
  document.querySelectorAll('.modal, .modal-overlay').forEach(function(m) {
    m.classList.remove('active');
    m.classList.remove('open');
  });
  document.body.style.overflow = '';
}

window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' || e.key === 'Esc') {
    closeAllModals();
  }
});

function showToast(msg, type) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  var msgEl = document.getElementById('toast-message');
  var iconEl = document.getElementById('toast-icon');

  if (msgEl) msgEl.textContent = msg;
  toast.className = 'toast show ' + (type || '');

  if (type === 'success') {
    if (iconEl) iconEl.textContent = '✅';
  } else if (type === 'error') {
    if (iconEl) iconEl.textContent = '❌';
  } else if (type === 'warning') {
    if (iconEl) iconEl.textContent = '⚠️';
  } else {
    if (iconEl) iconEl.textContent = 'ℹ️';
  }

  setTimeout(function() {
    toast.classList.remove('show');
  }, 4000);
}

// ─── UNIVERSAL RPC RUNNER (APPS SCRIPT & GITHUB PAGES) ───────────────────────

var PROD_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8veuql4nvWujUKPskLUGKFB7l0DnPTlyMbkdh6OgPfJkJlI1IUNovRYyKMEHRPm1j/exec";

function callServer(funcName, args, onSuccess, onError) {
  args = args || [];

  // 1. If running inside Google Apps Script iframe environment:
  if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run[funcName] === 'function') {
    var runner = google.script.run
      .withSuccessHandler(function(response) {
        if (onSuccess) onSuccess(response);
      })
      .withFailureHandler(function(error) {
        var errMsg = (error && error.message) ? error.message : String(error);
        if (onError) onError(errMsg);
        else showToast('Server Error: ' + errMsg, 'error');
      });
    runner[funcName].apply(runner, args);
    return;
  }

  // 2. If running on GitHub Pages or standalone browser — use HTTP fetch to Apps Script Web App
  var url = PROD_WEB_APP_URL;
  var payload = {
    action: funcName,
    args: args
  };

  fetch(url, {
    method: 'POST',
    mode: 'cors',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  })
  .then(function(res) {
    if (!res.ok) {
      throw new Error('HTTP ' + res.status + ': ' + res.statusText);
    }
    return res.json();
  })
  .then(function(json) {
    if (onSuccess) onSuccess(json);
  })
  .catch(function(err) {
    // If POST fails (e.g. strict network filter), try GET fallback
    var getUrl = url + '?action=' + encodeURIComponent(funcName) + '&args=' + encodeURIComponent(JSON.stringify(args));
    fetch(getUrl, { mode: 'cors', redirect: 'follow' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (onSuccess) onSuccess(data);
      })
      .catch(function(getErr) {
        console.error('Remote API Error in [' + funcName + ']:', getErr);
        var msg = (getErr && getErr.message) ? getErr.message : String(getErr);
        if (onError) onError(msg);
        else showToast('Backend error: ' + msg, 'error');
      });
  });
}
