<script>
/**
 * Battery Warranty & Claim Management System — Client Script
 * Ultra-Responsive Single-Page Architecture with In-Memory Bulk State Cache,
 * Real-time Instant Filtering, Multi-Tab Views, and Background Sync.
 */

// ─── GLOBAL IN-MEMORY STORE ──────────────────────────────────────────────────
window.BWMS = {
  config: {},
  models: [],
  dealers: [],
  customers: [],
  currentUser: { email: 'staff@distributor.in', name: 'Staff Operator', role: 'OPERATOR' },
  authUser: null,
  isAuthorizedStaff: false,
  isAdminUser: false,
  staffList: [],
  tickets: [],
  claims: [],
  claimDocuments: [],
  tests: [],
  challans: [],
  dispatches: [],
  dispatchItems: [],
  stockUpdates: [],
  serviceBatteries: [],
  serviceBatteryLogs: [],
  auditLog: [],
  dashboard: {},
  reports: {},
  selectedDispatchClaims: new Set(),
  activeView: 'dashboard',
  labTab: 'queue',
  dispatchTab: 'queue',
  repTab: 'pending',
  stockTab: 'pending',
  challansTab: 'all',
  sbTab: 'pool',
  settingsTab: 'profile',
  firebaseUnsubscribers: [],
  firebaseInitialized: false,
  firestoreSeededCheckDone: false,
  isSyncing: false,
  lastSyncedAt: null
};

var BOOTSTRAP_ADMIN_EMAIL = 'ayushmestorage@gmail.com';
var CACHE_KEY = 'BWMS_STATE_CACHE_V4_FRESH';

// ─── INITIALIZATION & FIREBASE AUTH GATE ─────────────────────────────────────

document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

function showAuthGateState(mode, msg) {
  var overlay = document.getElementById('auth-gate-overlay');
  var loadingBox = document.getElementById('auth-gate-loading');
  var loginBox = document.getElementById('auth-gate-login-box');
  var errorBox = document.getElementById('auth-gate-error-box');
  var errorMsgEl = document.getElementById('auth-gate-error-msg');
  var signOutBtn = document.getElementById('btn-sign-out');

  if (!overlay) return;

  if (mode === 'authenticated') {
    overlay.style.display = 'none';
    if (signOutBtn) signOutBtn.style.display = 'inline-flex';
    return;
  }

  overlay.style.display = 'flex';
  if (signOutBtn) signOutBtn.style.display = (mode === 'auth-error') ? 'inline-flex' : 'none';

  if (loadingBox) loadingBox.style.display = (mode === 'loading') ? 'block' : 'none';
  if (loginBox) loginBox.style.display = (mode === 'login' || mode === 'login-error') ? 'block' : 'none';

  if (errorBox) {
    var showErr = (mode === 'auth-error' || mode === 'login-error');
    errorBox.style.display = showErr ? 'block' : 'none';
    if (errorMsgEl && msg) errorMsgEl.textContent = msg;
    // Show the Sign Out button inside error box only when signed in with unauthorized account
    var innerSignOut = errorBox.querySelector ? errorBox.querySelector('button') : null;
    if (innerSignOut) innerSignOut.style.display = (mode === 'auth-error') ? 'inline-flex' : 'none';
  }
}

function initApp() {
  // Set default dates across all form inputs
  var today = new Date().toISOString().split('T')[0];
  var dateInputs = ['intake-date', 'test-date', 'claim-dos', 'ret-date', 'dsp-date', 'rep-date', 'close-del-date', 'dash-calc-dos', 'claimstab-calc-dos', 'modal-calc-dos', 'modalcalc-dos'];
  dateInputs.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = today;
  });

  // Setup click outside listener for search suggestions dropdown
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('click', function(e) {
      var searchBox = document.querySelector ? document.querySelector('.search-wrapper') : null;
      var dropdown = document.getElementById('search-suggestions-dropdown');
      if (dropdown && searchBox && !searchBox.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });
  }

  // Global keyboard shortcuts (Press '/' or Ctrl+K for fast search, Esc to close)
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeFastSearchModal();
        closeModal('modal-warranty-calc');
        return;
      }
      var tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
      var isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
      if ((e.key === '/' && !isInput) || ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K'))) {
        e.preventDefault();
        openFastSearchModal();
      }
    });
  }

  // Firebase Modular SDK browser startup
  if (typeof window !== 'undefined' && window.FB_CLIENT && window.FB_CLIENT.ready && window.FB_CLIENT.auth) {
    initFirebaseAuth();
    return;
  }

  var isBrowserRuntime = (typeof window !== 'undefined' && window.location && window.location.protocol && window.location.protocol.indexOf('http') === 0 && typeof fetch === 'function' && !window.__BWMS_TEST_MODE__);
  if (isBrowserRuntime) {
    showAuthGateState('loading');
    window.onFirebaseClientReady = function() {
      initFirebaseAuth();
    };
    setTimeout(function() {
      if (!BWMS.firebaseInitialized) {
        if (window.FB_CLIENT && window.FB_CLIENT.ready && window.FB_CLIENT.auth) {
          initFirebaseAuth();
        } else {
          showAuthGateState('login-error', 'Could not load Firebase SDK from CDN. Check internet connection and reload.');
        }
      }
    }, 9000);
    return;
  }

  // Offline / Node.js VM test fallback startup
  showAuthGateState('authenticated');
  loadCachedState();
  syncAllData(false);
}

function initFirebaseAuth() {
  var FB = (typeof window !== 'undefined') ? window.FB_CLIENT : null;
  if (!FB || !FB.auth || BWMS.firebaseInitialized) return;
  BWMS.firebaseInitialized = true;

  showAuthGateState('loading');

  if (typeof FB.getRedirectResult === 'function') {
    FB.getRedirectResult(FB.auth).catch(function(err) {
      if (err && err.message) {
        showAuthGateState('login-error', err.message);
      }
    });
  }

  FB.onAuthStateChanged(FB.auth, async function(user) {
    detachFirestoreListeners();

    if (!user || !user.email) {
      BWMS.authUser = null;
      BWMS.isAuthorizedStaff = false;
      BWMS.isAdminUser = false;
      BWMS.staffList = [];
      showAuthGateState('login');
      updateSyncStatusBadge('Sign in required', 'offline');
      return;
    }

    showAuthGateState('loading');
    var emailLower = String(user.email || '').trim().toLowerCase();
    var isBootstrap = (emailLower === BOOTSTRAP_ADMIN_EMAIL && user.emailVerified === true);

    try {
      var staffRef = FB.doc(FB.db, 'authorized_staff', emailLower);
      var staffSnap = await FB.getDoc(staffRef);
      var staffData = staffSnap.exists() ? staffSnap.data() : null;

      if (isBootstrap && !staffSnap.exists()) {
        var nowIso = new Date().toISOString();
        staffData = {
          email: emailLower,
          name: user.displayName || 'Ayush Admin',
          role: 'ADMIN',
          active: true,
          created_at: nowIso,
          updated_at: nowIso
        };
        try {
          await FB.setDoc(staffRef, staffData);
        } catch (seedStaffErr) {
          console.warn('Bootstrap admin staff doc note:', seedStaffErr);
        }
      }

      var hasActiveStaffDoc = Boolean(staffData && staffData.active === true);
      if (!isBootstrap && !hasActiveStaffDoc) {
        BWMS.authUser = user;
        BWMS.isAuthorizedStaff = false;
        BWMS.isAdminUser = false;
        updateSyncStatusBadge('Access Denied', 'offline');
        showAuthGateState(
          'auth-error',
          'Signed in as "' + emailLower + '", which is not authorized or has been disabled in Staff Access. Ask your Admin (' + BOOTSTRAP_ADMIN_EMAIL + ') to authorize this email, or sign out and choose another Google account.'
        );
        return;
      }

      BWMS.authUser = user;
      BWMS.isAuthorizedStaff = true;
      BWMS.isAdminUser = isBootstrap || (staffData && staffData.role === 'ADMIN');
      BWMS.currentUser = {
        email: emailLower,
        name: (staffData && staffData.name) || user.displayName || emailLower.split('@')[0],
        role: isBootstrap ? 'ADMIN' : ((staffData && staffData.role) || 'OPERATOR')
      };

      showAuthGateState('authenticated');
      loadCachedState();
      await ensureFirestoreSeeded();
      startFirestoreListeners();
      syncAllData(false);
    } catch (authErr) {
      console.error('Staff verification failed:', authErr);
      BWMS.isAuthorizedStaff = false;
      BWMS.isAdminUser = false;
      updateSyncStatusBadge('Auth Error', 'offline');
      showAuthGateState('auth-error', 'Could not verify staff access for "' + emailLower + '": ' + (authErr && authErr.message ? authErr.message : String(authErr)));
    }
  });
}

async function handleFirebaseGoogleLogin() {
  var FB = (typeof window !== 'undefined') ? window.FB_CLIENT : null;
  if (!FB || !FB.auth) {
    showToast('Firebase Authentication is still initializing...', 'warning');
    return;
  }
  showAuthGateState('loading');
  try {
    var provider = new FB.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    await FB.signInWithPopup(FB.auth, provider);
  } catch (err) {
    var code = err && err.code ? String(err.code) : '';
    if (code === 'auth/popup-blocked') {
      try {
        var redirectProvider = new FB.GoogleAuthProvider();
        await FB.signInWithRedirect(FB.auth, redirectProvider);
        return;
      } catch (redirErr) {
        showAuthGateState('login-error', redirErr.message || String(redirErr));
        return;
      }
    }
    showAuthGateState('login-error', (err && err.message) ? err.message : 'Google Sign-In failed.');
  }
}

async function handleFirebaseEmailLogin(e) {
  if (e && e.preventDefault) e.preventDefault();
  var FB = (typeof window !== 'undefined') ? window.FB_CLIENT : null;
  if (!FB || !FB.auth) return;
  var email = (document.getElementById('auth-email-input') ? document.getElementById('auth-email-input').value : '').trim();
  var pass = document.getElementById('auth-password-input') ? document.getElementById('auth-password-input').value : '';
  if (!email || !pass) return;

  showAuthGateState('loading');
  try {
    await FB.signInWithEmailAndPassword(FB.auth, email, pass);
  } catch (err) {
    showAuthGateState('login-error', (err && err.message) ? err.message : 'Invalid staff email or password.');
  }
}

async function handleFirebaseSignOut() {
  detachFirestoreListeners();
  BWMS.authUser = null;
  BWMS.isAuthorizedStaff = false;
  BWMS.isAdminUser = false;
  BWMS.staffList = [];
  BWMS.firestoreSeededCheckDone = false;
  var FB = (typeof window !== 'undefined') ? window.FB_CLIENT : null;
  if (FB && FB.auth) {
    try {
      await FB.signOut(FB.auth);
    } catch (err) {
      console.warn('Sign out warning:', err);
    }
  }
  showAuthGateState('login');
}

function detachFirestoreListeners() {
  if (Array.isArray(BWMS.firebaseUnsubscribers)) {
    BWMS.firebaseUnsubscribers.forEach(function(unsub) {
      try { if (typeof unsub === 'function') unsub(); } catch (e) {}
    });
  }
  BWMS.firebaseUnsubscribers = [];
}

var _fbRenderTimer = null;
function scheduleFirestoreUiRefresh() {
  if (_fbRenderTimer) clearTimeout(_fbRenderTimer);
  _fbRenderTimer = setTimeout(function() {
    saveStateToLocalCache();
    applyStateData({
      config: BWMS.config,
      models: BWMS.models,
      dealers: BWMS.dealers,
      customers: BWMS.customers,
      tickets: BWMS.tickets,
      claims: BWMS.claims,
      claimDocuments: BWMS.claimDocuments,
      staffList: BWMS.staffList,
      tests: BWMS.tests,
      challans: BWMS.challans,
      dispatches: BWMS.dispatches,
      dispatchItems: BWMS.dispatchItems,
      stockUpdates: BWMS.stockUpdates,
      serviceBatteries: BWMS.serviceBatteries,
      serviceBatteryLogs: BWMS.serviceBatteryLogs,
      auditLog: BWMS.auditLog,
      currentUser: BWMS.currentUser
    });
    BWMS.lastSyncedAt = new Date();
    updateSyncStatusBadge('Firebase Live', 'online');
  }, 60);
}

function startFirestoreListeners() {
  var FB = (typeof window !== 'undefined') ? window.FB_CLIENT : null;
  if (!FB || !FB.db || !BWMS.isAuthorizedStaff) return;
  detachFirestoreListeners();

  // Config singleton
  BWMS.firebaseUnsubscribers.push(
    FB.onSnapshot(FB.doc(FB.db, 'config', 'app_settings'), function(snap) {
      if (snap.exists()) {
        BWMS.config = Object.assign({}, BWMS.config, snap.data());
        scheduleFirestoreUiRefresh();
      }
    }, function(err) {
      console.warn('Config listener warning:', err);
    })
  );

  var collectionsMap = [
    ['battery_models', 'models'],
    ['dealers', 'dealers'],
    ['customers', 'customers'],
    ['tickets', 'tickets'],
    ['battery_tests', 'tests'],
    ['claims', 'claims'],
    ['claim_documents', 'claimDocuments'],
    ['delivery_challans', 'challans'],
    ['company_dispatches', 'dispatches'],
    ['company_dispatch_items', 'dispatchItems'],
    ['stock_update_log', 'stockUpdates'],
    ['service_batteries', 'serviceBatteries'],
    ['service_battery_logs', 'serviceBatteryLogs'],
    ['audit_log', 'auditLog']
  ];

  collectionsMap.forEach(function(pair) {
    var colName = pair[0];
    var stateKey = pair[1];
    var unsub = FB.onSnapshot(FB.collection(FB.db, colName), function(snap) {
      var list = [];
      snap.forEach(function(dSnap) {
        list.push(dSnap.data());
      });
      BWMS[stateKey] = sortFirestoreRecords(colName, list);
      scheduleFirestoreUiRefresh();
    }, function(err) {
      console.warn('Listener warning [' + colName + ']:', err);
    });
    BWMS.firebaseUnsubscribers.push(unsub);
  });

  // Authorized staff collection list is Admin-only per firestore.rules
  if (BWMS.isAdminUser) {
    BWMS.firebaseUnsubscribers.push(
      FB.onSnapshot(FB.collection(FB.db, 'authorized_staff'), function(snap) {
        var staff = [];
        snap.forEach(function(dSnap) { staff.push(dSnap.data()); });
        staff.sort(function(a, b) { return String(a.email || '').localeCompare(String(b.email || '')); });
        BWMS.staffList = staff;
        scheduleFirestoreUiRefresh();
      }, function(err) {
        console.warn('Staff listener warning:', err);
      })
    );
  }
}

async function ensureFirestoreSeeded() {
  if (BWMS.firestoreSeededCheckDone) return;
  BWMS.firestoreSeededCheckDone = true;
  var FB = (typeof window !== 'undefined') ? window.FB_CLIENT : null;
  if (!FB || !FB.db) return;

  try {
    var cfgRef = FB.doc(FB.db, 'config', 'app_settings');
    var cfgSnap = await FB.getDoc(cfgRef);
    var modelsSnap = await FB.getDocs(FB.collection(FB.db, 'battery_models'));
    var seed = getDefaultSeedState();

    if (!cfgSnap.exists()) {
      var nowIso = new Date().toISOString();
      var defaultCfg = fbPickFields(Object.assign({}, seed.config, {
        TICKET_PREFIX: 'TKT',
        CLAIM_PREFIX: 'CLM',
        RETURN_CHALLAN_PREFIX: 'DC-RET',
        COMPANY_CHALLAN_PREFIX: 'DC-COM',
        DISPATCH_PREFIX: 'DSP',
        TICKET_SEQ: 1001,
        CLAIM_SEQ: 1001,
        RETURN_CHALLAN_SEQ: 1001,
        COMPANY_CHALLAN_SEQ: 1001,
        DISPATCH_SEQ: 1001,
        updated_at: nowIso
      }), FB_ALLOWED_FIELDS.config);
      await FB.setDoc(cfgRef, defaultCfg);
    }

    if (modelsSnap.empty) {
      var batch = FB.writeBatch(FB.db);
      var seedTime = new Date().toISOString();
      (seed.models || []).forEach(function(m) {
        var docObj = fbCleanModel(m, seedTime);
        batch.set(FB.doc(FB.db, 'battery_models', docObj.model_id), docObj);
      });
      var dealersSnap = await FB.getDocs(FB.collection(FB.db, 'dealers'));
      if (dealersSnap.empty) {
        (seed.dealers || []).forEach(function(d) {
          var dObj = fbCleanDealer(d, seedTime);
          batch.set(FB.doc(FB.db, 'dealers', dObj.dealer_id), dObj);
        });
      }
      await batch.commit();
    }
  } catch (seedErr) {
    console.warn('Firestore initial seed check warning:', seedErr);
  }
}

function loadCachedState() {
  var loaded = false;
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      var cached = JSON.parse(raw);
      if (cached && (cached.tables || cached.tickets || cached.models)) {
        applyStateData(cached);
        updateSyncStatusBadge('Cached (Offline Ready)', 'cached');
        console.log('⚡ Loaded complete database state from instant local cache.');
        loaded = true;
      }
    }
  } catch (err) {
    console.warn('Cache read warning:', err);
  }
  if (!loaded) {
    var seed = getDefaultSeedState();
    applyStateData(seed);
    saveStateToLocalCache();
    updateSyncStatusBadge('Local Ready', 'cached');
  }
}

function saveStateToLocalCache() {
  try {
    var cleanTickets = (BWMS.tickets || []).filter(function(t) {
      return t && String(t.ticket_no || '').indexOf('TKT-TEMP-') !== 0;
    });
    var snapshot = {
      tables: {
        Config: BWMS.config,
        Battery_Models: BWMS.models,
        Dealers: BWMS.dealers,
        Customers: BWMS.customers,
        Tickets: cleanTickets,
        Claims: BWMS.claims,
        Claim_Documents: BWMS.claimDocuments,
        Battery_Tests: BWMS.tests,
        Delivery_Challans: BWMS.challans,
        Company_Dispatches: BWMS.dispatches,
        Company_Dispatch_Items: BWMS.dispatchItems,
        Stock_Update_Log: BWMS.stockUpdates,
        Service_Batteries: BWMS.serviceBatteries,
        Service_Battery_Logs: BWMS.serviceBatteryLogs,
        Audit_Log: BWMS.auditLog
      },
      config: BWMS.config,
      models: BWMS.models,
      dealers: BWMS.dealers,
      customers: BWMS.customers,
      tickets: cleanTickets,
      claims: BWMS.claims,
      claimDocuments: BWMS.claimDocuments,
      staffList: BWMS.staffList,
      tests: BWMS.tests,
      challans: BWMS.challans,
      dispatches: BWMS.dispatches,
      dispatchItems: BWMS.dispatchItems,
      stockUpdates: BWMS.stockUpdates,
      serviceBatteries: BWMS.serviceBatteries,
      serviceBatteryLogs: BWMS.serviceBatteryLogs,
      auditLog: BWMS.auditLog,
      currentUser: BWMS.currentUser,
      syncedAt: new Date().toISOString()
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(snapshot));
  } catch (e) {
    console.warn('Cache write warning:', e);
  }
}

function syncAllData(isManual) {
  if (BWMS.isSyncing) return;
  BWMS.isSyncing = true;
  updateSyncStatusBadge('Syncing Firestore...', 'syncing');

  callServer('apiGetBulkState', [], function(res) {
    BWMS.isSyncing = false;
    if (res && res.success && res.data) {
      applyStateData(res.data);
      saveStateToLocalCache();
      BWMS.lastSyncedAt = new Date();
      updateSyncStatusBadge(res.isLocalFallback ? 'Local Mode (Ready)' : 'Firebase Live', res.isLocalFallback ? 'cached' : 'online');

      if (isManual) {
        var totalRecords = (BWMS.tickets.length + BWMS.claims.length + BWMS.tests.length);
        showToast('✅ Firestore Sync Complete: ' + totalRecords + ' records active.', 'success');
      }
    } else {
      updateSyncStatusBadge('Sync Warning', 'offline');
      if (isManual) {
        showToast('Sync warning: ' + ((res && (res.error || res.message)) ? (res.error || res.message) : 'Unable to sync'), 'warning');
      }
    }
  }, function(err) {
    BWMS.isSyncing = false;
    updateSyncStatusBadge('Offline / Error', 'offline');
    console.warn('Bulk sync error:', err);
    if (isManual) {
      showToast('Firestore sync error: ' + err, 'error');
    }
  });
}

function applyStateData(data) {
  var t = data.tables || {};
  BWMS.config = data.config || t.Config || BWMS.config || {};
  BWMS.models = data.models || t.Battery_Models || BWMS.models || [];
  BWMS.dealers = data.dealers || t.Dealers || BWMS.dealers || [];
  BWMS.customers = data.customers || t.Customers || BWMS.customers || [];
  BWMS.tickets = data.tickets || t.Tickets || [];
  BWMS.claims = data.claims || t.Claims || [];
  BWMS.claimDocuments = data.claimDocuments || t.Claim_Documents || BWMS.claimDocuments || [];
  if (data.staffList) BWMS.staffList = data.staffList;
  BWMS.tests = data.tests || t.Battery_Tests || [];
  BWMS.challans = data.challans || t.Delivery_Challans || [];
  BWMS.dispatches = data.dispatches || t.Company_Dispatches || [];
  BWMS.dispatchItems = data.dispatchItems || t.Company_Dispatch_Items || [];
  BWMS.stockUpdates = data.stockUpdates || t.Stock_Update_Log || [];
  BWMS.serviceBatteries = data.serviceBatteries || t.Service_Batteries || [];
  BWMS.serviceBatteryLogs = data.serviceBatteryLogs || t.Service_Battery_Logs || [];
  BWMS.auditLog = data.auditLog || t.Audit_Log || [];
  BWMS.currentUser = data.currentUser || BWMS.currentUser;
  BWMS.dashboard = data.dashboard || {};
  BWMS.reports = data.reports || {};

  // Update User Profile Badge
  var userEl = document.getElementById('current-user-name');
  var avatarEl = document.getElementById('current-user-avatar');
  if (userEl) userEl.textContent = BWMS.currentUser.name || BWMS.currentUser.email || 'Staff Operator';
  if (avatarEl) {
    var initials = (BWMS.currentUser.name || 'OP').substring(0, 2).toUpperCase();
    avatarEl.textContent = initials;
  }

  // Populate Dropdowns
  populateDropdowns();

  // Update Settings Form fields
  populateSettingsForm();

  // Re-render currently active view
  renderCurrentView();
}

function updateSyncStatusBadge(text, state) {
  var badge = document.getElementById('sync-status-badge');
  var dot = document.getElementById('sync-dot');
  var label = document.getElementById('sync-status-text');
  var refreshIcon = document.getElementById('sync-refresh-icon');

  if (label) label.textContent = text;
  if (dot) {
    dot.className = 'sync-dot';
    if (state === 'syncing') dot.classList.add('syncing');
    else if (state === 'offline') dot.classList.add('offline');
  }
  if (refreshIcon) {
    if (state === 'syncing') refreshIcon.classList.add('spin');
    else refreshIcon.classList.remove('spin');
  }
  if (badge) {
    badge.title = 'Firebase Cloud Firestore: ' + (BWMS.tickets.length || 0) + ' tickets, ' + (BWMS.claims.length || 0) + ' claims. Click to refresh.';
  }

  // Update cloud settings info tab
  var storeStats = document.getElementById('cloud-store-stats');
  if (storeStats) {
    storeStats.textContent = 'Firestore Live • ' + (BWMS.tickets.length + BWMS.claims.length + BWMS.tests.length) + ' active records';
  }
}

function populateDropdowns() {
  // Model Selects
  var modelSelects = [
    'intake-model', 'claim-rep-model-select', 'rep-model-select',
    'filter-tickets-model', 'filter-claims-model',
    'dash-calc-model', 'claimstab-calc-model', 'modal-calc-model', 'modalcalc-model'
  ];
  modelSelects.forEach(function(selId) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    var currentVal = sel.value;
    var defaultText = selId.startsWith('filter') ? 'All Battery Models' : '-- Select Battery Model --';
    sel.innerHTML = '<option value="' + (selId.startsWith('filter') ? 'ALL' : '') + '">' + defaultText + '</option>';
    (BWMS.models || []).forEach(function(m) {
      if (m.is_active === false || String(m.is_active).toUpperCase() === 'FALSE') return;
      var opt = document.createElement('option');
      opt.value = m.model_name || m.model_code;
      var gM = m.guarantee_months || 12;
      var pM = m.pro_rata_months || 12;
      var tM = m.warranty_months || 24;
      opt.textContent = (m.model_name || m.model_code) + ' (' + gM + 'G+' + pM + 'P = ' + tM + 'M)';
      sel.appendChild(opt);
    });
    if (currentVal) sel.value = currentVal;
  });

  // Service Battery Stock Select (only AVAILABLE & not blocked)
  var sbSel = document.getElementById('intake-sb-select');

      hintEl.textContent = availSb.length + ' available in stock (' + outCnt + ' assigned/out, ' + blkCnt + ' blocked). Picking a battery locks it for this customer.';

  // Dealer Selects & Datalist
  var dealerSelects = ['intake-dealer-name'];

      var opt = document.createElement('option');

  var dealerListEl = document.getElementById('rep-dealers-datalist');

    seenNames[compName] = true;
    optsHtml += '<option value="' + escapeHtml(compName) + '"></option>';
    (BWMS.dealers || []).forEach(function(d) {

function setSelectValueFuzzy(selectEl, query) {
  if (!selectEl || !selectEl.options || !query) return false;
  var q = String(query).trim().toLowerCase();
  // 1. Exact value match
  for (var i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].value.toLowerCase() === q) {
      selectEl.selectedIndex = i;
      return true;
    }
  }
  // 2. Exact text match
  for (var i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].textContent.toLowerCase() === q) {
      selectEl.selectedIndex = i;
      return true;
    }
  }
  // 3. Substring match
  for (var i = 0; i < selectEl.options.length; i++) {
    var optVal = selectEl.options[i].value.toLowerCase();
    var optTxt = selectEl.options[i].textContent.toLowerCase();
    if ((optVal && (optVal.indexOf(q) !== -1 || q.indexOf(optVal) !== -1)) ||
        (optTxt && (optTxt.indexOf(q) !== -1 || q.indexOf(optTxt) !== -1))) {
      selectEl.selectedIndex = i;
      return true;
    }
  }
  // 4. Token match (e.g. 42B20R, 0BH40B20R, EPIQ35R)
  var tokens = q.split(/[\s\-_(),/]+/).filter(function(t) { return t.length >= 4; });
  if (tokens.length > 0) {
    for (var i = 0; i < selectEl.options.length; i++) {
      var hay = (selectEl.options[i].value + ' ' + selectEl.options[i].textContent).toLowerCase();
      var matched = tokens.some(function(tok) { return hay.indexOf(tok) !== -1; });
      if (matched) {
        selectEl.selectedIndex = i;
        return true;
      }
    }
  }
  // 5. If still no match and query is non-empty, add dynamic option so value isn't lost
  if (q) {
    var opt = document.createElement('option');
    opt.value = query;
    opt.textContent = query;
    selectEl.appendChild(opt);
    selectEl.value = query;
    return true;
  }
  return false;
}

function navigateTo(viewName, params) {
  BWMS.activeView = viewName;
  var views = document.querySelectorAll('.app-view');
  views.forEach(function(v) { v.style.display = 'none'; });

  var targetView = document.getElementById('view-' + viewName);
  if (targetView) targetView.style.display = 'block';

  var navItems = document.querySelectorAll('.sidebar-nav .nav-item');
  navItems.forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-view') === viewName) {
      item.classList.add('active');
    }
  });

  // Close mobile sidebar if open
  var sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }

  // Render view instantly from local memory
  renderCurrentView(params);
}

function renderDashboard() {
  var tickets = BWMS.tickets || [];
  var claims = BWMS.claims || [];

  // Calculate live counts
  var underTesting = tickets.filter(function(t) { return t.status === 'RECEIVED' || t.status === 'TESTING'; }).length;
  var readyForCompany = claims.filter(function(c) { return c.status === 'CLAIM_CREATED' || c.status === 'READY_FOR_COMPANY'; }).length;
  var sentToCompany = claims.filter(function(c) { return c.status === 'SENT_TO_COMPANY'; }).length;
  var rejectedReturnPending = tickets.filter(function(t) {
    var s = (t.status || '').toUpperCase();
    return s === 'REJECTED_RETURN_PENDING' || s === 'REJECTED — RETURN PENDING' || s === 'TEST_REJECTED';
  }).length;
  var stockTasksPending = claims.filter(function(c) {
    var s = (c.status || '').toUpperCase();
    return (s === 'REPLACEMENT_RECEIVED' || s === 'STOCK_UPDATED') && c.stock_status !== 'UPDATED';
  }).length;

  // Ageing > 15 days
  var overdue15Count = claims.filter(function(c) {
    if (c.status !== 'SENT_TO_COMPANY') return false;
    var d = calcDaysElapsed(c.company_dispatch_date);
    return d > 15;
  }).length;

  // Render Visual Warranty Pipeline
  renderWarrantyPipeline('dashboard-pipeline-container');

  // KPI Elements
  var sbList = BWMS.serviceBatteries || [];
  var sbAvailCount = sbList.filter(function(s) {
    return String(s.status || 'AVAILABLE').toUpperCase() === 'AVAILABLE' && !(s.is_blocked === true || String(s.is_blocked).toUpperCase() === 'TRUE');
  }).length;
  setElText('kpi-total-tickets', tickets.length);
  setElText('kpi-pending-tests', underTesting);
  setElText('kpi-pending-company', readyForCompany);
  setElText('kpi-replacement-due', sentToCompany);
  setElText('kpi-stock-tasks', stockTasksPending);
  setElText('kpi-sb-available', sbAvailCount + ' / ' + sbList.length);

  // Sidebar Badges
  setElText('badge-tickets', tickets.length);
  setElText('badge-lab', underTesting);
  setElText('badge-claims', claims.length);
  setElText('badge-pending-company', readyForCompany);
  setElText('badge-replacement-due', sentToCompany);
  setElText('badge-stock-tasks', stockTasksPending);
  setElText('badge-service-batteries', sbAvailCount);

  // Attention Counts
  setElText('att-lab-count', underTesting);
  setElText('att-return-count', rejectedReturnPending);
  setElText('att-dispatch-count', readyForCompany);
  setElText('att-ageing-count', overdue15Count);
  setElText('att-stock-count', stockTasksPending);

  // Recent Tickets Feed (newest 12)
  var tbody = document.getElementById('dashboard-recent-tickets');
  if (!tbody) return;
  tbody.innerHTML = '';
  var recents = tickets.slice().reverse().slice(0, 12);

  if (recents.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:15px; color:#94a3b8;">No intake tickets recorded yet. Click "+ Receive Battery" to begin.</td></tr>';
    return;
  }

  recents.forEach(function(t) {
    var nextAction = getTicketNextAction(t);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + t.ticket_no + '\')">' + t.ticket_no + '</strong></td>' +
      '<td>' + renderSourceBadge(t.source_type) + '</td>' +
      '<td><strong>' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + '</small></td>' +
      '<td>' + t.battery_model + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
      '<td>' + formatDate(t.date_received) + '</td>' +
      '<td>' + renderStatusBadge(t.status) + '</td>' +
      '<td><span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span></td>' +
      '<td>' + renderTicketActions(t) + '</td>';
    tbody.appendChild(tr);
  });
}

function renderTicketsTable(params) {
  if (params && params.status && document.getElementById('filter-tickets-status')) {
    document.getElementById('filter-tickets-status').value = params.status;
  }
  if (params && params.search && document.getElementById('filter-tickets-search')) {
    document.getElementById('filter-tickets-search').value = params.search;
  }

  var search = (document.getElementById('filter-tickets-search') ? document.getElementById('filter-tickets-search').value : '').toLowerCase().trim();
  var statusFilter = document.getElementById('filter-tickets-status') ? document.getElementById('filter-tickets-status').value : 'ALL';
  var sourceFilter = document.getElementById('filter-tickets-source') ? document.getElementById('filter-tickets-source').value : 'ALL';
  var modelFilter = document.getElementById('filter-tickets-model') ? document.getElementById('filter-tickets-model').value : 'ALL';

  var tickets = BWMS.tickets || [];
  var filtered = tickets.filter(function(t) {
    if (statusFilter !== 'ALL') {
      var ts = (t.status || '').toUpperCase();
      var sf = statusFilter.toUpperCase();
      if (sf === 'PASSED') {
        if (ts !== 'PASSED' && ts !== 'TEST_PASSED') return false;
      } else if (sf === 'REJECTED_RETURN_PENDING') {
        if (ts !== 'REJECTED_RETURN_PENDING' && ts !== 'REJECTED — RETURN PENDING' && ts !== 'TEST_REJECTED') return false;
      } else if (sf === 'REJECTED_RETURNED') {
        if (ts !== 'REJECTED_RETURNED' && ts !== 'REJECTED — RETURNED') return false;
      } else if (sf === 'CLOSED') {
        if (ts !== 'CLOSED' && ts !== 'CLAIM_CLOSED' && ts !== 'REJECTED_RETURNED' && ts !== 'REJECTED — RETURNED') return false;
      } else if (ts !== sf) {
        return false;
      }
    }
    if (sourceFilter !== 'ALL' && t.source_type !== sourceFilter) return false;
    if (modelFilter !== 'ALL' && t.battery_model !== modelFilter) return false;
    if (search) {
      var blob = [
        t.ticket_no,
        t.customer_name,
        t.dealer_name,
        t.mobile,
        t.vehicle_number,
        t.battery_model,
        t.original_serial_no,
        t.remarks
      ].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  // Render Visual Warranty Pipeline
  renderWarrantyPipeline('tickets-pipeline-container', statusFilter);

  // Update counter badge
  var countBadge = document.getElementById('tickets-count-badge');
  if (countBadge) countBadge.textContent = filtered.length + ' of ' + tickets.length + ' records';

  var tbody = document.getElementById('tickets-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:25px; color:#94a3b8;">No matching intake tickets found.</td></tr>';
    return;
  }

  // Reverse to show latest first
  filtered.slice().reverse().forEach(function(t) {
    var nextAction = getTicketNextAction(t);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + t.ticket_no + '\')">' + t.ticket_no + '</strong></td>' +
      '<td>' + renderSourceBadge(t.source_type) + '</td>' +
      '<td><strong>' + (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + (t.vehicle_number ? ' • ' + t.vehicle_number : '') + '</small></td>' +
      '<td>' + t.battery_model + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
      '<td>' + formatDate(t.date_received) + '</td>' +
      '<td>' + (t.service_battery_issued ? '<span class="badge badge-blue">Lent: ' + (t.service_battery_serial || 'Yes') + '</span>' : '<span style="color:#94a3b8;">None</span>') + '</td>' +
      '<td>' + renderStatusBadge(t.status) + '</td>' +
      '<td><span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span></td>' +
      '<td>' + renderTicketActions(t) + '</td>';
    tbody.appendChild(tr);
  });
}

function handleIntakeSubmit(e) {
  e.preventDefault();
  var cleanSerial = document.getElementById('intake-serial').value.trim();
  var dup = (BWMS.tickets || []).find(function(t) {
    if (!t || !t.ticket_no || String(t.ticket_no).indexOf('TKT-TEMP-') === 0) return false;
    var ts = (t.status || '').toUpperCase();
    return String(t.original_serial_no || '').trim().toLowerCase() === cleanSerial.toLowerCase() &&
           ts !== 'CLOSED' && ts !== 'CLAIM_CLOSED' && ts !== 'REJECTED_RETURNED' && ts !== 'REJECTED — RETURNED';
  });
  if (dup) {
    showToast('Serial ' + cleanSerial + ' is already active under ' + dup.ticket_no + ' (' + dup.status + ')', 'error');
    return;
  }

  var sbIssued = document.getElementById('intake-service-issued').value === 'YES';
  var sbSerialVal = document.getElementById('intake-sb-serial').value.trim();
  if (sbIssued && sbSerialVal) {
    var existingSb = (BWMS.serviceBatteries || []).find(function(s) {
      return String(s.serial_no || '').trim().toLowerCase() === sbSerialVal.toLowerCase();
    });
    if (existingSb) {
      var sbStatus = String(existingSb.status || 'AVAILABLE').toUpperCase();
      var sbBlocked = existingSb.is_blocked === true || String(existingSb.is_blocked).toUpperCase() === 'TRUE';
      if (sbBlocked || sbStatus === 'BLOCKED') {
        showToast('Service battery ' + sbSerialVal + ' is BLOCKED (' + (existingSb.block_reason || 'Unavailable') + '). Pick an available battery.', 'error');
        return;
      }
      if (sbStatus === 'ASSIGNED') {
        showToast('Service battery ' + sbSerialVal + ' is already ASSIGNED to ' + (existingSb.current_customer_name || existingSb.current_ticket_no) + ' and locked.', 'error');
        return;
      }
    }
  }

  var ticketData = {
    source_type: document.getElementById('intake-source').value,
    dealer_name: document.getElementById('intake-dealer-name').value,
    customer_name: document.getElementById('intake-customer-name').value,
    mobile: document.getElementById('intake-mobile').value,
    address: document.getElementById('intake-address').value,
    vehicle_number: document.getElementById('intake-vehicle').value,
    battery_model: document.getElementById('intake-model').value,
    original_serial_no: cleanSerial,
    date_received: document.getElementById('intake-date').value,
    service_battery_issued: sbIssued,
    service_battery_model: document.getElementById('intake-sb-model').value,
    service_battery_serial: sbSerialVal,
    remarks: document.getElementById('intake-remarks').value
  };

  closeModal('modal-intake');

  // Optimistic local update
  var tempTicketNo = 'TKT-TEMP-' + Math.floor(Math.random() * 9000 + 1000);
  var optimisticTicket = Object.assign({}, ticketData, {
    ticket_no: tempTicketNo,
    status: 'RECEIVED',
    created_at: new Date().toISOString().split('T')[0]
  });
  BWMS.tickets.push(optimisticTicket);
  renderTicketsTable();
  renderDashboard();
  showToast('Creating intake ticket...', 'info');

  callServer('apiCreateTicket', [ticketData], function(res) {
    BWMS.tickets = (BWMS.tickets || []).filter(function(t) { return t.ticket_no !== tempTicketNo; });
    if (res && res.success) {
      if (res.data && res.data.ticket_no && !BWMS.tickets.some(function(t) { return t.ticket_no === res.data.ticket_no; })) {
        BWMS.tickets.push(res.data);
      }
      saveStateToLocalCache();
      renderTicketsTable();
      renderDashboard();
      showToast(res.message || 'Ticket generated successfully!', 'success');
      syncAllData(false);

      if (typeof confirm === 'function') {
        if (confirm('Intake ticket ' + res.data.ticket_no + ' created! Would you like to print the Customer Intake Slip now?')) {
          printIntakeSlip(res.data.ticket_no);
        } else if (confirm('Would you like to conduct the Diagnostic Bench Test now?')) {
          openTestModal(res.data.ticket_no, res.data.battery_model, res.data.original_serial_no);
        }
      }
    } else {
      renderTicketsTable();
      renderDashboard();
      showToast((res && (res.error || res.message)) ? (res.error || res.message) : 'Failed to create ticket', 'error');
      syncAllData(false);
    }
  });
}

  var verdictFilter = document.getElementById('filter-lab-verdict') ? document.getElementById('filter-lab-verdict').value : 'ALL';

  var queueItems = (BWMS.tickets || []).filter(function(t) {
    return t.status === 'RECEIVED' || t.status === 'TESTING';
  });

  setElText('lab-queue-tab-count', queueItems.length);
  setElText('lab-history-tab-count', (BWMS.tests || []).length);

  // Render Queue Table
  var tbodyQueue = document.getElementById('lab-queue-body');
  if (tbodyQueue) {
    tbodyQueue.innerHTML = '';
    var filteredQueue = queueItems.filter(function(t) {
      if (!search) return true;
      var blob = [t.ticket_no, t.customer_name, t.dealer_name, t.battery_model, t.original_serial_no, t.remarks].join(' ').toLowerCase();
      return blob.indexOf(search) !== -1;
    });

    if (filteredQueue.length === 0) {
      tbodyQueue.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:25px; color:#16a34a;">🎉 Testing lab queue is clear! All batteries tested.</td></tr>';
    } else {
      filteredQueue.forEach(function(t) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + t.ticket_no + '</strong></td>' +
          '<td><strong>' + (t.customer_name || t.dealer_name) + '</strong><br><small style="color:#64748b;">' + (t.mobile || '') + '</small></td>' +
          '<td>' + t.battery_model + '</td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + t.original_serial_no + '</span></td>' +
          '<td>' + formatDate(t.date_received) + '</td>' +
          '<td>' + (t.remarks || 'No symptoms noted') + '</td>' +
          '<td><button class="btn btn-primary btn-sm" onclick="openTestModal(\'' + t.ticket_no + '\', \'' + t.battery_model + '\', \'' + t.original_serial_no + '\')">🔬 Conduct Test</button></td>';
        tbodyQueue.appendChild(tr);
      });
    }
  }

  // Render Completed History Table
  var tbodyHistory = document.getElementById('lab-history-body');
  if (tbodyHistory) {
    tbodyHistory.innerHTML = '';
    var tests = BWMS.tests || [];
    var filteredHistory = tests.filter(function(tst) {
      if (verdictFilter !== 'ALL' && tst.test_result !== verdictFilter) return false;
      if (search) {
        var blob = [tst.test_id, tst.ticket_no, tst.original_serial_no, tst.tested_by, tst.test_remarks].join(' ').toLowerCase();
        if (blob.indexOf(search) === -1) return false;
      }
      return true;
    });

    var activeCount = (BWMS.labTab === 'history') ? (filteredHistory.length + ' tests') : (queueItems.length + ' queued');
    setElText('lab-count-badge', activeCount);

    if (filteredHistory.length === 0) {
      tbodyHistory.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No completed diagnostic tests found.</td></tr>';
    } else {
      filteredHistory.slice().reverse().forEach(function(tst) {
        var tr = document.createElement('tr');
        var isPass = (tst.test_result === 'PASS');
        var linkedClaim = (BWMS.claims || []).find(function(c) { return c.ticket_no === tst.ticket_no; });
        var retChallan = (BWMS.challans || []).find(function(ch) { return ch.ticket_no === tst.ticket_no && (ch.challan_type === 'BATTERY_RETURN' || !ch.challan_type); });

        var actionBtns = '<div style="display:flex; gap:6px; flex-wrap:wrap;">';
        if (isPass) {
          if (!linkedClaim) {
            actionBtns += '<button class="btn btn-success btn-sm" onclick="openClaimModal(\'' + tst.ticket_no + '\')">📝 + File Claim</button>';
          } else {
            actionBtns += '<button class="btn btn-warning btn-sm" onclick="navigateTo(\'pending-company\')">🚚 Dispatch</button>';
          }
        } else {
          if (!retChallan) {
            actionBtns += '<button class="btn btn-danger btn-sm" onclick="createReturnChallan(\'' + tst.ticket_no + '\')">📄 + Challan</button>';
          } else {
            actionBtns += '<button class="btn btn-secondary btn-sm" onclick="printReturnChallan(\'' + retChallan.challan_no + '\')">🖨️ Challan</button>';
            if (retChallan.status !== 'ACKNOWLEDGED') {
              actionBtns += '<button class="btn btn-danger btn-sm" onclick="openMarkReturnedModal(\'' + retChallan.challan_no + '\')">🤝 Handover</button>';
            }
          }
        }
        actionBtns += '<button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + tst.ticket_no + '\')">Timeline</button>';
        actionBtns += '</div>';

        tr.innerHTML =
          '<td><strong style="color:var(--accent);">' + (tst.test_id || 'TST-') + '</strong></td>' +
          '<td><small onclick="showTimeline(\'' + tst.ticket_no + '\')" style="cursor:pointer; color:var(--text-muted);">' + tst.ticket_no + '</small></td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + tst.original_serial_no + '</span></td>' +
          '<td>' + formatDate(tst.test_date) + '</td>' +
          '<td><strong>' + (tst.open_circuit_voltage ? tst.open_circuit_voltage + 'V' : '-') + '</strong></td>' +
          '<td>' + renderTestVerdictBadge(tst.test_result) + '</td>' +
          '<td>' + (tst.tested_by || '-') + '</td>' +
          '<td><small>' + (tst.test_remarks || '-') + '</small></td>' +
          '<td>' + actionBtns + '</td>';
        tbodyHistory.appendChild(tr);
      });
    }
  }
}

  openModal('modal-test');

function handleTestSubmit(e) {
  e.preventDefault();
  var testData = {
    ticket_no: document.getElementById('test-ticket-no').value,
    test_result: document.getElementById('test-result').value,
    test_date: document.getElementById('test-date').value,
    tested_by: document.getElementById('test-tested-by').value,
    open_circuit_voltage: document.getElementById('test-voltage').value,
    specific_gravity: document.getElementById('test-gravity') ? document.getElementById('test-gravity').value : '',
    load_test_voltage: document.getElementById('test-load-voltage') ? document.getElementById('test-load-voltage').value : '',
    physical_condition: document.getElementById('test-physical-condition') ? document.getElementById('test-physical-condition').value : 'INTACT',
    test_remarks: document.getElementById('test-remarks').value
  };

  closeModal('modal-test');

  // Optimistic local update with canonical backend status
  var tkt = BWMS.tickets.find(function(t) { return t.ticket_no === testData.ticket_no; });
  if (tkt) {
    tkt.status = (testData.test_result === 'PASS') ? 'PASSED' : 'REJECTED_RETURN_PENDING';
  }
  BWMS.tests.push(Object.assign({}, testData, { test_id: 'TST-' + Date.now().toString().slice(-6) }));
  renderLabTables();
  renderDashboard();

  callServer('apiRecordBatteryTest', [testData], function(res) {
    if (res && res.success) {
      showToast(res.message || 'Battery test saved.', 'success');
      syncAllData(false);

      if (testData.test_result === 'PASS') {
        if (confirm('Battery PASSED diagnostics! Would you like to generate the Warranty Claim now?')) {
          openClaimModal(testData.ticket_no);
        }
      } else {
        if (confirm('Battery REJECTED. Would you like to generate the Customer Return Delivery Challan now?')) {
          createReturnChallan(testData.ticket_no);
        }
      }
    } else {
      showToast((res && res.error) ? res.error : 'Failed to record test', 'error');
      syncAllData(false);
    }
  });
}

function renderClaimsTable(params) {
  if (params && params.status && document.getElementById('filter-claims-status')) {
    document.getElementById('filter-claims-status').value = params.status;
  }
  if (params && params.search && document.getElementById('filter-claims-search')) {
    document.getElementById('filter-claims-search').value = params.search;
  }

  var search = (document.getElementById('filter-claims-search') ? document.getElementById('filter-claims-search').value : '').toLowerCase().trim();
  var statusFilter = document.getElementById('filter-claims-status') ? document.getElementById('filter-claims-status').value : 'ALL';
  var warrantyFilter = document.getElementById('filter-claims-warranty') ? document.getElementById('filter-claims-warranty').value : 'ALL';
  var repEndFilter = document.getElementById('filter-claims-rep-end') ? document.getElementById('filter-claims-rep-end').value : 'ALL';
  var modelFilter = document.getElementById('filter-claims-model') ? document.getElementById('filter-claims-model').value : 'ALL';

  var claims = BWMS.claims || [];
  var filtered = claims.filter(function(c) {
    if (statusFilter !== 'ALL') {
      var cs = (c.status || '').toUpperCase();
      var sf = statusFilter.toUpperCase();
      if (sf === 'CLOSED' || sf === 'CLAIM_CLOSED') {
        if (cs !== 'CLOSED' && cs !== 'CLAIM_CLOSED') return false;
      } else if (sf === 'STOCK_UPDATED') {
        if (cs !== 'STOCK_UPDATED' && (cs !== 'REPLACEMENT_RECEIVED' || c.stock_status !== 'UPDATED')) return false;
      } else if (cs !== sf) {
        return false;
      }
    }
    if (warrantyFilter !== 'ALL') {
      var ws = (c.warranty_status || '').toUpperCase();
      var cov = (c.coverage_type || '').toUpperCase();
      var rem = (c.remarks || '').toUpperCase();
      var wf = warrantyFilter.toUpperCase();
      if (wf === 'PRO_RATA') {
        if (ws !== 'PRO_RATA' && cov !== 'PRO_RATA' && rem.indexOf('PRO-RATA') === -1) return false;
      } else if (wf === 'IN_WARRANTY') {
        if (ws !== 'IN_WARRANTY' && cov !== 'FULL_REPLACEMENT') return false;
      } else if (wf === 'OUT_OF_WARRANTY') {
        if (ws !== 'OUT_OF_WARRANTY' && ws !== 'EXPIRED' && cov !== 'EXPIRED') return false;
      } else if (ws !== wf) {
        return false;
      }
    }
    if (repEndFilter !== 'ALL') {
      var re = String(c.replacement_end || (c.replacement_serial_no ? 'COMPANY_END' : '')).toUpperCase();
      if (repEndFilter === 'PENDING') {
        if (re || c.replacement_serial_no) return false;
      } else if (re !== repEndFilter) {
        return false;
      }
    }
    if (modelFilter !== 'ALL' && c.battery_model !== modelFilter) return false;
    if (search) {
      var blob = [
        c.claim_no,
        c.ticket_no,
        c.customer_name,
        c.dealer_name,
        c.mobile,
        c.battery_model,
        c.original_serial_no,
        c.replacement_model,
        c.replacement_serial_no,
        c.replacement_end,
        c.replaced_by_party
      ].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  // Render Visual Warranty Pipeline
  renderWarrantyPipeline('claims-pipeline-container', statusFilter);

  setElText('claims-count-badge', filtered.length + ' of ' + claims.length + ' claims');

  var tbody = document.getElementById('claims-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:25px; color:#94a3b8;">No matching claims found.</td></tr>';
    return;
  }

  filtered.slice().reverse().forEach(function(c) {
    var nextAction = getClaimNextAction(c);
    var repHtml = c.replacement_serial_no
      ? renderReplacementEndBadge(c) +
        '<div style="font-size:11px; margin-top:4px;"><strong>' + escapeHtml(c.replacement_model || c.battery_model) + '</strong></div>' +
        '<div style="font-size:11px; font-family:monospace; color:#15803d; font-weight:700;">SN: ' + escapeHtml(c.replacement_serial_no) + '</div>' +
        (c.replaced_by_party ? '<div style="font-size:10px; color:#64748b;">By: ' + escapeHtml(c.replaced_by_party) + '</div>' : '')
      : renderReplacementEndBadge(c);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
      '<td><small onclick="showTimeline(\'' + c.ticket_no + '\')" style="cursor:pointer; color:var(--text-muted);">' + c.ticket_no + '</small></td>' +
      '<td><strong>' + escapeHtml(c.customer_name || c.dealer_name) + '</strong><br><small style="color:#64748b;">' + escapeHtml(c.mobile || '') + '</small></td>' +
      '<td>' + escapeHtml(c.battery_model) + '</td>' +
      '<td><span style="font-family:monospace; font-weight:bold;">' + escapeHtml(c.original_serial_no) + '</span></td>' +
      '<td>' + repHtml + '</td>' +
      '<td>Sale: ' + formatDate(c.date_of_sale) + '<br><small>Exp: ' + formatDate(c.warranty_expiry_date) + '</small></td>' +
      '<td>' + renderWarrantyBadge(c.warranty_status) + '</td>' +
      '<td>' + renderStatusBadge(c.status) + '</td>' +
      '<td><span class="next-action-pill ' + nextAction.badgeClass + '">' + nextAction.stepLabel + '</span></td>' +
      '<td>' + renderClaimActions(c) + '</td>';
    tbody.appendChild(tr);
  });
}

function openClaimModal(ticketNo) {
  var t = (BWMS.tickets || []).find(function(item) { return item.ticket_no === ticketNo; });
  if (!t) {
    showToast('Ticket not found in local memory', 'error');
    return;
  }

  document.getElementById('form-claim').reset();
  document.getElementById('claim-ticket-no').value = t.ticket_no;
  document.getElementById('claim-view-ticket').textContent = t.ticket_no;
  document.getElementById('claim-view-party').textContent = (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name) || '';
  document.getElementById('claim-view-model').textContent = t.battery_model || '';
  document.getElementById('claim-view-serial').textContent = t.original_serial_no || '';
  BWMS._activeClaimTicket = t;

  // Initialize replacement fields
  var repEndEl = document.getElementById('claim-rep-end');
  if (repEndEl) repEndEl.value = '';
  var repDateEl = document.getElementById('claim-rep-date');
  if (repDateEl) repDateEl.value = new Date().toISOString().split('T')[0];
  var repModelEl = document.getElementById('claim-rep-model');
  if (repModelEl) repModelEl.value = t.battery_model || '';
  var repModelSelEl = document.getElementById('claim-rep-model-select');
  if (repModelSelEl && t.battery_model) setSelectValueFuzzy(repModelSelEl, t.battery_model);
  toggleClaimImmediateRep();

  // Look up model specifications via fuzzy resolver
  var m = findBatteryModel(t.battery_model);
  var calcPreview = calculateWarrantyDetails(t.battery_model, null, null);
  var totalMonths = calcPreview.totalMonths;
  var guaranteeMonths = calcPreview.guaranteeMonths;
  var proRataMonths = calcPreview.proRataMonths;

  var specsEl = document.getElementById('claim-model-specs');
  if (specsEl) {
    specsEl.innerHTML =
      '<span class="badge badge-blue">Warranty: ' + totalMonths + 'M (' + guaranteeMonths + 'G + ' + proRataMonths + 'P)</span> ' +
      (m && m.brand ? '<span class="badge badge-gray">' + m.brand + '</span> ' : '') +
      (m && m.capacity_ah ? '<span class="badge badge-gray">' + m.capacity_ah + ' Ah</span>' : '');
  }

  var dosInput = document.getElementById('claim-dos');
  if (dosInput) {
    var extractedDos = '';
    if (t.remarks && t.remarks.indexOf('Purchase Date:') !== -1) {
      var matchDos = t.remarks.match(/Purchase Date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/);
      if (matchDos) extractedDos = matchDos[1];
    }
    if (t.date_of_sale) {
      dosInput.value = t.date_of_sale.indexOf('T') !== -1 ? t.date_of_sale.split('T')[0] : t.date_of_sale;
    } else if (extractedDos) {
      dosInput.value = extractedDos;
    } else {
      var d = new Date();
      d.setMonth(d.getMonth() - 6);
      dosInput.value = d.toISOString().split('T')[0];
    }
  }

  var mrpInput = document.getElementById('claim-mrp');
  if (mrpInput) {
    mrpInput.value = calcPreview.mrp || 5500;
  }

  calculateClaimWarranty();
  openModal('modal-claim');
}

function toggleClaimImmediateRep() {
  var endVal = document.getElementById('claim-rep-end') ? document.getElementById('claim-rep-end').value : '';
  var box = document.getElementById('claim-immediate-rep-box');
  var modelInp = document.getElementById('claim-rep-model');
  var serialInp = document.getElementById('claim-rep-serial');
  var partyInp = document.getElementById('claim-rep-party');
  var partyLbl = document.getElementById('claim-rep-party-label');
  var show = Boolean(endVal);

  if (box) box.style.display = show ? 'block' : 'none';
  if (modelInp) modelInp.required = show;
  if (serialInp) serialInp.required = show;

  if (show && partyInp) {
    var t = BWMS._activeClaimTicket || {};
    var compName = (BWMS.config && BWMS.config.COMPANY_NAME) ? BWMS.config.COMPANY_NAME : 'Distributor Counter';
    if (endVal === 'DEALER_END') {
      if (partyLbl) partyLbl.textContent = 'Dealer Name (Replaced At Dealer End)';
      if (!partyInp.value || partyInp.value === compName || partyInp.value === 'Company / Factory Depot') {
        partyInp.value = t.dealer_name || '';
      }
    } else if (endVal === 'DISTRIBUTOR_END') {
      if (partyLbl) partyLbl.textContent = 'Distributor Name (Replaced At Distributor End)';
      if (!partyInp.value || partyInp.value === t.dealer_name || partyInp.value === 'Company / Factory Depot') {
        partyInp.value = compName;
      }
    } else {
      if (partyLbl) partyLbl.textContent = 'Factory / Company Depot';
      partyInp.value = 'Company / Factory Depot';
    }
  }
}

function handleClaimRepModelSelect(val) {
  if (!val) return;
  var inp = document.getElementById('claim-rep-model');
  if (inp) inp.value = val;
}

function calculateClaimWarranty() {
  var model = document.getElementById('claim-view-model') ? document.getElementById('claim-view-model').textContent : '';
  var dos = document.getElementById('claim-dos') ? document.getElementById('claim-dos').value : '';
  var mrp = document.getElementById('claim-mrp') ? document.getElementById('claim-mrp').value : '';
  var box = document.getElementById('claim-calc-box');
  if (!box) return;

  if (!model || !dos) {
    box.innerHTML = 'Enter date of sale to calculate';
    return;
  }

  var calc = calculateWarrantyDetails(model, dos, null, mrp);
  if (!calc.hasDate) {
    box.innerHTML = 'Enter valid date of sale';
    return;
  }

  if (calc.status === 'FULL_GUARANTEE') {
    box.innerHTML =
      '<div style="color:#16a34a; font-weight:700;">✅ FULL GUARANTEE (100% Free Replacement)</div>' +
      '<div style="font-size:12px; color:#334155; margin-top:2px;">Within ' + calc.guaranteeMonths + 'M free guarantee window (Guar Exp: ' + formatDate(calc.guaranteeExpiry) + ') • Customer Payable: <strong style="color:#16a34a;">₹0.00</strong></div>';
  } else if (calc.status === 'PRO_RATA') {
    box.innerHTML =
      '<div style="color:#0284c7; font-weight:700;">⚖️ PRO-RATA WARRANTY (' + calc.discountPercent + '% Discount)</div>' +
      '<div style="font-size:12px; color:#334155; margin-top:2px;">Month ' + (calc.diffMonths + 1) + ' of ' + calc.totalMonths + ' (Exp: ' + formatDate(calc.warrantyExpiry) + ') • Discount: <strong>' + calc.discountPercent + '%</strong> • Customer Pays: <strong style="color:#0369a1;">' + calc.payablePercent + '% (₹' + calc.customerPayable.toLocaleString('en-IN') + ' on ₹' + calc.mrp.toLocaleString('en-IN') + ' MRP)</strong></div>';
  } else {
    box.innerHTML =
      '<div style="color:#dc2626; font-weight:700;">❌ OUT OF WARRANTY (Expired on ' + formatDate(calc.warrantyExpiry) + ')</div>' +
      '<div style="font-size:12px; color:#334155; margin-top:2px;">Battery is outside manufacturer warranty window (' + calc.totalMonths + ' months). Standard scrap exchange discount can be applied.</div>';
  }
}

function handleClaimSubmit(e) {
  e.preventDefault();
  var repEnd = document.getElementById('claim-rep-end') ? document.getElementById('claim-rep-end').value : '';
  var repSerial = document.getElementById('claim-rep-serial') ? document.getElementById('claim-rep-serial').value.trim() : '';
  var repModel = document.getElementById('claim-rep-model') ? document.getElementById('claim-rep-model').value.trim() : '';
  var origSerial = document.getElementById('claim-view-serial') ? document.getElementById('claim-view-serial').textContent.trim() : '';

  if (repEnd) {
    if (!repModel || !repSerial) {
      showToast('Please enter both Replacement Model Number and Serial Number.', 'warning');
      return;
    }
    if (repSerial.toLowerCase() === origSerial.toLowerCase()) {
      showToast('Replacement serial number cannot match original defective serial (' + origSerial + ').', 'error');
      return;
    }
  }

  var claimData = {
    ticket_no: document.getElementById('claim-ticket-no').value,
    date_of_sale: document.getElementById('claim-dos').value,
    invoice_number: document.getElementById('claim-invoice-no').value,
    km_reading: document.getElementById('claim-km').value,
    remarks: document.getElementById('claim-remarks').value,
    replacement_end: repEnd,
    replaced_by_party: document.getElementById('claim-rep-party') ? document.getElementById('claim-rep-party').value.trim() : '',
    replacement_model: repEnd ? repModel : '',
    replacement_serial_no: repEnd ? repSerial : '',
    replacement_received_date: repEnd && document.getElementById('claim-rep-date') ? document.getElementById('claim-rep-date').value : '',
    company_invoice_ref: repEnd && document.getElementById('claim-rep-ref') ? document.getElementById('claim-rep-ref').value.trim() : ''
  };

  closeModal('modal-claim');

  callServer('apiCreateClaim', [claimData], function(res) {
    if (res && res.success) {
      if (res.data && res.data.claim_no) {
        var idx = (BWMS.claims || []).findIndex(function(c) { return c.claim_no === res.data.claim_no; });
        if (idx === -1) BWMS.claims.push(res.data);
        else BWMS.claims[idx] = res.data;
        var tkt = (BWMS.tickets || []).find(function(t) { return t.ticket_no === res.data.ticket_no; });
        if (tkt) tkt.status = res.data.status || 'CLAIM_CREATED';
        saveStateToLocalCache();
      }
      showToast(res.message || 'Warranty claim created!', 'success');
      syncAllData(false);
      if (repEnd) {
        if (confirm('Claim ' + res.data.claim_no + ' created & ' + getReplacementEndLabel(repEnd) + ' replacement logged! Confirm ERP stock entry now?')) {
          openStockModal(res.data.claim_no);
        }
      } else if (confirm('Claim ' + res.data.claim_no + ' generated! Print official Claim Form for battery company?')) {
        printClaimForm(res.data.claim_no);
      }
    } else {
      showToast((res && res.error) ? res.error : 'Failed to generate claim', 'error');
    }
  });
}

var renderDispatchQueueTable = renderDispatchTables;
function renderDispatchTables() {
  var search = (document.getElementById('filter-dispatch-search') ? document.getElementById('filter-dispatch-search').value : '').toLowerCase().trim();

  // Pending Queue
  var pendingClaims = (BWMS.claims || []).filter(function(c) {
    return c.status === 'CLAIM_CREATED' || c.status === 'READY_FOR_COMPANY';
  });

  setElText('dsp-queue-count', pendingClaims.length);
  setElText('dsp-batches-count', (BWMS.dispatches || []).length);

  var tbodyQueue = document.getElementById('pending-dispatch-body');
  if (tbodyQueue) {
    tbodyQueue.innerHTML = '';
    var filtered = pendingClaims.filter(function(c) {
      if (!search) return true;
      var blob = [c.claim_no, c.customer_name, c.dealer_name, c.battery_model, c.original_serial_no].join(' ').toLowerCase();
      return blob.indexOf(search) !== -1;
    });

    if (filtered.length === 0) {
      tbodyQueue.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:25px; color:#16a34a;">No claims waiting for company dispatch. All dispatched!</td></tr>';
    } else {
      filtered.forEach(function(c) {
        var isChecked = BWMS.selectedDispatchClaims.has(c.claim_no);
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><input type="checkbox" class="chk-dispatch-item" value="' + c.claim_no + '" ' + (isChecked ? 'checked' : '') + ' onchange="handleDispatchItemCheck(this)"></td>' +
          '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
          '<td><strong>' + (c.customer_name || c.dealer_name) + '</strong></td>' +
          '<td>' + c.battery_model + '</td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + c.original_serial_no + '</span></td>' +
          '<td>' + formatDate(c.created_at || c.claim_date) + '</td>' +
          '<td><button class="btn btn-secondary btn-sm" onclick="openUploadDocModal(\'' + c.claim_no + '\')">📎 Docs (' + (c.doc_count || 0) + ')</button></td>' +
          '<td><button class="btn btn-secondary btn-sm" onclick="printClaimForm(\'' + c.claim_no + '\')">🖨️ Claim Form</button></td>';
        tbodyQueue.appendChild(tr);
      });
    }
  }

  // Batches History Table
  var tbodyBatches = document.getElementById('dispatch-batches-body');
  if (tbodyBatches) {
    tbodyBatches.innerHTML = '';
    var dispatches = BWMS.dispatches || [];
    if (dispatches.length === 0) {
      tbodyBatches.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No dispatch batches recorded yet.</td></tr>';
    } else {
      dispatches.slice().reverse().forEach(function(b) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent);">' + b.dispatch_batch_no + '</strong></td>' +
          '<td><strong style="font-family:monospace;">' + b.company_challan_no + '</strong></td>' +
          '<td>' + (b.company_name || 'Factory') + '</td>' +
          '<td>' + (b.carrier_transporter || '-') + '</td>' +
          '<td>' + (b.lr_docket_no || '-') + '</td>' +
          '<td><span class="badge badge-purple">' + (b.battery_count || b.claim_count || 1) + ' Batteries</span></td>' +
          '<td>' + formatDate(b.dispatch_date) + '</td>' +
          '<td>' + (b.created_by || 'Staff') + '</td>' +
          '<td><div style="display:flex; gap:6px;">' +
          '  <button class="btn btn-secondary btn-sm" onclick="printCompanyChallan(\'' + (b.company_challan_no || b.dispatch_batch_no) + '\')">🖨️ Challan</button>' +
          '  <button class="btn btn-secondary btn-sm" onclick="openBatchItemsModal(\'' + b.dispatch_batch_no + '\')">👁️ Items</button>' +
          '</div></td>';
        tbodyBatches.appendChild(tr);
      });
    }
  }
}

function handleDispatchItemCheck(cb) {
  if (cb.checked) BWMS.selectedDispatchClaims.add(cb.value);
  else BWMS.selectedDispatchClaims.delete(cb.value);
  updateSelectedDispatchCount();
}

function toggleSelectAllDispatch(checked) {
  var cbs = document.querySelectorAll('.chk-dispatch-item');
  cbs.forEach(function(cb) {
    cb.checked = checked;
    if (checked) BWMS.selectedDispatchClaims.add(cb.value);
    else BWMS.selectedDispatchClaims.delete(cb.value);
  });
  updateSelectedDispatchCount();
}

function updateSelectedDispatchCount() {
  var count = BWMS.selectedDispatchClaims.size;
  setElText('selected-dispatch-count', count + ' claims selected');
}

function openDispatchBatchModal() {
  if (BWMS.selectedDispatchClaims.size === 0) {
    showToast('Please select at least one claim to dispatch to the company.', 'warning');
    return;
  }
  document.getElementById('form-dispatch').reset();
  setElText('dispatch-batch-count', BWMS.selectedDispatchClaims.size);
  document.getElementById('dsp-date').value = new Date().toISOString().split('T')[0];

  var list = document.getElementById('dispatch-selected-claims-list');
  list.innerHTML = '';
  BWMS.selectedDispatchClaims.forEach(function(claimNo) {
    var div = document.createElement('div');
    div.textContent = '• ' + claimNo;
    list.appendChild(div);
  });

  openModal('modal-dispatch');
}

function handleDispatchSubmit(e) {
  e.preventDefault();
  var carrierVal = document.getElementById('dsp-carrier').value;
  var docketVal = document.getElementById('dsp-docket').value;
  var companyVal = document.getElementById('dsp-company-name').value;
  var data = {
    claim_nos: Array.from(BWMS.selectedDispatchClaims),
    company_name: companyVal,
    destination: companyVal,
    dispatch_date: document.getElementById('dsp-date').value,
    transporter: carrierVal,
    transport_name: carrierVal,
    lr_docket_no: docketVal,
    docket_number: docketVal,
    remarks: document.getElementById('dsp-remarks').value
  };

  closeModal('modal-dispatch');

  callServer('apiCreateCompanyDispatch', [data], function(res) {
    if (res && res.success) {
      if (res.data && res.data.company_challan_no) {
        var bNo = res.data.dispatch_batch_no;
        var cChNo = res.data.company_challan_no;
        if (!(BWMS.dispatches || []).some(function(d) { return d.dispatch_batch_no === bNo; })) {
          BWMS.dispatches.push({
            dispatch_batch_no: bNo,
            company_name: data.company_name,
            destination: data.destination,
            company_challan_no: cChNo,
            dispatch_date: data.dispatch_date,
            carrier_transporter: data.transporter,
            lr_docket_no: data.lr_docket_no,
            claim_count: (data.claim_nos || []).length,
            battery_count: (data.claim_nos || []).length,
            created_by: (BWMS.currentUser && BWMS.currentUser.name) || 'Staff',
            remarks: data.remarks || ''
          });
        }
        if (!(BWMS.challans || []).some(function(ch) { return ch.challan_no === cChNo; })) {
          BWMS.challans.push({
            challan_no: cChNo,
            challan_type: 'COMPANY_DISPATCH',
            challan_date: data.dispatch_date,
            recipient_type: 'COMPANY',
            recipient_name: data.company_name,
            address: data.destination,
            battery_model: 'Consolidated Batch (' + (data.claim_nos || []).length + ' Batteries)',
            battery_serial_no: 'BATCH-' + bNo,
            quantity: (data.claim_nos || []).length,
            status: 'GENERATED'
          });
        }
        (data.claim_nos || []).forEach(function(cNo) {
          var clm = (BWMS.claims || []).find(function(c) { return c.claim_no === cNo; });
          if (clm) {
            clm.status = 'SENT_TO_COMPANY';
            clm.dispatch_batch_no = bNo;
            clm.company_challan_no = cChNo;
            clm.company_dispatch_date = data.dispatch_date;
          }
        });
        saveStateToLocalCache();
      }
      BWMS.selectedDispatchClaims.clear();
      showToast(res.message || 'Company dispatch batch created!', 'success');
      syncAllData(false);
      if (confirm('Dispatched! Would you like to print the Consolidated Delivery Challan (' + res.data.company_challan_no + ')?')) {
        printCompanyChallan(res.data.company_challan_no);
      }
    } else {
      showToast((res && res.error) ? res.error : 'Failed to dispatch batch', 'error');
    }
  });
}

        '<td><button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + it.claim_no + '\')">Timeline</button></td>';

  }

  openModal('modal-batch-items');
}

function switchReplacementTab(tab) {
  BWMS.repTab = tab;
  var btnPending = document.getElementById('tab-btn-rep-pending');
  var btnHistory = document.getElementById('tab-btn-rep-history');
  var containerPending = document.getElementById('container-rep-pending');

  if (btnPending) btnPending.classList.toggle('active', tab === 'pending');
  if (btnHistory) btnHistory.classList.toggle('active', tab === 'history');

  if (containerHistory) containerHistory.style.display = (tab === 'history') ? 'block' : 'none';

  renderReplacementsTables();
