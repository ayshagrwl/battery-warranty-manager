var renderReplacementsTable = renderReplacementsTables;
function renderReplacementsTables() {
  var search = (document.getElementById('filter-rep-search') ? document.getElementById('filter-rep-search').value : '').toLowerCase().trim();
  var histSearch = (document.getElementById('filter-rep-history-search') ? document.getElementById('filter-rep-history-search').value : '').toLowerCase().trim();
  var repEndFilter = document.getElementById('filter-rep-end') ? document.getElementById('filter-rep-end').value : 'ALL';
  var ageingFilter = document.getElementById('filter-rep-ageing') ? document.getElementById('filter-rep-ageing').value : 'ALL';

  var dueClaims = (BWMS.claims || []).filter(function(c) {
    return c.status === 'SENT_TO_COMPANY';
  });

  var receivedClaims = (BWMS.claims || []).filter(function(c) {
    var s = (c.status || '').toUpperCase();
    return s === 'REPLACEMENT_RECEIVED' || s === 'STOCK_UPDATED' || s === 'CLOSED' || s === 'CLAIM_CLOSED';
  });

  setElText('rep-pending-count', dueClaims.length);
  setElText('rep-history-count', receivedClaims.length);
  setElText('rep-count-badge', dueClaims.length + ' pending');

  // Pending Requisitions Table
  var tbodyPending = document.getElementById('replacement-pending-body');
  if (tbodyPending) {
    tbodyPending.innerHTML = '';
    var filtered = dueClaims.filter(function(c) {
      var days = calcDaysElapsed(c.company_dispatch_date);
      if (ageingFilter === '0-7' && days > 7) return false;
      if (ageingFilter === '8-15' && (days < 8 || days > 15)) return false;
      if (ageingFilter === '16-30' && (days < 16 || days > 30)) return false;
      if (ageingFilter === '31+' && days < 31) return false;

      if (search) {
        var blob = [c.claim_no, c.company_challan_no, c.customer_name, c.dealer_name, c.battery_model, c.original_serial_no].join(' ').toLowerCase();
        if (blob.indexOf(search) === -1) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbodyPending.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:25px; color:#16a34a;">No replacement batteries pending from company.</td></tr>';
    } else {
      filtered.forEach(function(c) {
        var days = calcDaysElapsed(c.company_dispatch_date);
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
          '<td><small>' + escapeHtml(c.company_challan_no || c.dispatch_batch_no || 'Batch') + '</small></td>' +
          '<td><strong>' + escapeHtml(c.customer_name || c.dealer_name) + '</strong><br><small style="color:#64748b;">' + escapeHtml(c.mobile || '') + '</small></td>' +
          '<td>' + escapeHtml(c.battery_model) + '</td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + escapeHtml(c.original_serial_no) + '</span></td>' +
          '<td>' + formatDate(c.company_dispatch_date) + '</td>' +
          '<td>' + renderAgeingBadge(days) + '</td>' +
          '<td><button class="btn btn-success btn-sm" onclick="openReplacementModal(\'' + c.claim_no + '\', \'' + escapeHtml(c.battery_model) + '\', \'' + escapeHtml(c.original_serial_no) + '\', \'COMPANY_END\')">📥 Receive Replacement</button></td>';
        tbodyPending.appendChild(tr);
      });
    }
  }

  // Replaced / Received History Table
  var tbodyHistory = document.getElementById('replacement-history-body');
  if (tbodyHistory) {
    tbodyHistory.innerHTML = '';
    var filteredHist = receivedClaims.filter(function(c) {
      var re = String(c.replacement_end || 'COMPANY_END').toUpperCase();
      if (repEndFilter !== 'ALL' && re !== repEndFilter) return false;
      if (histSearch) {
        var blob = [c.claim_no, c.battery_model, c.replacement_model, c.original_serial_no, c.replacement_serial_no, c.replaced_by_party, c.stock_ref_no].join(' ').toLowerCase();
        if (blob.indexOf(histSearch) === -1) return false;
      }
      return true;
    });
    if (filteredHist.length === 0) {
      tbodyHistory.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No matching replacement batteries logged yet.</td></tr>';
    } else {
      filteredHist.slice().reverse().forEach(function(c) {
        var repModel = c.replacement_model || c.battery_model || '-';
        var repSerial = c.replacement_serial_no || c.replacement_battery_serial_no || '-';
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
          '<td>' + renderReplacementEndBadge(c) + (c.replaced_by_party ? '<br><small style="color:#64748b;">' + escapeHtml(c.replaced_by_party) + '</small>' : '') + '</td>' +
          '<td><small>' + escapeHtml(c.battery_model) + '</small><br><span style="font-family:monospace; color:#64748b;">' + escapeHtml(c.original_serial_no) + '</span></td>' +
          '<td><strong style="color:#0f172a;">' + escapeHtml(repModel) + '</strong></td>' +
          '<td><span style="font-family:monospace; font-weight:bold; color:#16a34a;">' + escapeHtml(repSerial) + '</span></td>' +
          '<td>' + formatDate(c.replacement_received_date) + '</td>' +
          '<td>' + escapeHtml(c.stock_ref_no || '-') + '</td>' +
          '<td>' + (c.stock_status === 'UPDATED' ? '<span class="badge badge-green">ERP RECONCILED</span>' : '<span class="badge badge-danger">STOCK PENDING</span>') + '</td>' +
          '<td><div style="display:flex; gap:6px; flex-wrap:wrap;">' +
          (c.stock_status !== 'UPDATED' ? '<button class="btn btn-primary btn-sm" onclick="openStockModal(\'' + c.claim_no + '\')">✍️ Stock Task</button>' : (c.status !== 'CLOSED' && c.status !== 'CLAIM_CLOSED' ? '<button class="btn btn-success btn-sm" onclick="openCloseClaimModal(\'' + c.claim_no + '\')">🤝 Deliver & Close</button>' : '<span class="badge badge-green">Closed</span>')) +
          (c.status !== 'CLOSED' && c.status !== 'CLAIM_CLOSED' ? '<button class="btn btn-secondary btn-sm" onclick="openReplacementModal(\'' + c.claim_no + '\')">✏️ Edit Rep</button>' : '') +
          '  <button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + c.claim_no + '\')">Timeline</button>' +
          '</div></td>';
        tbodyHistory.appendChild(tr);
      });
    }
  }
}

function openReplacementModal(claimNo, model, origSerial, defaultEnd) {
  document.getElementById('form-replacement').reset();
  var c = (BWMS.claims || []).find(function(item) { return item.claim_no === claimNo; });
  BWMS._activeRepClaim = c || null;

  var origModel = model || (c ? c.battery_model : '');
  var origSer = origSerial || (c ? c.original_serial_no : '');
  var curRepModel = (c && c.replacement_model) ? c.replacement_model : origModel;

  document.getElementById('rep-claim-no').value = claimNo;
  document.getElementById('rep-view-claim').textContent = claimNo;
  document.getElementById('rep-view-model').textContent = origModel || '';
  document.getElementById('rep-view-original-serial').textContent = origSer || '';
  document.getElementById('rep-date').value = (c && c.replacement_received_date) ? c.replacement_received_date : new Date().toISOString().split('T')[0];

  var pickedEnd = defaultEnd || (c && c.replacement_end) || ((c && c.status === 'SENT_TO_COMPANY') ? 'COMPANY_END' : ((c && c.source_type === 'DEALER') ? 'DEALER_END' : 'DISTRIBUTOR_END'));
  var endSel = document.getElementById('rep-replaced-end');
  if (endSel) endSel.value = pickedEnd;

  var partyInp = document.getElementById('rep-party-name');
  if (partyInp) partyInp.value = (c && c.replaced_by_party) ? c.replaced_by_party : '';

  var repModelInp = document.getElementById('rep-model');
  if (repModelInp) repModelInp.value = curRepModel || '';

  var repModelSel = document.getElementById('rep-model-select');
  if (repModelSel && curRepModel) setSelectValueFuzzy(repModelSel, curRepModel);

  var repSerialInp = document.getElementById('rep-new-serial');
  if (repSerialInp && c && c.replacement_serial_no) repSerialInp.value = c.replacement_serial_no;

  var repRefInp = document.getElementById('rep-ref');
  if (repRefInp && c && c.stock_ref_no) repRefInp.value = c.stock_ref_no;

  handleRepEndChange();
  openModal('modal-replacement');
}

function handleRepEndChange() {
  var endVal = document.getElementById('rep-replaced-end') ? document.getElementById('rep-replaced-end').value : 'DISTRIBUTOR_END';
  var lbl = document.getElementById('rep-party-label');
  var inp = document.getElementById('rep-party-name');
  var c = BWMS._activeRepClaim || {};
  var compName = (BWMS.config && BWMS.config.COMPANY_NAME) ? BWMS.config.COMPANY_NAME : 'Distributor Counter';

  if (endVal === 'DEALER_END') {
    if (lbl) lbl.textContent = 'Dealer Name (Replaced At Dealer End)';
    if (inp && (!inp.value || inp.value === compName || inp.value === 'Company / Factory Depot')) {
      inp.value = c.dealer_name || '';
    }
  } else if (endVal === 'DISTRIBUTOR_END') {
    if (lbl) lbl.textContent = 'Distributor Name (Replaced At Distributor End)';
    if (inp && (!inp.value || inp.value === c.dealer_name || inp.value === 'Company / Factory Depot')) {
      inp.value = compName;
    }
  } else {
    if (lbl) lbl.textContent = 'Company / Factory Depot';
    if (inp && (!inp.value || inp.value === compName || inp.value === c.dealer_name)) {
      inp.value = 'Company / Factory Depot';
    }
  }
}

function handleRepModelSelect(val) {
  if (!val) return;
  var inp = document.getElementById('rep-model');
  if (inp) inp.value = val;
}

function handleReplacementSubmit(e) {
  e.preventDefault();
  var origSerial = document.getElementById('rep-view-original-serial').textContent.trim();
  var newSerial = document.getElementById('rep-new-serial').value.trim();
  var repModel = document.getElementById('rep-model') ? document.getElementById('rep-model').value.trim() : '';
  var repEnd = document.getElementById('rep-replaced-end') ? document.getElementById('rep-replaced-end').value : 'DISTRIBUTOR_END';
  var repParty = document.getElementById('rep-party-name') ? document.getElementById('rep-party-name').value.trim() : '';

  if (newSerial.toLowerCase() === origSerial.toLowerCase()) {
    alert('CRITICAL BARCODE REJECT: Replacement serial number cannot match the defective original serial (' + origSerial + ').');
    return;
  }
  if (!repModel) {
    showToast('Please enter the replacement battery model number.', 'warning');
    return;
  }

  var data = {
    claim_no: document.getElementById('rep-claim-no').value,
    replacement_end: repEnd,
    replaced_by_party: repParty,
    replacement_model: repModel,
    replacement_serial_no: newSerial,
    received_date: document.getElementById('rep-date').value,
    company_invoice_ref: document.getElementById('rep-ref').value,
    remarks: document.getElementById('rep-remarks').value
  };

  closeModal('modal-replacement');

  callServer('apiRecordReplacementReceived', [data], function(res) {
    if (res && res.success) {
      showToast(res.message || 'Replacement recorded! Stock update task generated.', 'success');
      syncAllData(false);
      if (confirm(getReplacementEndLabel(repEnd) + ' replacement (' + repModel + ' / ' + newSerial + ') saved! Confirm Busy/Tally ERP inventory entry now?')) {
        openStockModal(data.claim_no);
      }
    } else {
      showToast((res && res.error) ? res.error : 'Failed to record replacement', 'error');
    }
  });
}

var renderStockTasksTable = renderStockTasksTables;
function renderStockTasksTables() {

  // Pending Tasks Table
  var tbodyPending = document.getElementById('stock-tasks-body');
  if (tbodyPending) {
    tbodyPending.innerHTML = '';
    var filtered = pendingTasks.filter(function(c) {
      if (!search) return true;
      var blob = [c.claim_no, c.battery_model, c.replacement_model, c.replacement_serial_no, c.original_serial_no, c.replacement_end, c.replaced_by_party].join(' ').toLowerCase();
      return blob.indexOf(search) !== -1;
    });

    if (filtered.length === 0) {
      tbodyPending.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:25px; color:#16a34a;">✅ All replacement batteries reconciled with accounting inventory! No pending stock tasks.</td></tr>';
    } else {
      filtered.forEach(function(c) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + c.claim_no + '\')">' + c.claim_no + '</strong></td>' +
          '<td>' + renderReplacementEndBadge(c) + '</td>' +
          '<td><strong>' + escapeHtml(c.replacement_model || c.battery_model) + '</strong></td>' +
          '<td><span style="font-family:monospace; font-weight:bold; color:#16a34a;">' + escapeHtml(c.replacement_serial_no || c.replacement_battery_serial_no || '-') + '</span></td>' +
          '<td><span style="font-family:monospace; color:#64748b;">' + escapeHtml(c.original_serial_no) + '</span></td>' +
          '<td>' + formatDate(c.replacement_received_date) + '</td>' +
          '<td><span class="badge badge-danger">STOCK UPDATE REQUIRED</span></td>' +
          '<td><button class="btn btn-primary btn-sm" onclick="openStockModal(\'' + c.claim_no + '\')">✍️ Certify ERP Entry</button></td>';
        tbodyPending.appendChild(tr);
      });
    }
  }

  // Reconciled Log Table
  var tbodyHistory = document.getElementById('stock-history-body');
  if (tbodyHistory) {
    tbodyHistory.innerHTML = '';
    var logs = BWMS.stockUpdates || [];
    if (logs.length === 0) {
      tbodyHistory.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No inventory stock reconciliation logs found.</td></tr>';
    } else {
      logs.slice().reverse().forEach(function(l) {
        var c = (BWMS.claims || []).find(function(item) { return item.claim_no === l.claim_no; });
        var actionBtns = '<div style="display:flex; gap:6px;">';
        if (c && c.status !== 'CLOSED' && c.status !== 'CLAIM_CLOSED') {
          actionBtns += '<button class="btn btn-success btn-sm" onclick="openCloseClaimModal(\'' + l.claim_no + '\')">🤝 Handover & Close</button>';
        } else {
          actionBtns += '<span class="badge badge-green">Closed</span>';
        }
        actionBtns += '<button class="btn btn-secondary btn-sm" onclick="showTimeline(\'' + l.claim_no + '\')">Timeline</button>';
        actionBtns += '</div>';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong style="color:var(--accent);">' + (l.stock_task_id || 'STK-') + '</strong></td>' +
          '<td><small onclick="showTimeline(\'' + l.claim_no + '\')" style="cursor:pointer; color:var(--text-muted);">' + l.claim_no + '</small></td>' +
          '<td><span style="font-family:monospace; font-weight:bold;">' + l.replacement_serial_no + '</span></td>' +
          '<td>' + (l.remarks && l.remarks.indexOf('ERP:') !== -1 ? l.remarks.split('ERP:')[1].split(';')[0] : 'Busy/Tally') + '</td>' +
          '<td><strong style="font-family:monospace;">' + (l.accounting_ref_no || '-') + '</strong></td>' +
          '<td>' + (l.updated_by || 'Staff') + '</td>' +
          '<td>' + formatDate(l.updated_at) + '</td>' +
          '<td><small>' + (l.remarks || '-') + '</small></td>' +
          '<td>' + actionBtns + '</td>';
        tbodyHistory.appendChild(tr);
      });
    }
  }
}

  var btnCom = document.getElementById('tab-btn-ch-com');

  if (btnAll) btnAll.classList.toggle('active', tab === 'all');

function renderChallansTable(params) {
  if (params && params.tab) {
    BWMS.challansTab = params.tab;
    var btnAll = document.getElementById('tab-btn-ch-all');
    var btnRet = document.getElementById('tab-btn-ch-ret');
    var btnCom = document.getElementById('tab-btn-ch-com');
    if (btnAll) btnAll.classList.toggle('active', params.tab === 'all');
    if (btnRet) btnRet.classList.toggle('active', params.tab === 'ret');
    if (btnCom) btnCom.classList.toggle('active', params.tab === 'com');
  }
  if (params && params.filter && document.getElementById('filter-challans-search')) {
    document.getElementById('filter-challans-search').value = params.filter;
  }
  if (params && params.search && document.getElementById('filter-challans-search')) {
    document.getElementById('filter-challans-search').value = params.search;
  }

  var search = (document.getElementById('filter-challans-search') ? document.getElementById('filter-challans-search').value : '').toLowerCase().trim();
  var tab = BWMS.challansTab || 'all';

  var list = [];
  var seenChallans = new Set();

  // 1. Load actual delivery challans from master database
  (BWMS.challans || []).forEach(function(ch) {
    if (!ch.challan_no) return;
    seenChallans.add(ch.challan_no);
    var isReturn = (ch.challan_type === 'BATTERY_RETURN' || String(ch.challan_no).indexOf('RET') !== -1 || ch.recipient_type !== 'COMPANY');
    list.push({
      challan_no: ch.challan_no,
      type: isReturn ? 'BATTERY_RETURN' : 'COMPANY_DISPATCH',
      date: ch.challan_date || ch.created_at,
      recipient: ch.recipient_name || 'Customer / Dealer',
      serials: ch.battery_serial_no || (ch.quantity ? ch.quantity + ' Batteries' : '-'),
      status: ch.status || 'GENERATED',
      ticket_no: ch.ticket_no || '',
      battery_model: ch.battery_model || ''
    });
  });

  // 2. Load Company Dispatches if not already recorded in challans
  (BWMS.dispatches || []).forEach(function(d) {
    var cNo = d.company_challan_no || d.dispatch_batch_no;
    if (cNo && !seenChallans.has(cNo)) {
      seenChallans.add(cNo);
      list.push({
        challan_no: cNo,
        type: 'COMPANY_DISPATCH',
        date: d.dispatch_date,
        recipient: d.company_name || 'Amaron Batteries Ltd.',
        serials: (d.battery_count || d.claim_count || 1) + ' Batteries (' + (d.carrier_transporter || 'Van') + ')',
        status: 'DISPATCHED',
        dispatch_batch_no: d.dispatch_batch_no
      });
    }
  });

  // 3. Surface any rejected tickets awaiting return challan generation
  (BWMS.tickets || []).forEach(function(t) {
    var s = (t.status || '').toUpperCase();
    if (s === 'REJECTED_RETURN_PENDING' || s === 'TEST_REJECTED' || (s.indexOf('REJECT') !== -1 && s !== 'REJECTED_RETURNED')) {
      var hasChallan = list.some(function(item) { return item.ticket_no === t.ticket_no && item.type === 'BATTERY_RETURN'; });
      if (!hasChallan) {
        list.push({
          challan_no: 'PENDING (' + t.ticket_no + ')',
          type: 'BATTERY_RETURN',
          date: t.date_received,
          recipient: (t.source_type === 'DEALER' ? (t.dealer_name || t.customer_name) : t.customer_name),
          serials: t.original_serial_no,
          status: 'CHALLAN_NOT_GENERATED',
          ticket_no: t.ticket_no,
          battery_model: t.battery_model,
          is_uncreated: true
        });
      }
    }
  });

  setElText('ch-all-count', list.length);
  setElText('ch-ret-count', list.filter(function(i) { return i.type === 'BATTERY_RETURN'; }).length);
  setElText('ch-com-count', list.filter(function(i) { return i.type === 'COMPANY_DISPATCH'; }).length);

  var filtered = list.filter(function(item) {
    if (tab === 'ret' && item.type !== 'BATTERY_RETURN') return false;
    if (tab === 'com' && item.type !== 'COMPANY_DISPATCH') return false;
    if (search) {
      var blob = [item.challan_no, item.recipient, item.serials, item.status, item.ticket_no].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  setElText('challans-count-badge', filtered.length + ' challans');

  var tbody = document.getElementById('challans-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:25px; color:#94a3b8;">No delivery challans recorded yet.</td></tr>';
    return;
  }

  filtered.slice().reverse().forEach(function(item) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong style="color:var(--accent); font-family:monospace;">' + item.challan_no + '</strong></td>' +
      '<td><span class="badge ' + (item.type === 'BATTERY_RETURN' ? 'badge-amber' : 'badge-purple') + '">' + item.type + '</span></td>' +
      '<td>' + formatDate(item.date) + '</td>' +
      '<td><strong>' + item.recipient + '</strong></td>' +
      '<td><span style="font-family:monospace;">' + item.serials + '</span></td>' +
      '<td>' + renderStatusBadge(item.status) + '</td>' +
      '<td>' + renderChallanActions(item) + '</td>';
    tbody.appendChild(tr);
  });
}

// ─── SERVICE BATTERIES STOCK, ASSIGNMENT, BLOCKING & ROTATION TRACKER ─────────

function switchSbTab(tab) {
  BWMS.sbTab = tab;
  var tabs = ['pool', 'rotation', 'logs'];
  tabs.forEach(function(t) {
    var btn = document.getElementById('tab-btn-sb-' + t);
    var cont = document.getElementById('container-sb-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
    if (cont) cont.style.display = (t === tab) ? 'block' : 'none';
  });
  renderServiceBatteriesView();
}

function renderServiceBatteriesView() {
  var pool = BWMS.serviceBatteries || [];
  var logs = BWMS.serviceBatteryLogs || [];

  var total = pool.length;
  var availList = pool.filter(function(s) {
    var st = String(s.status || 'AVAILABLE').toUpperCase();
    var blk = s.is_blocked === true || String(s.is_blocked).toUpperCase() === 'TRUE';
    return st === 'AVAILABLE' && !blk;
  });
  var assignedList = pool.filter(function(s) {
    return String(s.status || '').toUpperCase() === 'ASSIGNED';
  });
  var blockedList = pool.filter(function(s) {
    var st = String(s.status || '').toUpperCase();
    var blk = s.is_blocked === true || String(s.is_blocked).toUpperCase() === 'TRUE';
    return st === 'BLOCKED' || blk;
  });
  var totalRotations = pool.reduce(function(sum, s) {
    return sum + (parseInt(s.rotation_count, 10) || 0);
  }, 0);

  setElText('sb-kpi-total', total);
  setElText('sb-kpi-available', availList.length);
  setElText('sb-kpi-assigned', assignedList.length);
  setElText('sb-kpi-blocked', blockedList.length);
  setElText('sb-kpi-rotations', totalRotations);
  setElText('badge-service-batteries', availList.length);

  setElText('sb-pool-count', total);
  setElText('sb-rotation-count', total);
  setElText('sb-logs-count', logs.length);

  var search = (document.getElementById('filter-sb-search') ? document.getElementById('filter-sb-search').value : '').toLowerCase().trim();
  var statusFilter = document.getElementById('filter-sb-status') ? document.getElementById('filter-sb-status').value : 'ALL';
  var rotFilter = document.getElementById('filter-sb-rotation') ? document.getElementById('filter-sb-rotation').value : 'ALL';

  var filtered = pool.filter(function(s) {
    var st = String(s.status || 'AVAILABLE').toUpperCase();
    var blk = s.is_blocked === true || String(s.is_blocked).toUpperCase() === 'TRUE';
    var rotCnt = parseInt(s.rotation_count, 10) || 0;

    if (statusFilter === 'AVAILABLE' && (st !== 'AVAILABLE' || blk)) return false;
    if (statusFilter === 'ASSIGNED' && st !== 'ASSIGNED') return false;
    if (statusFilter === 'BLOCKED' && st !== 'BLOCKED' && !blk) return false;

    if (rotFilter === 'CURRENTLY_OUT' && st !== 'ASSIGNED') return false;
    if (rotFilter === 'ROTATED' && rotCnt < 1) return false;
    if (rotFilter === 'NEVER_ROTATED' && rotCnt > 0) return false;

    if (search) {
      var blob = [s.sb_id, s.serial_no, s.brand, s.model_name, s.current_customer_name, s.current_mobile, s.current_ticket_no, s.block_reason, s.condition_notes].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  setElText('sb-count-badge', filtered.length + ' of ' + total + ' units');

  // Tab 1: Stock Pool & Assignment
  var tbodyPool = document.getElementById('sb-pool-body');
  if (tbodyPool) {
    tbodyPool.innerHTML = '';
    if (filtered.length === 0) {
      tbodyPool.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:25px; color:#94a3b8;">No service batteries match the current filter. Click "+ Add Service Battery" to record available stock.</td></tr>';
    } else {
      filtered.forEach(function(s) {
        var st = String(s.status || 'AVAILABLE').toUpperCase();
        var blk = s.is_blocked === true || String(s.is_blocked).toUpperCase() === 'TRUE';
        var rotCnt = parseInt(s.rotation_count, 10) || 0;
        var daysOut = (st === 'ASSIGNED' && s.assigned_date) ? calcDaysElapsed(s.assigned_date) : 0;

        var statusHtml = '';
        if (st === 'ASSIGNED') {
          statusHtml = '<span class="badge badge-sb-assigned">🔒 ASSIGNED (LOCKED)</span>';
          if (blk) statusHtml += '<br><span class="badge badge-sb-blocked" style="margin-top:4px;">🚫 BLOCKED: ' + escapeHtml(s.block_reason || 'Hold') + '</span>';
        } else if (blk || st === 'BLOCKED') {
          statusHtml = '<span class="badge badge-sb-blocked">🚫 BLOCKED</span>' + (s.block_reason ? '<br><small style="color:#b91c1c;">' + escapeHtml(s.block_reason) + '</small>' : '');
        } else {
          statusHtml = '<span class="badge badge-sb-available">✅ AVAILABLE</span>';
        }

        var custodyHtml = '<span style="color:#94a3b8;">In Shop Stock</span>';
        if (st === 'ASSIGNED') {
          custodyHtml = '<strong>' + escapeHtml(s.current_customer_name || 'Customer') + '</strong>' +
            (s.current_mobile ? '<br><small style="color:#64748b;">📞 ' + escapeHtml(s.current_mobile) + '</small>' : '') +
            (s.current_ticket_no ? '<br><small style="color:var(--accent); cursor:pointer; font-weight:700;" onclick="showTimeline(\'' + escapeHtml(s.current_ticket_no) + '\')">🎫 ' + escapeHtml(s.current_ticket_no) + '</small>' : '');
        }

        var rotHtml = '<span class="rotation-pill ' + (st === 'ASSIGNED' ? 'active-out' : (rotCnt > 0 ? 'rotated' : '')) + '">🔄 ' + rotCnt + ' rotation' + (rotCnt === 1 ? '' : 's') + '</span>';
        if (st === 'ASSIGNED') {
          rotHtml += '<br><small style="color:#b45309; font-weight:700;">Out ' + daysOut + 'd (since ' + formatDate(s.assigned_date) + ')</small>';
        } else if (s.last_rotated_date) {
          rotHtml += '<br><small style="color:#64748b;">Last: ' + formatDate(s.last_rotated_date) + '</small>';
        }

        var actHtml = '<div style="display:flex; gap:6px; flex-wrap:wrap;">';
        if (st === 'AVAILABLE' && !blk) {
          actHtml += '<button class="btn btn-primary btn-sm" onclick="openAssignServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\')">🤝 Assign</button>';
          actHtml += '<button class="btn btn-secondary btn-sm" onclick="openBlockServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\', true)">🚫 Block</button>';
          actHtml += '<button class="btn btn-danger btn-sm" onclick="deleteServiceBattery(\'' + escapeHtml(s.sb_id || s.serial_no) + '\', \'' + escapeHtml(s.serial_no) + '\')">🗑️</button>';
        } else if (st === 'ASSIGNED') {
          actHtml += '<button class="btn btn-success btn-sm" onclick="openReturnServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\')">↩️ Return</button>';
          if (!blk) {
            actHtml += '<button class="btn btn-secondary btn-sm" onclick="openBlockServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\', true)">🚫 Block</button>';
          } else {
            actHtml += '<button class="btn btn-secondary btn-sm" onclick="openBlockServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\', false)">🔓 Unblock</button>';
          }
        } else {
          actHtml += '<button class="btn btn-success btn-sm" onclick="openBlockServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\', false)">🔓 Unblock</button>';
          actHtml += '<button class="btn btn-danger btn-sm" onclick="deleteServiceBattery(\'' + escapeHtml(s.sb_id || s.serial_no) + '\', \'' + escapeHtml(s.serial_no) + '\')">🗑️</button>';
        }
        actHtml += '</div>';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><span class="serial-badge">' + escapeHtml(s.serial_no) + '</span><br><small style="color:#94a3b8;">' + escapeHtml(s.sb_id || '') + '</small></td>' +
          '<td><strong>' + escapeHtml(s.brand || 'Amaron') + '</strong> — ' + escapeHtml(s.model_name || '-') + '<br><small style="color:#64748b;">' + (s.capacity_ah ? s.capacity_ah + ' Ah' : '') + '</small></td>' +
          '<td>' + statusHtml + '</td>' +
          '<td>' + custodyHtml + '</td>' +
          '<td>' + rotHtml + '</td>' +
          '<td><small>' + escapeHtml(s.condition_notes || '-') + '</small></td>' +
          '<td>' + actHtml + '</td>';
        tbodyPool.appendChild(tr);
      });
    }
  }

  // Tab 2: Rotation Tracker & Analytics
  var outNames = assignedList.map(function(s) {
    return s.serial_no + ' (' + (s.current_customer_name || 'Cust') + ', ' + calcDaysElapsed(s.assigned_date) + 'd)';
  });
  setElText('sb-currently-out-summary', outNames.length > 0 ? outNames.slice(0, 3).join(' • ') + (outNames.length > 3 ? ' +' + (outNames.length - 3) + ' more' : '') : 'All service batteries in shop');

  var sortedRot = pool.slice().sort(function(a, b) {
    var aOut = String(a.status).toUpperCase() === 'ASSIGNED' ? 1 : 0;
    var bOut = String(b.status).toUpperCase() === 'ASSIGNED' ? 1 : 0;
    if (aOut !== bOut) return bOut - aOut;
    return (parseInt(b.rotation_count, 10) || 0) - (parseInt(a.rotation_count, 10) || 0);
  });
  var topRot = sortedRot.length > 0 && (parseInt(sortedRot[0].rotation_count, 10) || 0) > 0 ? sortedRot[0] : null;
  setElText('sb-most-rotated-summary', topRot ? (topRot.serial_no + ' — ' + topRot.rotation_count + ' rotations') : 'No rotations recorded yet');
  var neverCnt = pool.filter(function(s) { return (parseInt(s.rotation_count, 10) || 0) === 0; }).length;
  setElText('sb-never-rotated-summary', neverCnt + ' idle unit' + (neverCnt === 1 ? '' : 's') + ' (0 rotations)');

  // Sum total days rotated per battery from logs
  var daysBySerial = {};
  logs.forEach(function(l) {
    if (l.action_type === 'RETURNED' && l.serial_no) {
      daysBySerial[l.serial_no] = (daysBySerial[l.serial_no] || 0) + (parseInt(l.days_rotated, 10) || 0);
    }
  });

  var tbodyRot = document.getElementById('sb-rotation-body');
  if (tbodyRot) {
    tbodyRot.innerHTML = '';
    if (sortedRot.length === 0) {
      tbodyRot.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:25px; color:#94a3b8;">No service batteries in stock pool yet.</td></tr>';
    } else {
      sortedRot.forEach(function(s) {
        var st = String(s.status || 'AVAILABLE').toUpperCase();
        var rotCnt = parseInt(s.rotation_count, 10) || 0;
        var daysOut = (st === 'ASSIGNED' && s.assigned_date) ? calcDaysElapsed(s.assigned_date) : 0;
        var totalDays = (daysBySerial[s.serial_no] || 0) + daysOut;
        var rotStateBadge = st === 'ASSIGNED'
          ? '<span class="badge badge-amber">🔄 Currently Rotated Out (' + daysOut + 'd)</span>'
          : (rotCnt > 0 ? '<span class="badge badge-green">✅ Rotated (' + rotCnt + 'x)</span>' : '<span class="badge badge-gray">⏸️ Never Rotated</span>');

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><span class="serial-badge">' + escapeHtml(s.serial_no) + '</span></td>' +
          '<td>' + escapeHtml(s.model_name || '-') + '</td>' +
          '<td><strong>' + rotCnt + '</strong></td>' +
          '<td>' + rotStateBadge + '</td>' +
          '<td>' + (st === 'ASSIGNED' ? ('<strong>' + escapeHtml(s.current_customer_name || '-') + '</strong>' + (s.current_ticket_no ? ' (' + escapeHtml(s.current_ticket_no) + ')' : '')) : '<span style="color:#94a3b8;">In Stock</span>') + '</td>' +
          '<td>' + (s.last_rotated_date ? formatDate(s.last_rotated_date) : '-') + '</td>' +
          '<td><strong>' + totalDays + ' day' + (totalDays === 1 ? '' : 's') + '</strong></td>' +
          '<td>' + (st === 'ASSIGNED'
            ? '<button class="btn btn-success btn-sm" onclick="openReturnServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\')">↩️ Mark Returned</button>'
            : (st === 'AVAILABLE' && !(s.is_blocked === true || String(s.is_blocked).toUpperCase() === 'TRUE')
              ? '<button class="btn btn-primary btn-sm" onclick="openAssignServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\')">🤝 Assign</button>'
              : '<button class="btn btn-secondary btn-sm" onclick="openBlockServiceBatteryModal(\'' + escapeHtml(s.sb_id || s.serial_no) + '\', false)">🔓 Unblock</button>')) + '</td>';
        tbodyRot.appendChild(tr);
      });
    }
  }

  // Tab 3: Custody & Rotation Log
  var tbodyLogs = document.getElementById('sb-logs-body');
  if (tbodyLogs) {
    tbodyLogs.innerHTML = '';
    var filteredLogs = logs.filter(function(l) {
      if (!search) return true;
      var blob = [l.serial_no, l.model_name, l.action_type, l.customer_name, l.mobile, l.ticket_no, l.remarks].join(' ').toLowerCase();
      return blob.indexOf(search) !== -1;
    });
    if (filteredLogs.length === 0) {
      tbodyLogs.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px; color:#94a3b8;">No rotation or custody events logged yet.</td></tr>';
    } else {
      filteredLogs.slice().reverse().slice(0, 150).forEach(function(l) {
        var actBadgeClass = l.action_type === 'ASSIGNED' ? 'badge-blue' : (l.action_type === 'RETURNED' ? 'badge-green' : (l.action_type === 'BLOCKED' || l.action_type === 'REMOVED' ? 'badge-red' : 'badge-gray'));
        var datesText = (l.assigned_date ? 'Out: ' + formatDate(l.assigned_date) : '') + (l.returned_date ? '<br>In: ' + formatDate(l.returned_date) : '');
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><small style="color:#64748b;">' + formatDate(l.created_at) + '</small></td>' +
          '<td><span class="badge ' + actBadgeClass + '">' + escapeHtml(l.action_type || '-') + '</span></td>' +
          '<td><span class="serial-badge">' + escapeHtml(l.serial_no || '-') + '</span></td>' +
          '<td>' + escapeHtml(l.model_name || '-') + '</td>' +
          '<td>' + (l.customer_name ? ('<strong>' + escapeHtml(l.customer_name) + '</strong>' + (l.mobile ? '<br><small>' + escapeHtml(l.mobile) + '</small>' : '')) : '-') + '</td>' +
          '<td>' + (l.ticket_no ? '<strong style="color:var(--accent); cursor:pointer;" onclick="showTimeline(\'' + escapeHtml(l.ticket_no) + '\')">' + escapeHtml(l.ticket_no) + '</strong>' : '-') + '</td>' +
          '<td><small>' + (datesText || '-') + '</small></td>' +
          '<td>' + (l.days_rotated !== '' && l.days_rotated !== undefined && l.action_type === 'RETURNED' ? ('<strong>' + l.days_rotated + 'd</strong>') : '-') + '</td>' +
          '<td><small>' + escapeHtml(l.remarks || '-') + '</small></td>';
        tbodyLogs.appendChild(tr);
      });
    }
  }
}

function handleAddServiceBatterySubmit(e) {
  e.preventDefault();
  var payload = {
    sb_id: document.getElementById('sb-edit-id').value || '',
    serial_no: document.getElementById('sb-add-serial').value.trim(),
    brand: document.getElementById('sb-add-brand').value.trim(),
    model_name: document.getElementById('sb-add-model').value.trim(),
    capacity_ah: document.getElementById('sb-add-ah').value,
    condition_notes: document.getElementById('sb-add-notes').value.trim(),
    is_blocked: document.getElementById('sb-add-blocked').checked,
    block_reason: document.getElementById('sb-add-block-reason').value.trim()
  };

  closeModal('modal-sb-add');

  callServer('apiAddServiceBattery', [payload], function(res) {
    if (res && res.success) {
      if (res.data && res.data.sb_id) {
        var idx = (BWMS.serviceBatteries || []).findIndex(function(s) { return s.sb_id === res.data.sb_id; });
        if (idx === -1) BWMS.serviceBatteries.push(res.data);
        else BWMS.serviceBatteries[idx] = res.data;
        saveStateToLocalCache();
        populateDropdowns();
        renderServiceBatteriesView();
        renderDashboard();
      }
      showToast(res.message || 'Service battery added to stock.', 'success');
      syncAllData(false);
    } else {
      showToast((res && (res.error || res.message)) ? (res.error || res.message) : 'Failed to save service battery', 'error');
    }
  });
}

function openAssignServiceBatteryModal(sbIdOrSerial, prefillTicketNo) {
  document.getElementById('form-sb-assign').reset();
  document.getElementById('sb-assign-date').value = new Date().toISOString().split('T')[0];

  var sb = (BWMS.serviceBatteries || []).find(function(s) {
    return s.sb_id === sbIdOrSerial || s.serial_no === sbIdOrSerial;
  });
  if (!sb && !sbIdOrSerial) {
    sb = (BWMS.serviceBatteries || []).find(function(s) {
      return String(s.status || 'AVAILABLE').toUpperCase() === 'AVAILABLE' && !(s.is_blocked === true || String(s.is_blocked).toUpperCase() === 'TRUE');
    });
  }
  if (!sb) {
    showToast('No available service battery found in stock. Please add one first.', 'warning');
    navigateTo('service-batteries');
    return;
  }

  document.getElementById('sb-assign-id').value = sb.sb_id || sb.serial_no;
  document.getElementById('sb-assign-view-serial').textContent = sb.serial_no;
  document.getElementById('sb-assign-view-model').textContent = sb.model_name || 'Service Battery';

  // Populate open tickets dropdown
  var tktSel = document.getElementById('sb-assign-ticket');
  if (tktSel) {
    tktSel.innerHTML = '<option value="">-- Direct Customer Assignment (No Ticket) --</option>';
    (BWMS.tickets || []).forEach(function(t) {
      var st = String(t.status || '').toUpperCase();
      if (st === 'CLOSED' || st === 'CLAIM_CLOSED' || st === 'REJECTED_RETURNED') return;
      var opt = document.createElement('option');
      opt.value = t.ticket_no;
      opt.textContent = t.ticket_no + ' — ' + (t.customer_name || t.dealer_name) + ' (' + t.original_serial_no + ')';
      tktSel.appendChild(opt);
    });
    if (prefillTicketNo) {
      tktSel.value = prefillTicketNo;
      handleAssignServiceBatterySelectTicket(prefillTicketNo);
    }
  }

  openModal('modal-sb-assign');
}

function handleAssignServiceBatterySelectTicket(ticketNo) {

// ─── REPORTS & ANALYTICS RENDERER ─────────────────────────────────────────────

function renderReportsView() {
  var claims = BWMS.claims || [];
  var tickets = BWMS.tickets || [];

  // Ageing Distribution
  var a07 = 0, a815 = 0, a1630 = 0, a3160 = 0, a60p = 0;
  claims.forEach(function(c) {
    if (c.status === 'SENT_TO_COMPANY') {
      var d = calcDaysElapsed(c.company_dispatch_date);
      if (d <= 7) a07++;
      else if (d <= 15) a815++;
      else if (d <= 30) a1630++;
      else if (d <= 60) a3160++;
      else a60p++;
    }
  });

  setElText('rep-ageing-0-7', a07);
  setElText('rep-ageing-8-15', a815);
  setElText('rep-ageing-16-30', a1630);
  setElText('rep-ageing-31-60', a3160);
  setElText('rep-ageing-60-plus', a60p);

  // Model Breakdown Table
  var modelMap = {};
  BWMS.models.forEach(function(m) {
    var key = m.model_name || m.model_code;
    modelMap[key] = {
      code: m.model_code || key,
      name: m.model_name || key,
      warranty: (m.warranty_months || 24),
      received: 0,
      passed: 0,
      rejected: 0
    };
  });

  tickets.forEach(function(t) {
    var key = t.battery_model || 'Unknown';
    if (!modelMap[key]) {
      modelMap[key] = { code: key, name: key, warranty: 24, received: 0, passed: 0, rejected: 0 };
    }
    modelMap[key].received++;
    var s = (t.status || '').toUpperCase();
    if (s === 'PASSED' || s === 'TEST_PASSED' || s === 'CLAIM_CREATED' || s === 'READY_FOR_COMPANY' || s === 'SENT_TO_COMPANY' || s === 'REPLACEMENT_RECEIVED' || s === 'STOCK_UPDATED' || s === 'CLOSED') {
      modelMap[key].passed++;
    } else if (s.indexOf('REJECT') !== -1) {
      modelMap[key].rejected++;
    }
  });

  var tbodyModels = document.getElementById('reports-models-body');
  if (tbodyModels) {
    tbodyModels.innerHTML = '';
    var modelKeys = Object.keys(modelMap);
    if (modelKeys.length === 0) {
      tbodyModels.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:15px; color:#94a3b8;">No model performance data available.</td></tr>';
    } else {
      modelKeys.forEach(function(k) {
        var m = modelMap[k];
        var rate = (m.received > 0) ? Math.round((m.rejected / m.received) * 100) : 0;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + m.code + '</strong></td>' +
          '<td>' + m.name + '</td>' +
          '<td>' + m.warranty + ' Months</td>' +
          '<td><strong>' + m.received + '</strong></td>' +
          '<td><span style="color:#16a34a; font-weight:bold;">' + m.passed + '</span></td>' +
          '<td><span style="color:#dc2626; font-weight:bold;">' + m.rejected + '</span></td>' +
          '<td>' + rate + '%</td>';
        tbodyModels.appendChild(tr);
      });
    }
  }

  // Dealer Breakdown Table
  var dealerMap = {};
  BWMS.dealers.forEach(function(d) {
    dealerMap[d.dealer_name] = { name: d.dealer_name, total: 0, pending: 0, closed: 0 };
  });

  claims.forEach(function(c) {
    if (c.dealer_name) {
      if (!dealerMap[c.dealer_name]) {
        dealerMap[c.dealer_name] = { name: c.dealer_name, total: 0, pending: 0, closed: 0 };
      }
      dealerMap[c.dealer_name].total++;
      var cs = (c.status || '').toUpperCase();
      if (cs === 'SENT_TO_COMPANY') dealerMap[c.dealer_name].pending++;
      if (cs === 'CLOSED' || cs === 'CLAIM_CLOSED') dealerMap[c.dealer_name].closed++;
    }
  });

  var tbodyDealers = document.getElementById('reports-dealers-body');
  if (tbodyDealers) {
    tbodyDealers.innerHTML = '';
    var dKeys = Object.keys(dealerMap);
    if (dKeys.length === 0) {
      tbodyDealers.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#94a3b8;">No dealer warranty records found.</td></tr>';
    } else {
      dKeys.forEach(function(dk) {
        var d = dealerMap[dk];
        var resRate = (d.total > 0) ? Math.round((d.closed / d.total) * 100) : 0;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + d.name + '</strong></td>' +
          '<td><strong>' + d.total + '</strong></td>' +
          '<td><span class="badge badge-amber">' + d.pending + '</span></td>' +
          '<td><span class="badge badge-green">' + d.closed + '</span></td>' +
          '<td>' + resRate + '%</td>';
        tbodyDealers.appendChild(tr);
      });
    }
  }
}

// ─── AUDIT TRAIL RENDERER ─────────────────────────────────────────────────────

function renderAuditTable() {
  var search = (document.getElementById('filter-audit-search') ? document.getElementById('filter-audit-search').value : '').toLowerCase().trim();
  var actionFilter = document.getElementById('filter-audit-action') ? document.getElementById('filter-audit-action').value : 'ALL';

  var logs = BWMS.auditLog || [];
  var filtered = logs.filter(function(a) {
    if (actionFilter !== 'ALL') {
      var act = (a.action || '').toUpperCase();
      var af = actionFilter.toUpperCase();
      if (act !== af && act.indexOf(af.replace('_CREATE', '').replace('_RECEIVE', '').replace('_UPDATE', '').replace('_CLAIM', '')) === -1) {
        return false;
      }
    }
    if (search) {
      var blob = [a.action, a.entity_type, a.entity_id, a.user_email, a.details].join(' ').toLowerCase();
      if (blob.indexOf(search) === -1) return false;
    }
    return true;
  });

  setElText('audit-count-badge', filtered.length + ' events');

  var tbody = document.getElementById('audit-table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:25px; color:#94a3b8;">No audit trail events found.</td></tr>';
    return;
  }

  filtered.slice().reverse().slice(0, 100).forEach(function(a) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><small style="color:#64748b;">' + formatDate(a.timestamp) + '</small></td>' +
      '<td><strong>' + (a.action || '') + '</strong></td>' +
      '<td>' + (a.entity_type || a.record_type || '-') + '</td>' +
      '<td><strong style="color:var(--accent);">' + (a.entity_id || a.record_id || '-') + '</strong></td>' +
      '<td>' + (a.user_email || a.performed_by || 'system') + '</td>' +
      '<td><small>' + (a.details || '-') + '</small></td>';
    tbody.appendChild(tr);
  });
}

function handleAddStaffSubmit(e) {
  e.preventDefault();
  var email = (document.getElementById('new-staff-email').value || '').trim().toLowerCase();
  var name = (document.getElementById('new-staff-name').value || '').trim();
  var role = document.getElementById('new-staff-role').value || 'OPERATOR';
  if (!email || !name) return;

  closeModal('modal-add-staff');

  callServer('apiSaveStaff', [{ email: email, name: name, role: role, active: true }], function(res) {
    if (res && res.success) {
      if (res.data && res.data.email) {
        var idx = (BWMS.staffList || []).findIndex(function(s) { return s.email === res.data.email; });
        if (idx === -1) (BWMS.staffList = BWMS.staffList || []).push(res.data);
        else BWMS.staffList[idx] = res.data;
        renderSettingsView();
      }
      showToast(res.message || ('Authorized ' + email + ' as ' + role), 'success');
    } else {
      showToast((res && (res.error || res.message)) ? (res.error || res.message) : 'Failed to save staff member', 'error');

  });

function toggleStaffActive(email, nextActive) {
  if (!BWMS.isAdminUser) {
    showToast('Only an Admin can update staff access.', 'error');
    return;
  }
  callServer('apiToggleStaffActive', [{ email: email, active: !!nextActive }], function(res) {
    if (res && res.success) {
      var st = (BWMS.staffList || []).find(function(s) { return s.email === email; });
      if (st) st.active = !!nextActive;
      renderSettingsView();
      showToast(res.message || ('Updated access for ' + email), 'success');
    } else {
      showToast((res && (res.error || res.message)) ? (res.error || res.message) : 'Failed to update staff status', 'error');
    }
  });
}

function deleteStaffMember(email) {
  if (!BWMS.isAdminUser) {
    showToast('Only an Admin can remove staff accounts.', 'error');
    return;
  }
  if (String(email).toLowerCase() === BOOTSTRAP_ADMIN_EMAIL) {
    showToast('Primary bootstrap admin cannot be removed.', 'warning');
    return;
  }
  if (!confirm('Revoke and delete staff access for "' + email + '"?')) return;
  callServer('apiDeleteStaff', [email], function(res) {
    if (res && res.success) {
      BWMS.staffList = (BWMS.staffList || []).filter(function(s) { return s.email !== email; });
      renderSettingsView();
      showToast(res.message || ('Removed staff access for ' + email), 'success');
    } else {
      showToast((res && (res.error || res.message)) ? (res.error || res.message) : 'Failed to remove staff', 'error');

}

// ─── UNIVERSAL TIMELINE & INSTANT SEARCH ─────────────────────────────────────

function handleUniversalSearchInput(val) {
  val = (val || '').trim();
  var dropdown = document.getElementById('search-suggestions-dropdown');
  if (!dropdown) return;

  if (val.length < 2) {
    dropdown.style.display = 'none';
    return;
  }

  var lower = val.toLowerCase();
  var matches = [];

  // Search Tickets
  (BWMS.tickets || []).forEach(function(t) {
    if (t.original_serial_no && t.original_serial_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'SERIAL', title: 'Serial: ' + t.original_serial_no, sub: t.ticket_no + ' • ' + (t.customer_name || t.dealer_name), id: t.ticket_no, ticket: t });
    } else if (t.ticket_no && t.ticket_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'TICKET', title: t.ticket_no, sub: (t.customer_name || t.dealer_name) + ' • ' + t.battery_model, id: t.ticket_no, ticket: t });
    } else if (t.customer_name && t.customer_name.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'CUSTOMER', title: t.customer_name, sub: t.ticket_no + ' • ' + (t.mobile || ''), id: t.ticket_no, ticket: t });
    } else if (t.mobile && t.mobile.indexOf(lower) !== -1) {
      matches.push({ type: 'MOBILE', title: 'Mobile: ' + t.mobile, sub: t.customer_name + ' • ' + t.ticket_no, id: t.ticket_no, ticket: t });
    }
  });

  // Search Claims
  (BWMS.claims || []).forEach(function(c) {
    if (c.claim_no && c.claim_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'CLAIM', title: c.claim_no, sub: c.battery_model + ' • ' + c.original_serial_no, id: c.claim_no, claim: c });
    } else if (c.replacement_serial_no && c.replacement_serial_no.toLowerCase().indexOf(lower) !== -1) {
      matches.push({ type: 'REP_SERIAL', title: 'Replacement: ' + c.replacement_serial_no, sub: c.claim_no + ' • ' + c.battery_model, id: c.claim_no, claim: c });
    }
  });

  if (matches.length === 0) {
    dropdown.innerHTML =
      '<div style="padding:14px; text-align:center;">' +
      '  <div style="color:#64748b; font-size:12px; margin-bottom:8px;">No existing tickets or claims for "' + val + '"</div>' +
      '  <div style="display:flex; justify-content:center; gap:8px;">' +
      '    <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById(\'search-suggestions-dropdown\').style.display=\'none\'; openWarrantyCalcModal(null, \'' + val + '\')">⚡ Check Warranty</button>' +
      '    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById(\'search-suggestions-dropdown\').style.display=\'none\'; openIntakeModal({ serial: \'' + val + '\' })">+ Intake Ticket</button>' +
      '  </div>' +
      '</div>';
    dropdown.style.display = 'block';
    return;
  }

  // Deduplicate and take top 8
  var unique = [];
  var seen = new Set();
  matches.forEach(function(m) {
    var key = m.type + ':' + m.id;
    if (!seen.has(key) && unique.length < 8) {
      seen.add(key);
      unique.push(m);
    }
  });

  dropdown.innerHTML = '';
  unique.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'search-dropdown-item';
    var nextActionPill = '';
    if (m.ticket) {
      var na = getTicketNextAction(m.ticket);
      nextActionPill = '<span class="next-action-pill ' + na.badgeClass + '" style="font-size:10px;">' + na.stepLabel + '</span>';
    } else if (m.claim) {
      var ca = getClaimNextAction(m.claim);
      nextActionPill = '<span class="next-action-pill ' + ca.badgeClass + '" style="font-size:10px;">' + ca.stepLabel + '</span>';
    }

    div.innerHTML =
      '<div style="flex:1;">' +
      '  <div style="display:flex; align-items:center; gap:6px;">' +
      '    <strong style="font-size:13px; color:var(--text-main);">' + m.title + '</strong>' +
      '    ' + nextActionPill + ' ' +
      '  </div>' +
      '  <div style="font-size:11px; color:#64748b; margin-top:2px;">' + m.sub + '</div>' +
      '</div>' +
      '<div><span class="badge badge-gray">' + m.type + '</span></div>';
    div.onclick = function() {
      dropdown.style.display = 'none';
      showTimeline(m.id);
    };
    dropdown.appendChild(div);
  });

  dropdown.style.display = 'block';
}

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    var dropdown = document.getElementById('search-suggestions-dropdown');
    if (dropdown) dropdown.style.display = 'none';
    var val = document.getElementById('global-search-input').value.trim();
    if (val) showTimeline(val);
  }
}

function showTimeline(query) {
  if (!query) return;

  // Search local in-memory store for instant zero-latency timeline rendering
  var lower = String(query).toLowerCase().trim();
  var matchedTicket = (BWMS.tickets || []).find(function(t) {
    return (t.ticket_no && t.ticket_no.toLowerCase() === lower) ||
           (t.original_serial_no && String(t.original_serial_no).toLowerCase() === lower) ||
           (t.service_battery_serial && String(t.service_battery_serial).toLowerCase() === lower);
  });

  var matchedClaim = (BWMS.claims || []).find(function(c) {
    return (c.claim_no && c.claim_no.toLowerCase() === lower) ||
           (c.ticket_no && c.ticket_no.toLowerCase() === lower) ||
           (c.original_serial_no && String(c.original_serial_no).toLowerCase() === lower) ||
           (c.replacement_serial_no && String(c.replacement_serial_no).toLowerCase() === lower) ||
           (c.company_challan_no && String(c.company_challan_no).toLowerCase() === lower) ||
           (c.dispatch_batch_no && String(c.dispatch_batch_no).toLowerCase() === lower);
  });

  if (!matchedTicket && matchedClaim && matchedClaim.ticket_no) {
    matchedTicket = (BWMS.tickets || []).find(function(t) { return t.ticket_no === matchedClaim.ticket_no; });
  }
  if (!matchedClaim && matchedTicket && matchedTicket.ticket_no) {
    matchedClaim = (BWMS.claims || []).find(function(c) { return c.ticket_no === matchedTicket.ticket_no; });
  }

  if (!matchedTicket && !matchedClaim) {
    var matchedChallan = (BWMS.challans || []).find(function(ch) {
      return (ch.challan_no && ch.challan_no.toLowerCase() === lower) ||
             (ch.battery_serial_no && String(ch.battery_serial_no).toLowerCase() === lower);
    });
    if (matchedChallan && matchedChallan.ticket_no) {
      matchedTicket = (BWMS.tickets || []).find(function(t) { return t.ticket_no === matchedChallan.ticket_no; });
      if (matchedTicket) {
        matchedClaim = (BWMS.claims || []).find(function(c) { return c.ticket_no === matchedTicket.ticket_no; });
      }
    }
  }

  var primary = matchedClaim || matchedTicket || {};
  var metaBox = document.getElementById('timeline-meta-box');
  var nodesList = document.getElementById('timeline-nodes-list');
  if (!metaBox || !nodesList) return;

  var retCh = matchedTicket ? (BWMS.challans || []).find(function(ch) { return ch.ticket_no === matchedTicket.ticket_no && ch.challan_type !== 'COMPANY_DISPATCH'; }) : null;

  var printQuickBtns = '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">';
  if (matchedTicket) {
    printQuickBtns += '<button class="btn btn-secondary btn-sm" onclick="printIntakeSlip(\'' + matchedTicket.ticket_no + '\')">🖨️ Intake Slip</button>';
    if (retCh || (matchedTicket.status && String(matchedTicket.status).indexOf('REJECT') !== -1)) {
      printQuickBtns += '<button class="btn btn-secondary btn-sm" onclick="printReturnChallan(\'' + (retCh ? retCh.challan_no : matchedTicket.ticket_no) + '\')">🖨️ Return Challan</button>';
    }
  }
  if (matchedClaim) {
    printQuickBtns += '<button class="btn btn-secondary btn-sm" onclick="printClaimForm(\'' + matchedClaim.claim_no + '\')">🖨️ Claim Form</button>';
    if (matchedClaim.company_challan_no) {
      printQuickBtns += '<button class="btn btn-secondary btn-sm" onclick="printCompanyChallan(\'' + matchedClaim.company_challan_no + '\')">🖨️ Co. Challan</button>';
    }
  }
  printQuickBtns += '</div>';

  metaBox.innerHTML =
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
    '  <div><h3 style="font-size:16px; margin-bottom:4px;">Lifecycle Report for: <span style="color:var(--accent);">' + escapeHtml(query) + '</span></h3>' +
    '  <span style="color:#64748b; font-size:12px;">Matched: ' + escapeHtml(primary.battery_model || '-') + ' • Serial: <strong>' + escapeHtml(primary.original_serial_no || '-') + '</strong>' + (primary.replacement_serial_no ? ' • Replacement: <strong>' + escapeHtml(primary.replacement_serial_no) + '</strong>' : '') + '</span></div>' +
    '  <div>' + renderStatusBadge(primary.status || 'FOUND') + '</div>' +
    '</div>' + printQuickBtns;

  nodesList.innerHTML = '';

  // Construct events locally
  var events = [];
  if (matchedTicket) {
    events.push({
      title: 'Battery Received at Service Center',
      date: matchedTicket.date_received,
      details: 'Intake ticket ' + matchedTicket.ticket_no + ' created for party: ' + (matchedTicket.customer_name || matchedTicket.dealer_name) + ' (' + (matchedTicket.mobile || '') + ').' + (matchedTicket.service_battery_issued ? ' Loaner battery issued: ' + (matchedTicket.service_battery_serial || 'Yes') + '.' : '')
    });
  }

  // Diagnostic Test
  var tests = (BWMS.tests || []).filter(function(tst) {
    return (matchedTicket && tst.ticket_no === matchedTicket.ticket_no) || (tst.original_serial_no && String(tst.original_serial_no).toLowerCase() === lower);
  });
  tests.forEach(function(tst) {
    events.push({
      title: 'Diagnostic Test Conducted: ' + tst.test_result,
      date: tst.test_date,
      details: 'Voltage: ' + (tst.open_circuit_voltage || '-') + 'V • Load: ' + (tst.load_test_voltage || '-') + 'V • Result: ' + tst.test_result + ' • Remarks: ' + (tst.test_remarks || 'N/A')
    });
  });

  // Return Challan (if rejected)
  if (retCh) {
    events.push({
      title: 'Battery Return Delivery Challan (' + retCh.challan_no + ')',
      date: retCh.challan_date,
      details: 'Status: ' + (retCh.status || 'GENERATED') + (retCh.received_by_name ? ' • Collected by: ' + retCh.received_by_name + ' on ' + formatDate(retCh.received_date) : ' • Pending physical pickup')
    });
  }

  // Claim
  if (matchedClaim) {
    events.push({
      title: 'Warranty Claim Generated (' + matchedClaim.claim_no + ')',
      date: matchedClaim.created_at || matchedClaim.claim_date,
      details: 'Warranty classification: ' + (matchedClaim.warranty_status || 'IN_WARRANTY') + ' • Date of Sale: ' + formatDate(matchedClaim.date_of_sale)
    });

    if (matchedClaim.company_dispatch_date) {
      events.push({
        title: 'Dispatched to Battery Manufacturer Factory',
        date: matchedClaim.company_dispatch_date,
        details: 'Batch Challan: ' + (matchedClaim.company_challan_no || matchedClaim.dispatch_batch_no || 'DC-COM')
      });
    }

    if (matchedClaim.replacement_received_date) {
      var repLocTitle = getReplacementEndLabel(matchedClaim.replacement_end) + ' Replacement';
      var repModInfo = matchedClaim.replacement_model ? ('Model: ' + matchedClaim.replacement_model + ' • ') : '';
      var repPartyInfo = matchedClaim.replaced_by_party ? (' • Party: ' + matchedClaim.replaced_by_party) : '';
      events.push({
        title: repLocTitle + ' Recorded',
        date: matchedClaim.replacement_received_date,
        details: repModInfo + 'Replacement Serial: ' + (matchedClaim.replacement_serial_no || '-') + repPartyInfo + ' • Ref: ' + (matchedClaim.stock_ref_no || '-')
      });
    }

    if (matchedClaim.stock_status === 'UPDATED') {
      events.push({
        title: 'ERP Accounting Stock Inward Reconciled',
        date: matchedClaim.stock_updated_date || matchedClaim.updated_at,
        details: 'Accounting reference: ' + (matchedClaim.stock_ref_no || 'STK-IN') + ' by ' + (matchedClaim.stock_updated_by || 'Staff')
      });
    }

    if (matchedClaim.status === 'CLOSED' || matchedClaim.status === 'CLAIM_CLOSED') {
      events.push({
        title: 'Claim Closed & Battery Delivered to Customer',
        date: matchedClaim.closed_date || matchedClaim.updated_at,
        details: 'Handover complete. Replacement battery delivered.'
      });
    }
  }

  if (events.length === 0) {
    nodesList.innerHTML += '<p style="padding:20px; text-align:center; color:#94a3b8;">No chronological events recorded for this query.</p>';
  } else {
    events.forEach(function(ev) {
      var node = document.createElement('div');
      node.className = 'timeline-node';
      node.innerHTML =
        '<div class="timeline-dot"></div>' +
        '<div class="timeline-header">' +
        '  <span class="timeline-title">' + ev.title + '</span>' +
        '  <span class="timeline-date">' + (ev.date ? formatDate(ev.date) : '') + '</span>' +
        '</div>' +
        '<div class="timeline-details">' + (ev.details || '') + '</div>';
      nodesList.appendChild(node);
    });
  }

  openModal('modal-timeline');
}

    }
  });
}

function readFileAsCompressedDataUrl(file, callback, onErr) {
  var reader = new FileReader();
  reader.onerror = function() { onErr('Error reading file.'); };
  reader.onload = function(evt) {
    var rawDataUrl = evt.target.result || '';
    var mime = file.type || 'application/octet-stream';
    var isCompressibleImg = (mime === 'image/jpeg' || mime === 'image/png' || mime === 'image/webp');

    if (!isCompressibleImg || rawDataUrl.length <= 450000 || typeof Image === 'undefined') {
      if (rawDataUrl.length > 900000) {
        onErr('File size exceeds ~650KB Firestore document limit. Please upload a compressed image or smaller PDF.');
        return;
      }
      callback({ data_url: rawDataUrl, mime_type: mime, file_size_kb: Math.max(1, Math.round(rawDataUrl.length * 0.75 / 1024)) });
      return;
    }

    var img = new Image();
    img.onerror = function() {
      if (rawDataUrl.length > 900000) {
        onErr('Image exceeds size limit and could not be compressed.');
      } else {
        callback({ data_url: rawDataUrl, mime_type: mime, file_size_kb: Math.max(1, Math.round(rawDataUrl.length * 0.75 / 1024)) });
      }
    };
    img.onload = function() {
      try {
        var maxDim = 1280;
        var w = img.width || 1000;
        var h = img.height || 1000;
        if (w > maxDim || h > maxDim) {
          var scale = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        var qualities = [0.76, 0.58, 0.42];
        var outUrl = '';
        for (var qIdx = 0; qIdx < qualities.length; qIdx++) {
          outUrl = canvas.toDataURL('image/jpeg', qualities[qIdx]);
          if (outUrl.length <= 880000) break;
        }
        if (outUrl.length > 900000) {
          onErr('Compressed image still exceeds 650KB Firestore limit. Please crop or resize.');
          return;
        }
        callback({
          data_url: outUrl,
          mime_type: 'image/jpeg',
          file_size_kb: Math.max(1, Math.round(outUrl.length * 0.75 / 1024))
        });
      } catch (compErr) {
        onErr('Image compression error: ' + compErr.message);
      }
    };
    img.src = rawDataUrl;
  };
  reader.readAsDataURL(file);
}

function handleUploadSubmit(e) {
  e.preventDefault();
  var fileInput = document.getElementById('upload-file');
  if (!fileInput.files || fileInput.files.length === 0) {
    showToast('Please select a file to upload.', 'warning');
    return;
  }
  var file = fileInput.files[0];
  var claimNo = document.getElementById('upload-claim-no').value;
  var docType = document.getElementById('upload-doc-type').value;

  var submitBtn = document.getElementById('btn-upload-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving to Firebase...';

  readFileAsCompressedDataUrl(file, function(processed) {
    var data = {
      claim_no: claimNo,
      doc_type: docType,
      document_type: docType,
      file_name: file.name,
      mime_type: processed.mime_type,
      file_size_kb: processed.file_size_kb,
      data_url: processed.data_url,
      file_base64: processed.data_url.split(',')[1] || ''
    };

    callServer('apiUploadDocument', [data], function(res) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save to Firebase';
      if (res && res.success) {
        if (res.data && res.data.doc_id) {
          BWMS.claimDocuments = BWMS.claimDocuments || [];
          BWMS.claimDocuments.push(res.data);
        }
        document.getElementById('form-upload').reset();
        document.getElementById('upload-claim-no').value = claimNo;
        renderClaimDocsList(claimNo);
        renderClaimsTable();
        showToast(res.message || 'Document saved to Firebase Firestore.', 'success');
      } else {
        showToast((res && res.error) ? res.error : 'Upload failed', 'error');
      }
    }, function(errMsg) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save to Firebase';
      showToast(errMsg || 'Upload failed', 'error');
    });
  }, function(readErr) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save to Firebase';
    showToast(readErr, 'error');
  });
}

function escapeHtml(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function buildReturnChallanHTML(challanOrTicketId) {
  var rawId = String(challanOrTicketId || '').trim();
  var cleanId = rawId.replace(/^PENDING\s*\((.*?)\)$/i, '$1').trim();

  var challans = BWMS.challans || [];
  var tickets = BWMS.tickets || [];
  var tests = BWMS.tests || [];
  var claims = BWMS.claims || [];
  var comp = getPrintCompanyInfo();

  // 1. Find challan by challan_no or battery_serial_no
  var challan = challans.find(function(ch) {
    return (ch.challan_no === rawId || ch.challan_no === cleanId || ch.battery_serial_no === rawId || ch.battery_serial_no === cleanId) &&
      ch.challan_type !== 'COMPANY_DISPATCH';
  });
  if (!challan) {
    challan = challans.find(function(ch) {
      return (ch.ticket_no === cleanId || ch.ticket_no === rawId) && ch.challan_type !== 'COMPANY_DISPATCH';
    });
  }

  // 2. Find ticket
  var ticket = null;
  if (challan && challan.ticket_no) {
    ticket = tickets.find(function(t) { return t.ticket_no === challan.ticket_no; });

function generatePrintDocumentHTML(docType, id) {
  if (docType === 'return-challan') {
    return buildReturnChallanHTML(id);
  } else if (docType === 'company-challan') {
    return buildCompanyChallanHTML(id);
  } else if (docType === 'claim-form') {
    return buildClaimFormHTML(id);
  } else if (docType === 'intake-slip') {
    return buildIntakeSlipHTML(id);
  }
  return '<!DOCTYPE html><html><body><p>Unknown document type: ' + escapeHtml(docType) + '</p></body></html>';
}

function syncDirectPrintRoot(html) {
  var root = document.getElementById('direct-print-root');
  if (!root || !html) return;
  var styleMatch = html.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
  var bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  var cssText = styleMatch ? styleMatch[1] : '';
  cssText = cssText.replace(/(^|\})\s*body\s*\{/gi, '$1 #direct-print-root .print-doc-body {');
  cssText = cssText.replace(/@media\s+print\s*\{\s*body\s*\{/gi, '@media print { #direct-print-root .print-doc-body {');
  var bodyHtml = bodyMatch ? bodyMatch[1] : html;
  root.innerHTML = '<style>' + cssText + '</style><div class="print-doc-body">' + bodyHtml + '</div>';
  if (document.body && document.body.classList) {
    document.body.classList.add('has-print-doc');
  }
}

function renderPrintDocument(docType, id, title) {
  var html = generatePrintDocumentHTML(docType, id);
  BWMS.currentPrintHTML = html;

  var titleEl = document.getElementById('print-modal-title');
  if (titleEl) {
    titleEl.textContent = title || 'Document Print Preview';
  }

  // Open modal first so iframe has visible layout dimensions before rendering
  openModal('modal-print');
  syncDirectPrintRoot(html);

  var iframe = document.getElementById('print-iframe');
  if (iframe) {
    try {
      if (typeof iframe.removeAttribute === 'function') {
        iframe.removeAttribute('src');
        iframe.removeAttribute('srcdoc');
      } else {
        delete iframe.src;
      }
      var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
      if (doc && typeof doc.open === 'function') {
        doc.open();
        doc.write(html);
        doc.close();
      } else {
        iframe.srcdoc = html;
      }
    } catch (e) {
      console.warn('Iframe render fallback to srcdoc:', e);
      iframe.srcdoc = html;
    }
  }
}

function triggerIframePrint() {
  if (!BWMS.currentPrintHTML) {
    showToast('No printable document currently active.', 'warning');
    return;
  }
  syncDirectPrintRoot(BWMS.currentPrintHTML);

  if (typeof window !== 'undefined' && typeof window.print === 'function' && document.getElementById('direct-print-root')) {
    try {
      window.focus();
      window.print();
      return;
    } catch (winPrintErr) {
      console.warn('Direct window print error, trying iframe print:', winPrintErr);
    }
  }

  var iframe = document.getElementById('print-iframe');
  if (iframe && iframe.contentWindow && typeof iframe.contentWindow.print === 'function') {
    try {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
      return;
    } catch (e) {
      console.warn('Iframe print error, falling back to new tab print:', e);
    }
  }
  openPrintInNewWindow();
}

function openPrintInNewWindow() {
  if (!BWMS.currentPrintHTML) {
    showToast('No printable document currently active.', 'warning');
    return;
  }
  var html = BWMS.currentPrintHTML;
  try {
    if (typeof Blob === 'function' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function') {
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var blobUrl = URL.createObjectURL(blob);
      var blobWin = window.open(blobUrl, '_blank');
      if (blobWin) {
        blobWin.focus();
        var printed = false;
        var triggerPrintOnce = function() {
          if (printed) return;
          printed = true;
          try { blobWin.focus(); blobWin.print(); } catch (e) { }
          setTimeout(function() { try { URL.revokeObjectURL(blobUrl); } catch (e) { } }, 60000);
        };
        if (typeof blobWin.addEventListener === 'function') {
          blobWin.addEventListener('load', function() { setTimeout(triggerPrintOnce, 150); });
        }
        setTimeout(triggerPrintOnce, 500);
        return;
      }
    }
  } catch (blobErr) {
    console.warn('Blob print tab fallback:', blobErr);
  }

  var win = window.open('', '_blank');
  if (win) {
    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(function() {
      try { win.print(); } catch (e) { }
    }, 350);
  } else {
    showToast('Browser blocked pop-up window. Please allow popups or use Print Document.', 'error');
  }
}

function downloadCSV(filename, headers, rows) {
  var csvContent = '\uFEFF';
  csvContent += headers.map(escapeCSVField).join(',') + '\r\n';

  rows.forEach(function(row) {
    var line = row.map(escapeCSVField).join(',');
    csvContent += line + '\r\n';
  });

  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function escapeCSVField(val) {
  if (val === null || val === undefined) return '""';
  var str = String(val).replace(/"/g, '""');
  return '"' + str + '"';
}

function setElText(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

function calcDaysElapsed(dateStr) {
  if (!dateStr) return 0;
  try {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return 0;
    var now = new Date();
    var diffTime = Math.abs(now - d);
    return Math.floor(diffTime / (1000 * 60 * 60 * 24));
  } catch (e) {
    return 0;
  }
}

function renderSourceBadge(source) {
  if (source === 'DEALER') return '<span class="badge badge-purple">DEALER</span>';
  return '<span class="badge badge-blue">CUSTOMER</span>';
}

function renderStatusBadge(status) {
  if (!status) return '-';
  var s = status.toUpperCase();
  if (s.indexOf('PASS') !== -1 || s.indexOf('CLOSED') !== -1) return '<span class="badge badge-green">' + status + '</span>';
  if (s.indexOf('REJECT') !== -1) return '<span class="badge badge-red">' + status + '</span>';
  if (s.indexOf('PENDING') !== -1 || s.indexOf('RECEIVED') !== -1) return '<span class="badge badge-amber">' + status + '</span>';
  if (s.indexOf('DISPATCH') !== -1 || s.indexOf('COMPANY') !== -1) return '<span class="badge badge-purple">' + status + '</span>';
  return '<span class="badge badge-gray">' + status + '</span>';
}

function renderTestVerdictBadge(verdict) {
  if (verdict === 'PASS') return '<span class="badge badge-green">PASS (Eligible)</span>';
  if (verdict === 'REJECT') return '<span class="badge badge-red">REJECT (Faulty)</span>';
  return '<span class="badge badge-gray">' + (verdict || '-') + '</span>';
}

function renderWarrantyBadge(wStatus) {
  if (wStatus === 'IN_WARRANTY' || wStatus === 'FULL_REPLACEMENT') return '<span class="badge badge-green">IN WARRANTY</span>';
  if (wStatus === 'OUT_OF_WARRANTY' || wStatus === 'EXPIRED') return '<span class="badge badge-red">OUT OF WARRANTY</span>';
  return '<span class="badge badge-amber">' + (wStatus || 'UNKNOWN') + '</span>';
}

function renderAgeingBadge(days) {
  var d = parseInt(days, 10) || 0;
  if (d <= 7) return '<span class="badge badge-green">' + d + ' Days</span>';
  if (d <= 15) return '<span class="badge badge-blue">' + d + ' Days</span>';
  if (d <= 30) return '<span class="badge badge-amber">' + d + ' Days</span>';
  return '<span class="badge badge-red" style="font-weight:bold;">🚨 ' + d + ' Days</span>';
}

function getTicketNextAction(t) {
  var s = (t.status || '').toUpperCase();
  var c = (BWMS.claims || []).find(function(item) { return item.ticket_no === t.ticket_no; });

  if (s === 'RECEIVED' || s === 'TESTING') {
    return { stepNumber: 1, stepLabel: 'Step 1: Test Battery', badgeClass: 'step-blue' };
  }
  if (s === 'PASSED' || s === 'TEST_PASSED') {
    return { stepNumber: 2, stepLabel: 'Step 2: File Claim', badgeClass: 'step-green' };
  }
  if (s === 'REJECTED_RETURN_PENDING' || s === 'TEST_REJECTED' || (s.indexOf('REJECT') !== -1 && s !== 'REJECTED_RETURNED')) {
    return { stepNumber: 2, stepLabel: 'Step 2: Return Challan', badgeClass: 'step-danger' };
  }
  if (s === 'REJECTED_RETURNED' || s === 'REJECTED — RETURNED') {
    return { stepNumber: 3, stepLabel: '✅ Returned to Party', badgeClass: 'step-done' };
  }
  if (s === 'CLAIM_CREATED' || s === 'READY_FOR_COMPANY' || (c && (c.status === 'CLAIM_CREATED' || c.status === 'READY_FOR_COMPANY'))) {
    return { stepNumber: 3, stepLabel: 'Step 3: Dispatch to Co.', badgeClass: 'step-purple' };
  }
  if (c && c.status === 'SENT_TO_COMPANY') {
    return { stepNumber: 4, stepLabel: 'Step 4: Awaiting Mfr Rep', badgeClass: 'step-amber' };
  }
  if (c && c.status === 'REPLACEMENT_RECEIVED' && c.stock_status !== 'UPDATED') {
    return { stepNumber: 5, stepLabel: 'Step 5: Stock Inward Due', badgeClass: 'step-orange' };
  }
  if (c && (c.status === 'STOCK_UPDATED' || (c.status === 'REPLACEMENT_RECEIVED' && c.stock_status === 'UPDATED'))) {
    return { stepNumber: 6, stepLabel: 'Step 6: Handover & Close', badgeClass: 'step-emerald' };
  }
  if (s === 'CLOSED' || (c && c.status === 'CLOSED')) {
    return { stepNumber: 7, stepLabel: '✅ Lifecycle Completed', badgeClass: 'step-done' };
  }
  return { stepNumber: 1, stepLabel: 'Action Required', badgeClass: 'step-blue' };
}

function getClaimNextAction(c) {
  var s = (c.status || '').toUpperCase();
  if (s === 'CLAIM_CREATED' || s === 'READY_FOR_COMPANY') {
    return { stepNumber: 3, stepLabel: 'Step 3: Dispatch / Replace', badgeClass: 'step-purple' };
  }
  if (s === 'SENT_TO_COMPANY') {
    return { stepNumber: 4, stepLabel: 'Step 4: Awaiting Mfr Rep', badgeClass: 'step-amber' };
  }
  if (s === 'REPLACEMENT_RECEIVED' && c.stock_status !== 'UPDATED') {
    return { stepNumber: 5, stepLabel: 'Step 5: Log ERP Stock', badgeClass: 'step-orange' };
  }
  if (s === 'STOCK_UPDATED' || (s === 'REPLACEMENT_RECEIVED' && c.stock_status === 'UPDATED')) {
    return { stepNumber: 6, stepLabel: 'Step 6: Deliver & Close', badgeClass: 'step-emerald' };
  }
  if (s === 'CLOSED' || s === 'CLAIM_CLOSED') {
    return { stepNumber: 7, stepLabel: '✅ Claim Closed', badgeClass: 'step-done' };
  }
  return { stepNumber: 3, stepLabel: 'In Progress', badgeClass: 'step-blue' };
}

function renderTicketActions(t) {

  var s = (t.status || '').toUpperCase();
  var c = (BWMS.claims || []).find(function(item) { return item.ticket_no === t.ticket_no; });
  var retChallan = (BWMS.challans || []).find(function(ch) {
    return ch.ticket_no === t.ticket_no && (ch.challan_type === 'BATTERY_RETURN' || !ch.challan_type);
  });

  if (s === 'RECEIVED' || s === 'TESTING') {
    html += '<button class="btn btn-primary btn-sm" onclick="openTestModal(\'' + t.ticket_no + '\', \'' + (t.battery_model || '') + '\', \'' + (t.original_serial_no || '') + '\')">🔬 Test</button>';
  } else if (s === 'PASSED' || s === 'TEST_PASSED') {
    html += '<button class="btn btn-success btn-sm" onclick="openClaimModal(\'' + t.ticket_no + '\')">📝 Claim</button>';
  } else if (s === 'REJECTED_RETURN_PENDING' || s === 'TEST_REJECTED' || (s.indexOf('REJECT') !== -1 && s !== 'REJECTED_RETURNED')) {
    if (!retChallan) {
      html += '<button class="btn btn-danger btn-sm" onclick="createReturnChallan(\'' + t.ticket_no + '\')">📄 Challan</button>';
    } else {
      html += '<button class="btn btn-secondary btn-sm" onclick="printReturnChallan(\'' + retChallan.challan_no + '\')">🖨️ Print</button>';
      if (retChallan.status !== 'ACKNOWLEDGED') {
        html += '<button class="btn btn-danger btn-sm" onclick="openMarkReturnedModal(\'' + retChallan.challan_no + '\')">🤝 Handover</button>';
      }
    }
  } else if (s === 'REJECTED_RETURNED' || s === 'REJECTED — RETURNED') {
